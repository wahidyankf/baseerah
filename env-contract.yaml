# env-contract.yaml — surface registry for rhino-cli env validate
#
# Each surface entry carries:
#   root      — path relative to repo root
#   kind      — "app" (active); "terraform"/"ansible" are forward-scaffold
#   lang      — "rust" or "typescript" (app kind only)
#   allowlist — keys exempt from drift detection (framework-injected, test-only, etc.)
#
# Terraform and Ansible surfaces are commented forward-scaffold.
# Uncomment and fill in `root` when IaC is added.

surfaces:
  - root: apps/organiclever-be
    kind: app
    lang: fsharp
    allowlist:
      # Forward-declared config not yet consumed by the Phase 1 F# shell
      # (wired in later phases); declared in .env.example ahead of use.
      - ORGANICLEVER_BE_PORT
      - ORGANICLEVER_BE_CORS_ORIGINS

  - root: apps/ose-app-be
    kind: app
    lang: fsharp
    allowlist:
      # Forward-declared config not yet consumed by the Phase 1 F# shell
      # (port/CORS + OpenRouter wired in later phases); declared ahead of use.
      - OSE_APP_BE_PORT
      - OSE_APP_BE_CORS_ORIGINS
      - OSE_APP_BE_OPENROUTER_API_KEY
      - OSE_APP_BE_OPENROUTER_MODEL
      - OSE_APP_BE_OPENROUTER_BASE_URL

  - root: apps/ose-web
    kind: app
    lang: typescript
    allowlist:
      - PORT # framework-reserved Next.js dev-server port
      - HOSTNAME # framework-reserved Next.js dev-server hostname

  - root: apps/ayokoding-web
    kind: app
    lang: typescript
    allowlist:
      - PORT
      - HOSTNAME

  - root: apps/organiclever-web
    kind: app
    lang: typescript
    allowlist:
      - PORT
      - HOSTNAME

  - root: apps/ose-app-web
    kind: app
    lang: typescript
    allowlist:
      - PORT
      - HOSTNAME

  - root: apps/wahidyankf-web
    kind: app
    lang: typescript
    allowlist:
      - PORT
      - HOSTNAME

# Terraform surfaces — activate when IaC is added
# - root: infra/terraform/organiclever
#   kind: terraform  # activate when IaC is added
#   allowlist: []

