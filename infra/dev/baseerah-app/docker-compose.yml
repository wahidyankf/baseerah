services:
  baseerah-be:
    build:
      context: .
      dockerfile: Dockerfile.be.dev
    ports:
      - "19320:19320"
    volumes:
      - ../../../apps/baseerah-be:/workspace:rw
      - ../../../specs/apps/baseerah/behavior/baseerah-be/gherkin:/specs/apps/baseerah/behavior/baseerah-be/gherkin:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19320/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The dev container compiles the backend on boot (dotnet watch over a bind
      # mount); a cold CI build has no NuGet cache, so allow a long warm-up.
      start_period: 600s

