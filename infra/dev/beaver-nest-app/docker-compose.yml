services:
  beaver-nest-be:
    build:
      context: .
      dockerfile: Dockerfile.be.dev
    ports:
      - "19320:19320"
    volumes:
      - ../../../apps/beaver-nest-be:/workspace:rw
      - ../../../specs/apps/beaver-nest/behavior/beaver-nest-be/gherkin:/specs/apps/beaver-nest/behavior/beaver-nest-be/gherkin:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19320/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The dev container compiles the backend on boot (dotnet watch over a bind
      # mount); a cold CI build has no NuGet cache, so allow a long warm-up.
      start_period: 600s

  beaver-nest-fe:
    build:
      context: ../../..
      dockerfile: apps/beaver-nest-fe/Dockerfile
      args:
        BEAVER_NEST_FE_API_BASE_URL: http://beaver-nest-be:19320
    ports:
      - "19310:19310"
    environment:
      BEAVER_NEST_FE_API_BASE_URL: "http://beaver-nest-be:19320"
    depends_on:
      beaver-nest-be:
        condition: service_healthy
