x-beaver-nest-app: &beaver-nest-app
  build:
    context: ../../..
    dockerfile: apps/beaver-nest-be/Dockerfile
  environment:
    BEAVER_NEST_BE_DATA_DIRECTORY: /var/lib/beaver-nest
    BEAVER_NEST_BE_HTTP_LISTEN_ADDRESS: 0.0.0.0
    BEAVER_NEST_BE_HTTP_LISTEN_PORT: "19300"
    BEAVER_NEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"

services:
  beaver-nest-app:
    <<: *beaver-nest-app
    ports:
      - "${BEAVER_NEST_BE_VPN_HOST_IP:-127.0.0.1}:${BEAVER_NEST_BE_PUBLIC_PORT:-19300}:19300"
    volumes:
      - type: bind
        source: ${BEAVER_NEST_BE_HOST_DATA_DIRECTORY:-/tmp/beaver-nest-unconfigured-data}
        target: /var/lib/beaver-nest
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19300/api/v1/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  beaver-nest-backup:
    <<: *beaver-nest-app
    profiles: ["operations"]
    command: ["backup", "--name", "${BEAVER_NEST_BE_OPERATION_NAME:-operation.sqlite3}"]
    environment:
      BEAVER_NEST_BE_BACKUP_DIRECTORY: /var/backups/beaver-nest
      BEAVER_NEST_BE_DATA_DIRECTORY: /var/lib/beaver-nest
      BEAVER_NEST_BE_HTTP_LISTEN_ADDRESS: 0.0.0.0
      BEAVER_NEST_BE_HTTP_LISTEN_PORT: "19300"
      BEAVER_NEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"
    volumes:
      - type: bind
        source: ${BEAVER_NEST_BE_HOST_DATA_DIRECTORY:-/tmp/beaver-nest-unconfigured-data}
        target: /var/lib/beaver-nest
        bind:
          create_host_path: false
      - type: bind
        source: ${BEAVER_NEST_BE_BACKUP_DIRECTORY:-/tmp/beaver-nest-unconfigured-backups}
        target: /var/backups/beaver-nest
        bind:
          create_host_path: false

  beaver-nest-integrity:
    <<: *beaver-nest-app
    profiles: ["operations"]
    command: ["integrity"]
    volumes:
      - type: bind
        source: ${BEAVER_NEST_BE_HOST_DATA_DIRECTORY:-/tmp/beaver-nest-unconfigured-data}
        target: /var/lib/beaver-nest
        bind:
          create_host_path: false

  beaver-nest-restore:
    <<: *beaver-nest-app
    profiles: ["operations"]
    command: ["restore", "--name", "${BEAVER_NEST_BE_OPERATION_NAME:-operation.sqlite3}"]
    environment:
      BEAVER_NEST_BE_BACKUP_DIRECTORY: /var/backups/beaver-nest
      BEAVER_NEST_BE_DATA_DIRECTORY: /var/lib/beaver-nest
      BEAVER_NEST_BE_HTTP_LISTEN_ADDRESS: 0.0.0.0
      BEAVER_NEST_BE_HTTP_LISTEN_PORT: "19300"
      BEAVER_NEST_BE_SQLITE_BUSY_TIMEOUT_MILLISECONDS: "1000"
    volumes:
      - type: bind
        source: ${BEAVER_NEST_BE_HOST_DATA_DIRECTORY:-/tmp/beaver-nest-unconfigured-data}
        target: /var/lib/beaver-nest
        bind:
          create_host_path: false
      - type: bind
        source: ${BEAVER_NEST_BE_BACKUP_DIRECTORY:-/tmp/beaver-nest-unconfigured-backups}
        target: /var/backups/beaver-nest
        bind:
          create_host_path: false
