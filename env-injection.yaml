# env-injection.yaml — value-less injection contract (extends env-contract.yaml)
#
# Declares, per app, the injection HOME for its env keys at every deploy stage it
# runs in — NAMES ONLY, never values. It is the static contract `rhino-cli env
# validate` checks for internal consistency, and the checklist
# `wire-vercel-www-app-cutover` works from when populating real values.
#
# Source of truth for the key set is each app's `apps/<app>/.env.example`
# (`keys-from`). Every injection target (GitHub Environment, Vercel project, k3s
# secret) uses the SAME key names — a tier qualifier never appears in a key; the
# stage is encoded by WHICH injection home holds the value.
#
# Injection homes:
#   env-local         — gitignored apps/<app>/.env.local (developer machine)
#   compose           — infra/dev/<stack> docker-compose env (local CI), placeholders only
#   vercel-preview     — Vercel project env, Preview scope (stag-*-app-web branch)
#   vercel-production  — Vercel project env, Production scope (prod-*-www / prod-*-app-web)
#   k3s-coralpolyp     — ose-infra coralpolyp secret store (backend k3s rollout)
#
# Stages: local, local-ci, staging, production. www deploys direct to production
# (no staging); app-web has a staging gate; be ships to k3s via coralpolyp.

apps:
  # --- www tier (direct-to-prod; e2e runs on local compose) ---
  - app: ose-www
    keys-from: apps/ose-www/.env.example
    runtime: { local: env-local, local-ci: compose, production: vercel-production }
  - app: ayokoding-www
    keys-from: apps/ayokoding-www/.env.example
    runtime: { local: env-local, local-ci: compose, production: vercel-production }
  - app: organiclever-www
    keys-from: apps/organiclever-www/.env.example
    runtime: { local: env-local, local-ci: compose, production: vercel-production }
  - app: wahidyankf-www
    keys-from: apps/wahidyankf-www/.env.example
    runtime: { local: env-local, local-ci: compose, production: vercel-production }

  # --- app-web tier (gated staging promotion) ---
  - app: organiclever-app-web
    keys-from: apps/organiclever-app-web/.env.example
    runtime: { local: env-local, local-ci: compose, staging: vercel-preview, production: vercel-production }
  - app: ose-app-web
    keys-from: apps/ose-app-web/.env.example
    runtime: { local: env-local, local-ci: compose, staging: vercel-preview, production: vercel-production }

  # --- backend tier (non-Vercel; k3s via ose-infra coralpolyp) ---
  - app: organiclever-be
    keys-from: apps/organiclever-be/.env.example
    runtime: { local-ci: compose, staging: k3s-coralpolyp }
  - app: ose-be
    keys-from: apps/ose-be/.env.example
    runtime: { local-ci: compose, staging: k3s-coralpolyp }

# CI test-harness keys — test-only, NEVER in any apps/<app>/.env.example (the
# drift guard would wrongly flag them declared-but-unread). Injected only into
# GitHub Environment vars./secrets. read by the staging e2e gate.
ci-harness:
  - key: API_BASE_URL
    class: var
    # Injected inline (localhost:<be-port>) by _reusable-app-test-local-deploy-stag.yml today.
    # Staging-environment consumption (running BE E2E against a deployed staging backend) is
    # deferred — see plans/in-progress/rename-be-e2e-api-base-url Phase 2.
    environments: [organiclever-app-staging, ose-app-staging]
  - key: WEB_BASE_URL
    class: var
    environments: [organiclever-app-staging, ose-app-staging]
  - key: VERCEL_AUTOMATION_BYPASS_SECRET
    class: secret
    environments: [organiclever-app-staging, ose-app-staging]
  - key: PLAYWRIGHT_GREP_INVERT
    class: literal # set inline in the reusable workflow, not injected
    environments: []
