version: 2
app: ose
contexts:
  - name: health
    summary: >-
      Liveness endpoint — advertises service health to orchestrators and
      monitoring systems. Stateless, no DB dependency.
    layers:
      - domain
      - application
      - infrastructure
      - api
    code:
      - apps/ose-app-be/src/contexts/health
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/health.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/health

  - name: regulatory-source
    summary: >-
      Ingests and stores regulator-published rule documents (PDFs, circulars)
      with provenance metadata. Acts as the authoritative source for all
      regulatory text consumed by gap-analysis.
    layers:
      - domain
      - application
      - infrastructure
      - api
    code:
      - apps/ose-app-be/src/contexts/regulatory-source
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/regulatory-source.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/regulatory-source
    relationships:
      - to: gap-analysis
        kind: customer-supplier
        role: supplier

  - name: internal-policy
    summary: >-
      Ingests and stores company-internal documents (SOPs, manuals, procedures)
      with version and scope metadata. Acts as the authoritative source for all
      internal policy text consumed by gap-analysis.
    layers:
      - domain
      - application
      - infrastructure
      - api
    code:
      - apps/ose-app-be/src/contexts/internal-policy
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/internal-policy.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/internal-policy
    relationships:
      - to: gap-analysis
        kind: customer-supplier
        role: supplier

  - name: gap-analysis
    summary: >-
      Compares a regulatory-source corpus against an internal-policy corpus and
      emits structured GapItem records. Orchestrates calls to ai-orchestration
      for LLM-assisted comparison. Owns the gap report lifecycle.
    layers:
      - domain
      - application
      - infrastructure
      - api
    code:
      - apps/ose-app-be/src/contexts/gap-analysis
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/gap-analysis.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/gap-analysis
    relationships:
      - to: regulatory-source
        kind: customer-supplier
        role: customer
      - to: internal-policy
        kind: customer-supplier
        role: customer
      - to: ai-orchestration
        kind: customer-supplier
        role: customer

  - name: ai-orchestration
    summary: >-
      Wraps LLM calls (OpenRouter), prompt management, retry/backoff, and
      token-budget accounting. Stateless from the BE side — does not persist
      LLM outputs.
    layers:
      - domain
      - application
      - infrastructure
      - api
    code:
      - apps/ose-app-be/src/contexts/ai-orchestration
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/ai-orchestration.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/ai-orchestration
    relationships:
      - to: gap-analysis
        kind: customer-supplier
        role: supplier

  - name: media
    summary: >-
      Converts uploaded PDF files to Markdown via crane-be (Content Retrieval And
      Normalization Engine) using NATS request/reply. Stateless — does not persist
      conversion results.
    layers:
      - api
    code:
      - apps/ose-app-be/src/contexts/media
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/media.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/messaging

  - name: db
    summary: >-
      Database schema lifecycle — applies pending sqlx migrations on boot before
      the HTTP server starts. Ensures the schema is always up-to-date without
      manual intervention. Cross-cutting infrastructure concern.
    layers:
      - infrastructure
    code:
      - apps/ose-app-be/src/contexts/db
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/db.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/db

  - name: messaging
    summary: >-
      NATS client, JetStream durable stream demo, crane HTTP + NATS request/reply
      client, and the HTTP media-convert endpoint. Connects to NATS at startup
      (fail-fast on missing URL), publishes and acks on ose-app.messaging.demo,
      and delegates PDF-to-Markdown conversion to crane-be via crane.convert.
    layers:
      - infrastructure
      - api
    code:
      - apps/ose-app-be/src/messaging
    code_lang:
      - rs
    glossary: specs/apps/ose/ddd/ubiquitous-language/messaging.md
    gherkin: specs/apps/ose/behavior/app-be/gherkin/messaging
