<svg xmlns="http://www.w3.org/2000/svg" width="320" height="720" viewBox="0 0 320 720" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AyoKoding landing homepage — hi-fi, 320px overflow-proof (top fold), Option A</title>
  <desc>Smallest supported width. Same single-column layout as 375px; every element fits within 320px with no horizontal overflow (regression target from prerequisite UWT-008). Cards and CTAs are full-width with 16px gutters.</desc>
  <rect width="320" height="720" fill="#ffffff"/>
  <!-- gutter guides -->
  <line x1="16" y1="0" x2="16" y2="720" stroke="#f0f0f0" stroke-dasharray="2 3"/>
  <line x1="304" y1="0" x2="304" y2="720" stroke="#f0f0f0" stroke-dasharray="2 3"/>

  <!-- Header -->
  <rect x="0" y="0" width="320" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="320" y2="56" stroke="#e5e5e5"/>
  <text x="16" y="35" font-size="20">≡</text>
  <text x="46" y="36" font-size="16" font-weight="700" fill="#0a0a0a">AyoKoding</text>
  <text x="250" y="35" font-size="15">🔍</text>
  <circle cx="294" cy="28" r="13" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="289" y="33" font-size="11">☾</text>

  <!-- Hero -->
  <text x="16" y="106" font-size="24" font-weight="800" fill="#0a0a0a">AyoKoding —</text>
  <text x="16" y="136" font-size="24" font-weight="800" fill="#0a0a0a">learn software</text>
  <text x="16" y="166" font-size="24" font-weight="800" fill="#0a0a0a">engineering</text>
  <text x="16" y="200" font-size="13" fill="#737373">Practical notes from building a</text>
  <text x="16" y="218" font-size="13" fill="#737373">real platform.</text>
  <rect x="16" y="240" width="288" height="46" rx="8" fill="#2563eb"/>
  <text x="104" y="269" font-size="15" font-weight="600" fill="#ffffff">Browse Learn →</text>
  <rect x="16" y="296" width="288" height="46" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="122" y="325" font-size="15" font-weight="600" fill="#0a0a0a">Open Tools</text>

  <text x="16" y="392" font-size="18" font-weight="700" fill="#0a0a0a">Explore</text>
  <rect x="16" y="410" width="288" height="88" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="34" y="446" font-size="15" font-weight="700" fill="#0a0a0a">Software Engineering</text>
  <text x="34" y="470" font-size="11" fill="#737373">Languages, architecture, design.</text>
  <rect x="16" y="512" width="288" height="88" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="34" y="548" font-size="15" font-weight="700" fill="#0a0a0a">Information Security</text>
  <text x="34" y="572" font-size="11" fill="#737373">AppSec, threat modelling.</text>

  <rect x="16" y="616" width="288" height="88" rx="12" fill="#eff4ff" stroke="#dbe6ff"/>
  <text x="34" y="646" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">TOOLS</text>
  <text x="34" y="670" font-size="15" font-weight="700" fill="#0a0a0a">Cost of Living Calculator</text>
  <text x="34" y="692" font-size="11" fill="#737373">Compare living costs →</text>
</svg>
