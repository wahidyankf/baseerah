<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AyoKoding landing homepage — hi-fi, desktop (1280px), Option A</title>
  <desc>Selected Option A: hero with two CTAs, auto curated section-card grid (3 columns), and a full-width Tools teaser band. Built from libs/web-ui primitives and ayokoding-www design tokens.</desc>
  <rect width="1280" height="1180" fill="#ffffff"/>

  <!-- Header (h-16, sticky, border-b) -->
  <g>
    <rect x="0" y="0" width="1280" height="64" fill="#ffffff"/>
    <line x1="0" y1="64" x2="1280" y2="64" stroke="#e5e5e5" stroke-width="1"/>
    <text x="64" y="40" font-size="19" font-weight="700" fill="#0a0a0a">AyoKoding</text>
    <text x="240" y="40" font-size="15" font-weight="500" fill="#0a0a0a">Learn</text>
    <text x="320" y="40" font-size="15" font-weight="500" fill="#0a0a0a">Tools</text>
    <!-- search pill -->
    <rect x="900" y="18" width="190" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="918" y="39" font-size="13" fill="#737373">Search…</text>
    <rect x="1048" y="24" width="34" height="20" rx="4" fill="#f5f5f5"/>
    <text x="1056" y="38" font-size="11" fill="#737373">⌘K</text>
    <rect x="1104" y="18" width="56" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="1114" y="39" font-size="13" fill="#0a0a0a">EN ▾</text>
    <circle cx="1196" cy="34" r="15" fill="#f5f5f5" stroke="#e5e5e5"/>
    <text x="1190" y="39" font-size="13">☾</text>
  </g>

  <!-- Hero -->
  <g>
    <text x="64" y="160" font-size="44" font-weight="800" fill="#0a0a0a">AyoKoding — learn software</text>
    <text x="64" y="212" font-size="44" font-weight="800" fill="#0a0a0a">engineering in public</text>
    <text x="64" y="258" font-size="18" fill="#737373">Practical, battle-tested notes from building a real platform. Bilingual (EN / ID).</text>
    <!-- CTAs -->
    <rect x="64" y="288" width="168" height="48" rx="8" fill="#2563eb"/>
    <text x="92" y="318" font-size="16" font-weight="600" fill="#ffffff">Browse Learn →</text>
    <rect x="248" y="288" width="150" height="48" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="276" y="318" font-size="16" font-weight="600" fill="#0a0a0a">Open Tools</text>
  </g>

  <line x1="64" y1="380" x2="1216" y2="380" stroke="#e5e5e5"/>

  <!-- Explore section-card grid (3 cols) -->
  <text x="64" y="430" font-size="24" font-weight="700" fill="#0a0a0a">Explore</text>
  <g>
    <!-- row 1 -->
    <g>
      <rect x="64" y="452" width="360" height="150" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
      <rect x="88" y="476" width="36" height="36" rx="8" fill="#eff4ff"/>
      <text x="98" y="500" font-size="18">⌥</text>
      <text x="88" y="540" font-size="17" font-weight="700" fill="#0a0a0a">Software Engineering</text>
      <text x="88" y="566" font-size="13" fill="#737373">Languages, architecture, system</text>
      <text x="88" y="584" font-size="13" fill="#737373">design — by example.</text>
    </g>
    <g>
      <rect x="460" y="452" width="360" height="150" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
      <rect x="484" y="476" width="36" height="36" rx="8" fill="#eff4ff"/>
      <text x="494" y="500" font-size="18">🛡</text>
      <text x="484" y="540" font-size="17" font-weight="700" fill="#0a0a0a">Information Security</text>
      <text x="484" y="566" font-size="13" fill="#737373">AppSec, threat modelling, and</text>
      <text x="484" y="584" font-size="13" fill="#737373">secure-by-default practice.</text>
    </g>
    <g>
      <rect x="856" y="452" width="360" height="150" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
      <rect x="880" y="476" width="36" height="36" rx="8" fill="#eff4ff"/>
      <text x="890" y="500" font-size="18">✦</text>
      <text x="880" y="540" font-size="17" font-weight="700" fill="#0a0a0a">Artificial Intelligence</text>
      <text x="880" y="566" font-size="13" fill="#737373">LLMs, agents, and applied ML</text>
      <text x="880" y="584" font-size="13" fill="#737373">for engineers.</text>
    </g>
    <!-- row 2 -->
    <g>
      <rect x="64" y="620" width="360" height="150" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
      <rect x="88" y="644" width="36" height="36" rx="8" fill="#eff4ff"/>
      <text x="98" y="668" font-size="18">▤</text>
      <text x="88" y="708" font-size="17" font-weight="700" fill="#0a0a0a">Business</text>
      <text x="88" y="734" font-size="13" fill="#737373">IT governance, strategy, and</text>
      <text x="88" y="752" font-size="13" fill="#737373">operating a software org.</text>
    </g>
    <g>
      <rect x="460" y="620" width="360" height="150" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
      <rect x="484" y="644" width="36" height="36" rx="8" fill="#eff4ff"/>
      <text x="494" y="668" font-size="18">◎</text>
      <text x="484" y="708" font-size="17" font-weight="700" fill="#0a0a0a">Personal Development</text>
      <text x="484" y="734" font-size="13" fill="#737373">Career growth and learning</text>
      <text x="484" y="752" font-size="13" fill="#737373">how to learn.</text>
    </g>
    <g>
      <rect x="856" y="620" width="360" height="150" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
      <rect x="880" y="644" width="36" height="36" rx="8" fill="#fef2f2"/>
      <text x="890" y="668" font-size="18">✺</text>
      <text x="880" y="708" font-size="17" font-weight="700" fill="#0a0a0a">Rants</text>
      <text x="880" y="734" font-size="13" fill="#737373">Opinionated takes — a</text>
      <text x="880" y="752" font-size="13" fill="#737373">first-class section.</text>
    </g>
  </g>

  <!-- Tools teaser band (full width) -->
  <g>
    <rect x="64" y="812" width="1152" height="116" rx="12" fill="#eff4ff" stroke="#dbe6ff"/>
    <text x="92" y="852" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="1">TOOLS</text>
    <text x="92" y="884" font-size="22" font-weight="700" fill="#0a0a0a">Cost of Living Calculator</text>
    <text x="92" y="910" font-size="14" fill="#737373">Compare monthly living costs, savings, and the minimum role needed across cities.</text>
    <rect x="980" y="850" width="200" height="44" rx="8" fill="#2563eb"/>
    <text x="1006" y="878" font-size="15" font-weight="600" fill="#ffffff">Open calculator →</text>
  </g>

  <!-- Footer (multi-column) -->
  <line x1="0" y1="990" x2="1280" y2="990" stroke="#e5e5e5"/>
  <g>
    <text x="64" y="1034" font-size="14" font-weight="700" fill="#0a0a0a">Learn</text>
    <text x="64" y="1060" font-size="13" fill="#737373">Browse all</text>
    <text x="64" y="1082" font-size="13" fill="#737373">Software Engineering</text>
    <text x="64" y="1104" font-size="13" fill="#737373">Rants</text>

    <text x="360" y="1034" font-size="14" font-weight="700" fill="#0a0a0a">Tools</text>
    <text x="360" y="1060" font-size="13" fill="#737373">Cost of Living Calculator</text>

    <text x="656" y="1034" font-size="14" font-weight="700" fill="#0a0a0a">About</text>
    <text x="656" y="1060" font-size="13" fill="#737373">About AyoKoding</text>
    <text x="656" y="1082" font-size="13" fill="#737373">Terms &amp; Conditions</text>
  </g>
  <line x1="64" y1="1130" x2="1216" y2="1130" stroke="#f5f5f5"/>
  <text x="64" y="1160" font-size="12" fill="#737373">© 2026 AyoKoding · FSL-1.1-MIT · Source-Available Project</text>
</svg>
