<svg xmlns="http://www.w3.org/2000/svg" width="768" height="700" viewBox="0 0 768 700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>City detail, Option A (household-adjusted + dual-currency) — tablet high-fidelity mockup</title>
  <desc>High-fidelity tablet mockup (768px) of the single-city Cost-of-living detail. The two-pane desktop layout stacks into one column: household-adjusted per-category rows first (dual currency, reconciling to the subtotal), then the one-time relocation block in local currency and USD, then the healthcare funding box.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="768" height="700" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="767" height="699" fill="none" stroke="#000000" stroke-width="1"/>

  <rect x="0" y="0" width="768" height="46" fill="#0173B2"/>
  <text x="16" y="29" font-size="16" font-weight="700" fill="#FFFFFF">Cost of Living — Singapore detail</text>

  <text x="16" y="74" font-size="12" fill="#0173B2" text-decoration="underline">‹ Back to all cities</text>
  <text x="160" y="74" font-size="15" font-weight="700" fill="#000000">Singapore, Singapore</text>
  <rect x="380" y="60" width="170" height="22" rx="11" fill="#DE8F05"/>
  <text x="465" y="75" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">Healthcare: payroll insurance</text>
  <text x="16" y="98" font-size="11" fill="#808080">Household: 2 adults · rows reflect household scaling and reconcile to the subtotal</text>

  <line x1="16" y1="110" x2="752" y2="110" stroke="#808080" stroke-width="1"/>

  <!-- single-column: per-category table -->
  <text x="16" y="136" font-size="13" font-weight="700" fill="#000000">Monthly expenses (household-adjusted, 2 adults)</text>
  <g font-size="12" fill="#000000">
    <text x="16" y="160" font-weight="600">Category</text>
    <text x="610" y="160" font-weight="600" text-anchor="end">Local (SGD)</text>
    <text x="740" y="160" font-weight="600" text-anchor="end">USD</text>
    <line x1="16" y1="168" x2="740" y2="168" stroke="#808080" stroke-width="1"/>
    <text x="16" y="190">Housing (subLinear×2)</text><text x="610" y="190" text-anchor="end">S$5,830</text><text x="740" y="190" text-anchor="end" fill="#808080">$4,375</text>
    <text x="16" y="210">Food (perCapita×2)</text><text x="610" y="210" text-anchor="end">S$1,600</text><text x="740" y="210" text-anchor="end" fill="#808080">$1,200</text>
    <text x="16" y="230">Transport (perCapita×2)</text><text x="610" y="230" text-anchor="end">S$400</text><text x="740" y="230" text-anchor="end" fill="#808080">$300</text>
    <text x="16" y="250">Utilities (subLinear×2)</text><text x="610" y="250" text-anchor="end">S$390</text><text x="740" y="250" text-anchor="end" fill="#808080">$293</text>
    <text x="16" y="270">Healthcare OOP (perCapita×2)</text><text x="610" y="270" text-anchor="end">S$800</text><text x="740" y="270" text-anchor="end" fill="#808080">$600</text>
    <text x="16" y="290">Lifestyle</text><text x="610" y="290" text-anchor="end">S$1,200</text><text x="740" y="290" text-anchor="end" fill="#808080">$900</text>
    <line x1="16" y1="300" x2="740" y2="300" stroke="#000000" stroke-width="1.5"/>
    <text x="16" y="322" font-weight="700">Essentials subtotal</text><text x="610" y="322" text-anchor="end" font-weight="700">S$9,020</text><text x="740" y="322" text-anchor="end" font-weight="700">$6,768</text>
    <text x="16" y="342" font-weight="700">Monthly total</text><text x="610" y="342" text-anchor="end" font-weight="700">S$10,220</text><text x="740" y="342" text-anchor="end" font-weight="700">$7,668</text>
  </g>
  <rect x="16" y="356" width="724" height="22" rx="11" fill="#029E73"/>
  <text x="378" y="371" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">Rows use the same scaling as the subtotal — they add up (EWT-007)</text>

  <!-- relocation block -->
  <rect x="16" y="392" width="736" height="140" rx="8" fill="#FFFFFF" stroke="#CC78BC" stroke-width="2"/>
  <rect x="16" y="392" width="736" height="28" rx="8" fill="#CC78BC"/>
  <text x="30" y="411" font-size="12" font-weight="700" fill="#FFFFFF">Relocation (one-time) — local + USD (EWT-002)</text>
  <g font-size="12" fill="#000000">
    <text x="30" y="442">Relocation sunk cost ⓘ</text><text x="610" y="442" text-anchor="end">S$12,000</text><text x="740" y="442" text-anchor="end" fill="#808080">$9,000</text>
    <text x="30" y="466">Liquidity reserve (kept) ⓘ</text><text x="610" y="466" text-anchor="end">S$20,000</text><text x="740" y="466" text-anchor="end" fill="#808080">$15,000</text>
  </g>
  <text x="30" y="494" font-size="11" fill="#808080">Sunk = one-time move cost not recovered. Reserve = held cash cushion. Both one-time.</text>
  <text x="30" y="512" font-size="11" fill="#808080">ⓘ = hover/focus for a definition tooltip. Each figure shown local + USD.</text>

  <!-- healthcare funding -->
  <rect x="16" y="544" width="736" height="80" rx="6" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="30" y="566" font-size="12" font-weight="700" fill="#000000">Healthcare funding</text>
  <rect x="30" y="574" width="160" height="18" rx="9" fill="#DE8F05"/>
  <text x="110" y="587" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">payroll insurance</text>
  <text x="30" y="612" font-size="11" fill="#808080">Mandatory payroll insurance funds most care; OOP = what you pay yourself.</text>

  <g font-size="11" fill="#808080">
    <text x="16" y="650" fill="#000000" font-weight="700">Tablet (768px) responsive notes</text>
    <text x="16" y="668">Two-pane desktop layout stacks to one column: expenses, then relocation, then funding.</text>
    <text x="16" y="686">All figures dual-currency; rows reconcile to the subtotal; controls ≥44px.</text>
  </g>
</svg>
