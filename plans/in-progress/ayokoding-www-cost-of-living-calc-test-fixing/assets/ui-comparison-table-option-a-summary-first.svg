<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Comparison table, Option A (summary-first reorder) — desktop high-fidelity mockup</title>
  <desc>High-fidelity desktop mockup of the Cost of Living Calculator Cost-of-living tab after the UWT-004 fix. The comparison table reorders columns so Total and Essentials sit immediately after the City column, in the first viewport, before the per-category breakdown columns and the one-time Relocation (sunk) and Liquidity reserve columns. A right-edge fade and a scroll-for-more affordance signal that breakdown columns continue to the right. Country and City names are underlined links. Relocation and Liquidity column headers carry definition-tooltip indicators.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="1180" height="560" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1179" height="559" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1180" height="48" fill="#0173B2"/>
  <text x="20" y="31" font-size="19" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Cost of living</text>
  <rect x="930" y="13" width="232" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="946" y="28" font-size="12" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- Subtitle (UWT-002 fix preview) -->
  <text x="20" y="64" font-size="12" fill="#808080">Salary Savings Calculator — compare cost of living across tech hubs</text>

  <!-- Tab toggle (predictive labels, UWT-012) -->
  <g font-size="13">
    <rect x="20" y="74" width="150" height="32" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="95" y="95" text-anchor="middle" font-weight="700" fill="#FFFFFF">Cost of living</text>
    <rect x="174" y="74" width="170" height="32" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="259" y="95" text-anchor="middle" fill="#808080">Savings after expenses</text>
    <rect x="348" y="74" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="438" y="95" text-anchor="middle" fill="#808080">Minimum salary needed</text>
  </g>

  <!-- Cascading filter row -->
  <g font-size="13">
    <text x="20" y="133" font-weight="600" fill="#000000">Region</text>
    <rect x="78" y="120" width="140" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="137" fill="#000000">All regions</text>
    <text x="206" y="137" fill="#808080">▼</text>
    <text x="238" y="133" font-weight="600" fill="#000000">Country</text>
    <rect x="300" y="120" width="140" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="310" y="137" fill="#000000">All countries</text>
    <text x="428" y="137" fill="#808080">▼</text>
    <text x="462" y="133" font-weight="600" fill="#000000">City</text>
    <rect x="502" y="120" width="140" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="512" y="137" fill="#000000">All cities</text>
    <text x="630" y="137" fill="#808080">▼</text>
    <text x="662" y="137" font-size="11" fill="#808080">Region ▸ Country ▸ City · state is reflected in the URL</text>
  </g>

  <!-- Household / area controls -->
  <g font-size="13">
    <text x="20" y="170" font-weight="600" fill="#000000">Household</text>
    <rect x="98" y="157" width="92" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="106" y="173" fill="#000000">Adults: 2</text>
    <rect x="196" y="157" width="138" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="204" y="173" fill="#000000">Pre-school kids: 1</text>
    <text x="350" y="170" font-weight="600" fill="#000000">Area</text>
    <rect x="388" y="157" width="58" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="417" y="173" text-anchor="middle" fill="#808080">Center</text>
    <rect x="450" y="157" width="52" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="476" y="173" text-anchor="middle" fill="#FFFFFF">Rural</text>
  </g>

  <line x1="20" y1="192" x2="1160" y2="192" stroke="#808080" stroke-width="1"/>

  <!-- Column header band: Country City | TOTAL Essentials | breakdown | Sunk Reserve -->
  <rect x="20" y="200" width="1140" height="36" fill="#0173B2"/>
  <!-- summary group highlight -->
  <rect x="232" y="200" width="170" height="36" fill="#015C8E"/>
  <g font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">
    <text x="70"  y="222" text-decoration="underline">Country</text>
    <text x="160" y="222" text-decoration="underline">City</text>
    <text x="290" y="222">TOTAL</text>
    <text x="364" y="222">Essentials</text>
    <text x="436" y="222">Housing</text>
    <text x="500" y="222">Food</text>
    <text x="560" y="222">Transp.</text>
    <text x="622" y="222">Utilities</text>
    <text x="690" y="216">Health</text>
    <text x="690" y="228">(OOP)</text>
    <text x="758" y="222">Childcare</text>
    <text x="826" y="222">School</text>
    <text x="888" y="222">Lifestyle</text>
    <text x="970" y="216">Reloc.</text>
    <text x="970" y="228">(sunk) ⓘ</text>
    <text x="1066" y="216">Liquidity</text>
    <text x="1066" y="228">reserve ⓘ</text>
  </g>

  <!-- Row 1: Jakarta -->
  <rect x="20" y="236" width="1140" height="44" fill="#FFFFFF"/>
  <rect x="232" y="236" width="170" height="44" fill="#EAF3F9"/>
  <g font-size="11" text-anchor="middle">
    <text x="70"  y="262" fill="#0173B2" text-decoration="underline" font-weight="600">Indonesia</text>
    <text x="160" y="262" fill="#0173B2" text-decoration="underline" font-weight="600">Jakarta</text>
    <text x="290" y="262" fill="#000000" font-weight="700">$1,580</text>
    <text x="364" y="262" fill="#000000" font-weight="600">$1,400</text>
    <text x="436" y="262" fill="#000000">$600</text>
    <text x="500" y="262" fill="#000000">$250</text>
    <text x="560" y="262" fill="#000000">$30</text>
    <text x="622" y="262" fill="#000000">$120</text>
    <text x="690" y="262" fill="#000000">$40</text>
    <text x="758" y="262" fill="#000000">$180</text>
    <text x="826" y="262" fill="#000000">$0</text>
    <text x="888" y="262" fill="#000000">$180</text>
    <text x="970" y="262" fill="#000000">$4,100</text>
    <text x="1066" y="262" fill="#000000">$4,800</text>
  </g>
  <line x1="20" y1="280" x2="1160" y2="280" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 2: Singapore -->
  <rect x="20" y="280" width="1140" height="44" fill="#F6F8FA"/>
  <rect x="232" y="280" width="170" height="44" fill="#E1EEF6"/>
  <g font-size="11" text-anchor="middle">
    <text x="70"  y="306" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="160" y="306" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="290" y="306" fill="#000000" font-weight="700">$5,630</text>
    <text x="364" y="306" fill="#000000" font-weight="600">$4,730</text>
    <text x="436" y="306" fill="#000000">$2,250</text>
    <text x="500" y="306" fill="#000000">$600</text>
    <text x="560" y="306" fill="#000000">$150</text>
    <text x="622" y="306" fill="#000000">$230</text>
    <text x="690" y="306" fill="#000000">$300</text>
    <text x="758" y="306" fill="#000000">$1,200</text>
    <text x="826" y="306" fill="#000000">$0</text>
    <text x="888" y="306" fill="#000000">$900</text>
    <text x="970" y="306" fill="#000000">$9,000</text>
    <text x="1066" y="306" fill="#000000">$15,000</text>
  </g>
  <line x1="20" y1="324" x2="1160" y2="324" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 3: Berlin -->
  <rect x="20" y="324" width="1140" height="44" fill="#FFFFFF"/>
  <rect x="232" y="324" width="170" height="44" fill="#EAF3F9"/>
  <g font-size="11" text-anchor="middle">
    <text x="70"  y="350" fill="#0173B2" text-decoration="underline" font-weight="600">Germany</text>
    <text x="160" y="350" fill="#0173B2" text-decoration="underline" font-weight="600">Berlin</text>
    <text x="290" y="350" fill="#000000" font-weight="700">$2,870</text>
    <text x="364" y="350" fill="#000000" font-weight="600">$2,520</text>
    <text x="436" y="350" fill="#000000">$1,100</text>
    <text x="500" y="350" fill="#000000">$400</text>
    <text x="560" y="350" fill="#000000">$90</text>
    <text x="622" y="350" fill="#000000">$180</text>
    <text x="690" y="350" fill="#000000">$30</text>
    <text x="758" y="350" fill="#000000">$320</text>
    <text x="826" y="350" fill="#000000">$0</text>
    <text x="888" y="350" fill="#000000">$350</text>
    <text x="970" y="350" fill="#000000">$7,400</text>
    <text x="1066" y="350" fill="#000000">$7,800</text>
  </g>
  <rect x="20" y="236" width="1140" height="132" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- right-edge scroll affordance (grafted from Option C) -->
  <rect x="1120" y="236" width="40" height="132" fill="url(#fade)"/>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <text x="1150" y="306" font-size="14" fill="#808080" text-anchor="middle">›</text>

  <!-- Summary-first callout -->
  <rect x="232" y="380" width="170" height="22" rx="11" fill="#029E73"/>
  <text x="317" y="395" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">Answer in first viewport</text>
  <text x="412" y="395" font-size="11" fill="#808080">Total + Essentials moved left, right after City (UWT-004). Breakdown trails right; › = scroll for more.</text>

  <!-- Tooltip preview for Relocation (sunk) -->
  <g>
    <rect x="900" y="420" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#CC78BC" stroke-width="2"/>
    <rect x="900" y="420" width="260" height="26" rx="8" fill="#CC78BC"/>
    <text x="912" y="438" font-size="12" font-weight="700" fill="#FFFFFF">Relocation (sunk) ⓘ</text>
    <text x="912" y="464" font-size="11" fill="#000000">One-time move-in cost you do not get</text>
    <text x="912" y="480" font-size="11" fill="#000000">back: deposit, flights, shipping, setup.</text>
    <text x="912" y="500" font-size="11" fill="#808080">Shown in local currency and USD.</text>
    <text x="912" y="520" font-size="11" fill="#808080">This is a one-time figure, not monthly.</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#808080">
    <rect x="20" y="420" width="500" height="120" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="32" y="442" fill="#000000" font-weight="700">Reading the table</text>
    <text x="32" y="462">TOTAL and Essentials lead (the answer); breakdown columns follow.</text>
    <text x="32" y="480">Relocation (sunk) and Liquidity reserve are one-time, shown local + USD.</text>
    <text x="32" y="498">OOP = out-of-pocket: healthcare you pay yourself.</text>
    <text x="32" y="516">Country &amp; City are links → Cost-of-living filtered / city detail.</text>
    <text x="32" y="534">Filter state is reflected in the URL — bookmark or share the view.</text>
  </g>
</svg>
