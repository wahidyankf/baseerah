<svg xmlns="http://www.w3.org/2000/svg" width="375" height="760" viewBox="0 0 375 760" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>City detail, Option A (household-adjusted + dual-currency) — mobile high-fidelity mockup</title>
  <desc>High-fidelity mobile mockup (375px) of the single-city Cost-of-living detail. Everything stacks into one full-width column: a back link, the city heading and healthcare badge, household-adjusted per-category rows in local currency and USD that reconcile to the subtotal, then the one-time relocation rows in local and USD, then the healthcare funding note. Each money line shows local currency above the USD equivalent.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="375" height="760" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="374" height="759" fill="none" stroke="#000000" stroke-width="1"/>

  <rect x="0" y="0" width="375" height="44" fill="#0173B2"/>
  <text x="14" y="28" font-size="15" font-weight="700" fill="#FFFFFF">Singapore detail</text>

  <text x="14" y="66" font-size="12" fill="#0173B2" text-decoration="underline">‹ Back to all cities</text>
  <text x="14" y="92" font-size="15" font-weight="700" fill="#000000">Singapore, Singapore</text>
  <rect x="14" y="104" width="200" height="22" rx="11" fill="#DE8F05"/>
  <text x="114" y="119" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">Healthcare: payroll insurance</text>
  <text x="14" y="144" font-size="10" fill="#808080">Household: 2 adults · rows reconcile to subtotal</text>

  <line x1="14" y1="154" x2="361" y2="154" stroke="#808080" stroke-width="1"/>

  <!-- per-category rows, local over USD -->
  <text x="14" y="176" font-size="12" font-weight="700" fill="#000000">Monthly expenses (2 adults)</text>
  <g font-size="11">
    <text x="14" y="200" fill="#000000">Housing (subLinear×2)</text>
    <text x="361" y="196" text-anchor="end" fill="#000000">S$5,830</text><text x="361" y="208" text-anchor="end" fill="#808080" font-size="10">$4,375</text>
    <text x="14" y="226" fill="#000000">Food (perCapita×2)</text>
    <text x="361" y="222" text-anchor="end" fill="#000000">S$1,600</text><text x="361" y="234" text-anchor="end" fill="#808080" font-size="10">$1,200</text>
    <text x="14" y="252" fill="#000000">Transport · Utilities</text>
    <text x="361" y="248" text-anchor="end" fill="#000000">S$790</text><text x="361" y="260" text-anchor="end" fill="#808080" font-size="10">$593</text>
    <text x="14" y="278" fill="#000000">Healthcare OOP (perCapita×2)</text>
    <text x="361" y="274" text-anchor="end" fill="#000000">S$800</text><text x="361" y="286" text-anchor="end" fill="#808080" font-size="10">$600</text>
    <text x="14" y="304" fill="#000000">Lifestyle</text>
    <text x="361" y="300" text-anchor="end" fill="#000000">S$1,200</text><text x="361" y="312" text-anchor="end" fill="#808080" font-size="10">$900</text>
  </g>
  <line x1="14" y1="320" x2="361" y2="320" stroke="#000000" stroke-width="1.5"/>
  <g font-size="12">
    <text x="14" y="342" font-weight="700" fill="#000000">Essentials subtotal</text>
    <text x="361" y="338" text-anchor="end" font-weight="700" fill="#000000">S$9,020</text><text x="361" y="352" text-anchor="end" fill="#808080" font-size="10">$6,768</text>
    <text x="14" y="372" font-weight="700" fill="#000000">Monthly total</text>
    <text x="361" y="368" text-anchor="end" font-weight="700" fill="#000000">S$10,220</text><text x="361" y="382" text-anchor="end" fill="#808080" font-size="10">$7,668</text>
  </g>
  <rect x="14" y="392" width="347" height="26" rx="11" fill="#029E73"/>
  <text x="187" y="409" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">Rows add up to the subtotal (EWT-007)</text>

  <!-- relocation block -->
  <rect x="14" y="430" width="347" height="150" rx="8" fill="#FFFFFF" stroke="#CC78BC" stroke-width="2"/>
  <rect x="14" y="430" width="347" height="28" rx="8" fill="#CC78BC"/>
  <text x="24" y="449" font-size="12" font-weight="700" fill="#FFFFFF">Relocation (one-time)</text>
  <g font-size="11">
    <text x="24" y="480" fill="#000000">Relocation sunk cost ⓘ</text>
    <text x="351" y="476" text-anchor="end" fill="#000000">S$12,000</text><text x="351" y="488" text-anchor="end" fill="#808080" font-size="10">$9,000</text>
    <text x="24" y="514" fill="#000000">Liquidity reserve (kept) ⓘ</text>
    <text x="351" y="510" text-anchor="end" fill="#000000">S$20,000</text><text x="351" y="522" text-anchor="end" fill="#808080" font-size="10">$15,000</text>
  </g>
  <text x="24" y="548" font-size="10" fill="#808080">Sunk = one-time move cost not recovered.</text>
  <text x="24" y="564" font-size="10" fill="#808080">Reserve = held cash cushion. Both local + USD. ⓘ = tap for definition.</text>

  <!-- healthcare funding -->
  <rect x="14" y="592" width="347" height="70" rx="6" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="24" y="614" font-size="11" font-weight="700" fill="#000000">Healthcare funding</text>
  <rect x="24" y="622" width="150" height="18" rx="9" fill="#DE8F05"/>
  <text x="99" y="635" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">payroll insurance</text>
  <text x="24" y="656" font-size="10" fill="#808080">OOP = healthcare you pay yourself.</text>

  <g font-size="10" fill="#808080">
    <rect x="14" y="672" width="347" height="76" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="24" y="692" fill="#000000" font-weight="700">Mobile (375px) responsive notes</text>
    <text x="24" y="708">Single full-width column; each money line is local over USD.</text>
    <text x="24" y="724">Rows reconcile to the subtotal; relocation rows dual-currency.</text>
    <text x="24" y="740">Tap targets ≥44px; ID-locale labels fully translated.</text>
  </g>
</svg>
