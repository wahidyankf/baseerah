<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>City detail, Option A (household-adjusted + dual-currency) — desktop high-fidelity mockup</title>
  <desc>High-fidelity desktop mockup of the single-city Cost-of-living detail after the EWT-007 and EWT-002 fixes. Each per-category row shows the household-adjusted amount (for a 2-adult household) using the same scaling as the essentials subtotal, so the rows reconcile to the subtotal. The one-time relocation sunk-cost and liquidity-reserve rows are shown in both local currency and USD. A healthcare funding-scheme badge is shown. A back affordance returns to the full table.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="1180" height="560" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1179" height="559" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- header -->
  <rect x="0" y="0" width="1180" height="48" fill="#0173B2"/>
  <text x="20" y="31" font-size="19" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Singapore detail</text>
  <rect x="930" y="13" width="232" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="946" y="28" font-size="12" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- back + title row -->
  <text x="20" y="80" font-size="13" fill="#0173B2" text-decoration="underline">‹ Back to all cities</text>
  <text x="200" y="80" font-size="16" font-weight="700" fill="#000000">Singapore, Singapore</text>
  <rect x="430" y="66" width="170" height="22" rx="11" fill="#DE8F05"/>
  <text x="515" y="81" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">Healthcare: payroll insurance</text>
  <text x="630" y="80" font-size="12" fill="#808080">Household: 2 adults · rows reflect household scaling</text>

  <line x1="20" y1="96" x2="1160" y2="96" stroke="#808080" stroke-width="1"/>

  <!-- left: per-category table (household-adjusted, dual currency) -->
  <text x="20" y="124" font-size="14" font-weight="700" fill="#000000">Monthly expenses (household-adjusted, 2 adults)</text>
  <g font-size="12" fill="#000000">
    <text x="20" y="150" font-weight="600">Category</text>
    <text x="430" y="150" font-weight="600" text-anchor="end">Local (SGD)</text>
    <text x="560" y="150" font-weight="600" text-anchor="end">USD</text>
    <line x1="20" y1="158" x2="560" y2="158" stroke="#808080" stroke-width="1"/>
    <text x="20" y="180">Housing (subLinear×2)</text><text x="430" y="180" text-anchor="end">S$5,830</text><text x="560" y="180" text-anchor="end" fill="#808080">$4,375</text>
    <text x="20" y="200">Food (perCapita×2)</text><text x="430" y="200" text-anchor="end">S$1,600</text><text x="560" y="200" text-anchor="end" fill="#808080">$1,200</text>
    <text x="20" y="220">Transport (perCapita×2)</text><text x="430" y="220" text-anchor="end">S$400</text><text x="560" y="220" text-anchor="end" fill="#808080">$300</text>
    <text x="20" y="240">Utilities (subLinear×2)</text><text x="430" y="240" text-anchor="end">S$390</text><text x="560" y="240" text-anchor="end" fill="#808080">$293</text>
    <text x="20" y="260">Healthcare OOP (perCapita×2)</text><text x="430" y="260" text-anchor="end">S$800</text><text x="560" y="260" text-anchor="end" fill="#808080">$600</text>
    <text x="20" y="280">Childcare</text><text x="430" y="280" text-anchor="end">S$0</text><text x="560" y="280" text-anchor="end" fill="#808080">$0</text>
    <text x="20" y="300">School</text><text x="430" y="300" text-anchor="end">S$0</text><text x="560" y="300" text-anchor="end" fill="#808080">$0</text>
    <text x="20" y="320">Lifestyle</text><text x="430" y="320" text-anchor="end">S$1,200</text><text x="560" y="320" text-anchor="end" fill="#808080">$900</text>
    <line x1="20" y1="330" x2="560" y2="330" stroke="#000000" stroke-width="1.5"/>
    <text x="20" y="352" font-weight="700">Essentials subtotal</text><text x="430" y="352" text-anchor="end" font-weight="700">S$9,020</text><text x="560" y="352" text-anchor="end" font-weight="700">$6,768</text>
    <text x="20" y="372" font-weight="700">Monthly total</text><text x="430" y="372" text-anchor="end" font-weight="700">S$10,220</text><text x="560" y="372" text-anchor="end" font-weight="700">$7,668</text>
  </g>
  <!-- reconcile callout -->
  <rect x="20" y="386" width="540" height="22" rx="11" fill="#029E73"/>
  <text x="290" y="401" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">Rows use the same scaling as the subtotal — they add up (EWT-007)</text>

  <!-- right: relocation (one-time, dual currency) -->
  <rect x="620" y="120" width="540" height="180" rx="8" fill="#FFFFFF" stroke="#CC78BC" stroke-width="2"/>
  <rect x="620" y="120" width="540" height="30" rx="8" fill="#CC78BC"/>
  <text x="634" y="140" font-size="13" font-weight="700" fill="#FFFFFF">Relocation (one-time) — local + USD (EWT-002)</text>
  <g font-size="12" fill="#000000">
    <text x="634" y="172" font-weight="600">Item</text>
    <text x="1010" y="172" font-weight="600" text-anchor="end">Local (SGD)</text>
    <text x="1140" y="172" font-weight="600" text-anchor="end">USD</text>
    <line x1="634" y1="180" x2="1140" y2="180" stroke="#808080" stroke-width="1"/>
    <text x="634" y="206">Relocation sunk cost ⓘ</text><text x="1010" y="206" text-anchor="end">S$12,000</text><text x="1140" y="206" text-anchor="end" fill="#808080">$9,000</text>
    <text x="634" y="232">Liquidity reserve (kept) ⓘ</text><text x="1010" y="232" text-anchor="end">S$20,000</text><text x="1140" y="232" text-anchor="end" fill="#808080">$15,000</text>
  </g>
  <text x="634" y="262" font-size="11" fill="#808080">Sunk = one-time move cost you do not get back (deposit, flights, shipping).</text>
  <text x="634" y="278" font-size="11" fill="#808080">Reserve = recommended cash cushion you keep, not an expense. Both one-time.</text>

  <!-- healthcare funding box -->
  <rect x="620" y="316" width="540" height="92" rx="6" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="636" y="338" font-size="12" font-weight="700" fill="#000000">Healthcare funding</text>
  <rect x="636" y="346" width="160" height="18" rx="9" fill="#DE8F05"/>
  <text x="716" y="359" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">payroll insurance</text>
  <text x="636" y="384" font-size="11" fill="#808080">Mandatory payroll insurance funds most care; out-of-pocket (OOP)</text>
  <text x="636" y="400" font-size="11" fill="#808080">spend shows in the Healthcare OOP row above. OOP = what you pay yourself.</text>

  <!-- footer legend -->
  <line x1="20" y1="424" x2="1160" y2="424" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="20" y="446" fill="#DE8F05" font-weight="700">Estimates only</text>
    <text x="120" y="446">Modeled monthly figures, not quotes. Snapshot 2026-06; FX nominal.</text>
    <text x="20" y="466">subLinear / perCapita = OECD household-scaling multipliers, applied identically to the rows and the subtotal so they reconcile.</text>
    <text x="20" y="486">Every figure is shown in the city's local currency and its USD equivalent. ⓘ = hover/focus for a definition tooltip.</text>
    <text x="20" y="506">Deep-link: ?tab=cost&amp;city=singapore-sg · the City filter is pre-selected to Singapore on arrival (EWT-004).</text>
  </g>
</svg>
