<svg xmlns="http://www.w3.org/2000/svg" width="375" height="720" viewBox="0 0 375 720" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Comparison table, Option A (summary-first reorder) — mobile high-fidelity mockup</title>
  <desc>High-fidelity mobile mockup (375px) of the Cost of Living Calculator Cost-of-living tab. The table collapses to stacked city cards with Total leading each card, then Essentials, then the per-category breakdown, then the one-time relocation rows. Filters stack full-width. Controls are at least 44px tall. City and country names are tappable links.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="375" height="720" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="374" height="719" fill="none" stroke="#000000" stroke-width="1"/>

  <rect x="0" y="0" width="375" height="44" fill="#0173B2"/>
  <text x="14" y="28" font-size="15" font-weight="700" fill="#FFFFFF">Cost of Living</text>
  <text x="14" y="60" font-size="10" fill="#808080">Salary Savings Calculator — compare hubs</text>

  <!-- tabs stack horizontally, scrollable -->
  <g font-size="11">
    <rect x="14" y="70" width="110" height="30" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="69" y="89" text-anchor="middle" font-weight="700" fill="#FFFFFF">Cost of living</text>
    <rect x="128" y="70" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="188" y="89" text-anchor="middle" fill="#808080">Savings after exp.</text>
    <rect x="252" y="70" width="100" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="302" y="89" text-anchor="middle" fill="#808080">Min. salary ›</text>
  </g>

  <!-- filters stack full width, 44px tall -->
  <g font-size="12">
    <rect x="14" y="110" width="347" height="34" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="24" y="132" fill="#000000">Region: All regions</text>
    <text x="345" y="132" fill="#808080">▼</text>
    <rect x="14" y="150" width="347" height="34" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="24" y="172" fill="#000000">Country: All countries</text>
    <text x="345" y="172" fill="#808080">▼</text>
    <rect x="14" y="190" width="347" height="34" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="24" y="212" fill="#000000">City: All cities</text>
    <text x="345" y="212" fill="#808080">▼</text>
  </g>

  <!-- city card 1 -->
  <rect x="14" y="234" width="347" height="216" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="14" y="234" width="347" height="30" rx="8" fill="#EAF3F9"/>
  <text x="24" y="254" font-size="13" font-weight="700" fill="#0173B2" text-decoration="underline">Jakarta, Indonesia ›</text>
  <!-- Total leads -->
  <rect x="24" y="272" width="327" height="34" rx="5" fill="#029E73"/>
  <text x="34" y="294" font-size="14" font-weight="700" fill="#FFFFFF">Total</text>
  <text x="341" y="294" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="end">$1,580</text>
  <g font-size="12" fill="#000000">
    <text x="24" y="324" font-weight="600">Essentials</text><text x="351" y="324" text-anchor="end" font-weight="600">$1,400</text>
    <text x="24" y="344">Housing</text><text x="351" y="344" text-anchor="end">$600</text>
    <text x="24" y="362">Food · Transport · Utilities</text><text x="351" y="362" text-anchor="end" fill="#808080">$400</text>
    <text x="24" y="380">Healthcare (OOP) · Childcare</text><text x="351" y="380" text-anchor="end" fill="#808080">$220</text>
    <text x="24" y="398">Lifestyle</text><text x="351" y="398" text-anchor="end">$180</text>
  </g>
  <line x1="24" y1="408" x2="351" y2="408" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="24" y="426">Relocation (sunk, 1×) ⓘ</text><text x="351" y="426" text-anchor="end">$4,100</text>
    <text x="24" y="442">Liquidity reserve (kept) ⓘ</text><text x="351" y="442" text-anchor="end">$4,800</text>
  </g>

  <!-- city card 2 (compact) -->
  <rect x="14" y="460" width="347" height="96" rx="8" fill="#F6F8FA" stroke="#000000" stroke-width="1.5"/>
  <rect x="14" y="460" width="347" height="30" rx="8" fill="#E1EEF6"/>
  <text x="24" y="480" font-size="13" font-weight="700" fill="#0173B2" text-decoration="underline">Singapore, Singapore ›</text>
  <rect x="24" y="498" width="327" height="30" rx="5" fill="#029E73"/>
  <text x="34" y="518" font-size="13" font-weight="700" fill="#FFFFFF">Total</text>
  <text x="341" y="518" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">$5,630</text>
  <text x="24" y="546" font-size="11" fill="#808080">Tap to expand the full breakdown</text>

  <!-- responsive note -->
  <g font-size="11" fill="#808080">
    <rect x="14" y="566" width="347" height="140" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="24" y="588" fill="#000000" font-weight="700">Mobile (375px) responsive notes</text>
    <text x="24" y="608">Table → stacked cards; Total LEADS each card (the answer is first — UWT-004).</text>
    <text x="24" y="626">No horizontal scroll needed; breakdown stacks vertically under the total.</text>
    <text x="24" y="644">Filters and tabs are full-width and ≥44px tall (UWT-009).</text>
    <text x="24" y="662">Relocation/Liquidity rows show local + USD with definition tooltips (ⓘ).</text>
    <text x="24" y="680">City &amp; country names are tappable links (detail / filtered view).</text>
    <text x="24" y="698">ID-locale Area label uses "Kawasan" to avoid wrap (UWT-010).</text>
  </g>
</svg>
