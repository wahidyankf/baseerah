<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Cost-of-living screen, Option A (Category Table) high-fidelity finalist</title>
  <desc>High-fidelity mockup of the Cost of Living Calculator Cost-of-living tab using the Category Table layout. A three-tab toggle has Cost of living active. A Region/Country/City cascading filter row and household, area, and school-type controls sit above a dense category table. Money cells show local currency on the first line and USD on the second line. Healthcare cells carry a funding-scheme badge whose full label fits inside the taller row. A legend explains OOP means out-of-pocket. Both Country and City names are underlined links: a City link opens that city's Cost-of-living detail, a Country link opens the Cost-of-living tab filtered to that country. An inset previews the city-detail view.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="1180" height="780" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1179" height="779" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- ===== Header bar ===== -->
  <rect x="0" y="0" width="1180" height="48" fill="#0173B2"/>
  <text x="20" y="31" font-size="19" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Cost of living</text>
  <!-- snapshot date pill -->
  <rect x="930" y="13" width="232" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="946" y="28" font-size="12" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- ===== Tab toggle ===== -->
  <g font-size="14">
    <rect x="20" y="62" width="150" height="34" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="95" y="84" text-anchor="middle" font-weight="700" fill="#FFFFFF">Cost of living</text>
    <rect x="174" y="62" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="229" y="84" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="288" y="62" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="353" y="84" text-anchor="middle" fill="#808080">Minimum role</text>
  </g>

  <!-- ===== Cascading filter row ===== -->
  <g font-size="13">
    <text x="20" y="125" font-weight="600" fill="#000000">Region</text>
    <rect x="78" y="112" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="129" fill="#000000">All regions</text>
    <text x="216" y="129" fill="#808080">▼</text>

    <text x="250" y="125" font-weight="600" fill="#000000">Country</text>
    <rect x="312" y="112" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="322" y="129" fill="#000000">All countries</text>
    <text x="450" y="129" fill="#808080">▼</text>

    <text x="484" y="125" font-weight="600" fill="#000000">City</text>
    <rect x="524" y="112" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="534" y="129" fill="#000000">All cities</text>
    <text x="662" y="129" fill="#808080">▼</text>
    <text x="694" y="129" font-size="12" fill="#808080">Region narrows Country narrows City</text>
  </g>

  <!-- ===== Shared controls row ===== -->
  <g font-size="13">
    <text x="20" y="162" font-weight="600" fill="#000000">Household</text>
    <rect x="98" y="149" width="98" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="106" y="165" fill="#000000">Adults: 2</text>
    <rect x="202" y="149" width="142" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="210" y="165" fill="#000000">Pre-school kids: 1</text>
    <rect x="350" y="149" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="358" y="165" fill="#000000">School-age kids: 1</text>

    <text x="520" y="162" font-weight="600" fill="#000000">Area</text>
    <rect x="558" y="149" width="62" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="589" y="165" text-anchor="middle" fill="#808080">Center</text>
    <rect x="624" y="149" width="56" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="652" y="165" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="700" y="162" font-weight="600" fill="#000000">School</text>
    <rect x="752" y="149" width="62" height="24" rx="12" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="783" y="165" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="818" y="149" width="64" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="850" y="165" text-anchor="middle" fill="#808080">Private</text>
  </g>

  <line x1="20" y1="184" x2="1160" y2="184" stroke="#808080" stroke-width="1"/>

  <!-- ===== Category table ===== -->
  <!-- column header band -->
  <rect x="20" y="192" width="1140" height="40" fill="#0173B2"/>
  <g font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">
    <text x="78"  y="216" text-decoration="underline">Country</text>
    <text x="160" y="216" text-decoration="underline">City ↑</text>
    <text x="232" y="216">Housing</text>
    <text x="300" y="216">Food</text>
    <text x="362" y="216">Transp.</text>
    <text x="426" y="216">Utilities</text>
    <text x="500" y="210">Healthcare</text>
    <text x="500" y="223">(OOP)</text>
    <text x="572" y="216">Childcare</text>
    <text x="644" y="216">School</text>
    <text x="714" y="216">Essentials</text>
    <text x="794" y="210">Monthly</text>
    <text x="794" y="223">total</text>
    <text x="884" y="210">Relocation</text>
    <text x="884" y="223">(sunk)</text>
    <text x="980" y="210">Liquidity</text>
    <text x="980" y="223">reserve</text>
    <text x="1070" y="216">Lifestyle</text>
  </g>

  <!-- row template: each money cell = local (line1) + USD (line2). City names underlined links (blue). -->
  <!-- Rows are 70px tall so the full healthcare funding-scheme badge sits inside the row, never clipped. -->
  <!-- Row 1: Jakarta, Indonesia -->
  <rect x="20" y="232" width="1140" height="70" fill="#FFFFFF"/>
  <g font-size="11" text-anchor="middle">
    <text x="78"  y="262" fill="#0173B2" text-decoration="underline" font-weight="600">Indonesia</text>
    <text x="160" y="262" fill="#0173B2" text-decoration="underline" font-weight="600">Jakarta</text>
    <text x="160" y="276" fill="#808080" font-size="9">view detail →</text>
    <text x="232" y="256" fill="#000000">Rp 9.4M</text><text x="232" y="270" fill="#808080" font-size="10">$600</text>
    <text x="300" y="256" fill="#000000">Rp 3.9M</text><text x="300" y="270" fill="#808080" font-size="10">$250</text>
    <text x="362" y="256" fill="#000000">Rp 0.5M</text><text x="362" y="270" fill="#808080" font-size="10">$30</text>
    <text x="426" y="256" fill="#000000">Rp 1.9M</text><text x="426" y="270" fill="#808080" font-size="10">$120</text>
    <text x="500" y="256" fill="#000000">Rp 0.6M</text><text x="500" y="270" fill="#808080" font-size="10">$40</text>
    <text x="572" y="256" fill="#000000">Rp 2.8M</text><text x="572" y="270" fill="#808080" font-size="10">$180</text>
    <text x="644" y="262" fill="#000000">—</text>
    <text x="714" y="256" fill="#000000" font-weight="600">Rp 22M</text><text x="714" y="270" fill="#808080" font-size="10">$1,400</text>
    <text x="794" y="256" fill="#000000" font-weight="700">Rp 24.8M</text><text x="794" y="270" fill="#808080" font-size="10">$1,580</text>
    <text x="884" y="256" fill="#000000">Rp 64M</text><text x="884" y="270" fill="#808080" font-size="10">$4,100</text>
    <text x="980" y="256" fill="#000000">Rp 75M</text><text x="980" y="270" fill="#808080" font-size="10">$4,800</text>
    <text x="1070" y="256" fill="#000000">Rp 2.8M</text><text x="1070" y="270" fill="#808080" font-size="10">$180</text>
  </g>
  <!-- healthcare scheme badge: full-label box centered under the Healthcare value, inside the row -->
  <rect x="456" y="282" width="88" height="16" rx="8" fill="#029E73"/>
  <text x="500" y="293.5" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
  <line x1="20" y1="302" x2="1160" y2="302" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 2: Singapore, Singapore -->
  <rect x="20" y="302" width="1140" height="70" fill="#F6F8FA"/>
  <g font-size="11" text-anchor="middle">
    <text x="78"  y="332" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="160" y="332" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="160" y="346" fill="#808080" font-size="9">view detail →</text>
    <text x="232" y="326" fill="#000000">S$3.0k</text><text x="232" y="340" fill="#808080" font-size="10">$2,250</text>
    <text x="300" y="326" fill="#000000">S$0.8k</text><text x="300" y="340" fill="#808080" font-size="10">$600</text>
    <text x="362" y="326" fill="#000000">S$0.2k</text><text x="362" y="340" fill="#808080" font-size="10">$150</text>
    <text x="426" y="326" fill="#000000">S$0.3k</text><text x="426" y="340" fill="#808080" font-size="10">$230</text>
    <text x="500" y="326" fill="#000000">S$0.4k</text><text x="500" y="340" fill="#808080" font-size="10">$300</text>
    <text x="572" y="326" fill="#000000">S$1.6k</text><text x="572" y="340" fill="#808080" font-size="10">$1,200</text>
    <text x="644" y="332" fill="#000000">—</text>
    <text x="714" y="326" fill="#000000" font-weight="600">S$6.3k</text><text x="714" y="340" fill="#808080" font-size="10">$4,730</text>
    <text x="794" y="326" fill="#000000" font-weight="700">S$7.5k</text><text x="794" y="340" fill="#808080" font-size="10">$5,630</text>
    <text x="884" y="326" fill="#000000">S$12k</text><text x="884" y="340" fill="#808080" font-size="10">$9,000</text>
    <text x="980" y="326" fill="#000000">S$20k</text><text x="980" y="340" fill="#808080" font-size="10">$15,000</text>
    <text x="1070" y="326" fill="#000000">S$1.2k</text><text x="1070" y="340" fill="#808080" font-size="10">$900</text>
  </g>
  <rect x="456" y="352" width="88" height="16" rx="8" fill="#DE8F05"/>
  <text x="500" y="363.5" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">payroll</text>
  <line x1="20" y1="372" x2="1160" y2="372" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 3: Berlin, Germany -->
  <rect x="20" y="372" width="1140" height="70" fill="#FFFFFF"/>
  <g font-size="11" text-anchor="middle">
    <text x="78"  y="402" fill="#0173B2" text-decoration="underline" font-weight="600">Germany</text>
    <text x="160" y="402" fill="#0173B2" text-decoration="underline" font-weight="600">Berlin</text>
    <text x="160" y="416" fill="#808080" font-size="9">view detail →</text>
    <text x="232" y="396" fill="#000000">€1,010</text><text x="232" y="410" fill="#808080" font-size="10">$1,100</text>
    <text x="300" y="396" fill="#000000">€370</text><text x="300" y="410" fill="#808080" font-size="10">$400</text>
    <text x="362" y="396" fill="#000000">€83</text><text x="362" y="410" fill="#808080" font-size="10">$90</text>
    <text x="426" y="396" fill="#000000">€165</text><text x="426" y="410" fill="#808080" font-size="10">$180</text>
    <text x="500" y="396" fill="#000000">€28</text><text x="500" y="410" fill="#808080" font-size="10">$30</text>
    <text x="572" y="396" fill="#000000">€294</text><text x="572" y="410" fill="#808080" font-size="10">$320</text>
    <text x="644" y="402" fill="#000000">—</text>
    <text x="714" y="396" fill="#000000" font-weight="600">€2,315</text><text x="714" y="410" fill="#808080" font-size="10">$2,520</text>
    <text x="794" y="396" fill="#000000" font-weight="700">€2,635</text><text x="794" y="410" fill="#808080" font-size="10">$2,870</text>
    <text x="884" y="396" fill="#000000">€6,790</text><text x="884" y="410" fill="#808080" font-size="10">$7,400</text>
    <text x="980" y="396" fill="#000000">€7,160</text><text x="980" y="410" fill="#808080" font-size="10">$7,800</text>
    <text x="1070" y="396" fill="#000000">€321</text><text x="1070" y="410" fill="#808080" font-size="10">$350</text>
  </g>
  <rect x="456" y="422" width="88" height="16" rx="8" fill="#029E73"/>
  <text x="500" y="433.5" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
  <rect x="20" y="232" width="1140" height="210" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- money-cell + OOP legend -->
  <g font-size="11">
    <rect x="20" y="454" width="1140" height="44" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="32" y="471" fill="#000000">Money cells: <tspan font-weight="700">local currency</tspan> (line 1) · <tspan fill="#808080">USD (line 2)</tspan>. <tspan fill="#0173B2" text-decoration="underline">Country</tspan> &amp; <tspan fill="#0173B2" text-decoration="underline">City</tspan> are links → Cost-of-living filtered.</text>
    <text x="32" y="490" fill="#000000"><tspan font-weight="700">OOP = out-of-pocket</tspan> — the healthcare you pay yourself, on top of any tax-funded or insurance cover. The scheme badge shows how care is funded.</text>
  </g>

  <!-- ===== City-detail inset ===== -->
  <g>
    <rect x="470" y="508" width="690" height="252" rx="8" fill="#FFFFFF" stroke="#CC78BC" stroke-width="2"/>
    <rect x="470" y="508" width="690" height="30" rx="8" fill="#CC78BC"/>
    <text x="484" y="528" font-size="13" font-weight="700" fill="#FFFFFF">City detail — Jakarta, Indonesia (drill-down from city link)</text>
    <g font-size="11" fill="#000000">
      <text x="486" y="560" font-weight="600">Category</text>
      <text x="690" y="560" font-weight="600" text-anchor="end">Local</text>
      <text x="820" y="560" font-weight="600" text-anchor="end">USD</text>
      <line x1="486" y1="568" x2="830" y2="568" stroke="#808080" stroke-width="1"/>
      <text x="486" y="588">Housing</text><text x="690" y="588" text-anchor="end">Rp 9.4M</text><text x="820" y="588" text-anchor="end" fill="#808080">$600</text>
      <text x="486" y="608">Food</text><text x="690" y="608" text-anchor="end">Rp 3.9M</text><text x="820" y="608" text-anchor="end" fill="#808080">$250</text>
      <text x="486" y="628">Transport</text><text x="690" y="628" text-anchor="end">Rp 0.5M</text><text x="820" y="628" text-anchor="end" fill="#808080">$30</text>
      <text x="486" y="648">Utilities</text><text x="690" y="648" text-anchor="end">Rp 1.9M</text><text x="820" y="648" text-anchor="end" fill="#808080">$120</text>
      <text x="486" y="668" font-weight="700">Essentials subtotal</text><text x="690" y="668" text-anchor="end" font-weight="700">Rp 22M</text><text x="820" y="668" text-anchor="end" font-weight="700">$1,400</text>
      <line x1="486" y1="678" x2="830" y2="678" stroke="#808080" stroke-width="1"/>
      <text x="486" y="698">Relocation (sunk, one-time)</text><text x="690" y="698" text-anchor="end">Rp 64M</text><text x="820" y="698" text-anchor="end" fill="#808080">$4,100</text>
      <text x="486" y="718">Liquidity reserve</text><text x="690" y="718" text-anchor="end">Rp 75M</text><text x="820" y="718" text-anchor="end" fill="#808080">$4,800</text>
    </g>
    <rect x="880" y="554" width="262" height="116" rx="6" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="896" y="576" font-size="11" font-weight="700" fill="#000000">Healthcare funding</text>
    <rect x="896" y="584" width="100" height="18" rx="9" fill="#029E73"/>
    <text x="946" y="597" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
    <text x="896" y="622" font-size="10" fill="#808080">Public scheme; only out-of-pocket</text>
    <text x="896" y="636" font-size="10" fill="#808080">(OOP) spend shows in the OOP column.</text>
    <text x="896" y="650" font-size="10" fill="#808080">OOP = what you pay yourself.</text>
    <text x="880" y="700" font-size="10" fill="#808080">Deep-link: ?tab=cost&amp;city=jakarta-id</text>
  </g>

  <!-- ===== Disclaimer footer ===== -->
  <line x1="20" y1="508" x2="450" y2="508" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="20" y="526" font-weight="700" fill="#DE8F05">Estimates only</text>
    <text x="20" y="544">Modeled monthly figures, not quotes.</text>
    <text x="20" y="560">Snapshot date 2026-06; FX nominal.</text>
    <text x="20" y="576">Healthcare (OOP) = out-of-pocket you</text>
    <text x="20" y="592">pay yourself; badge shows funding model.</text>
    <text x="20" y="608">Relocation is a one-time sunk cost;</text>
    <text x="20" y="624">liquidity reserve is a held cushion.</text>
  </g>
</svg>
