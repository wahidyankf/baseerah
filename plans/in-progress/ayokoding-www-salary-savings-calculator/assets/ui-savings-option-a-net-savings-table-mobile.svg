<svg xmlns="http://www.w3.org/2000/svg" width="390" height="936" viewBox="0 0 390 936" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Savings screen, Option A (Net/Savings Table), mobile reflow</title>
  <desc>Mobile (single phone-width column) reflow of the Cost of Living Calculator Savings tab using the Net/Savings Table layout. A compact blue header bar reads Cost of Living Calculator — Savings. Below it three tab pills (Cost of living, Savings active, Minimum role). A full-width gross-salary input shows 8,000 dollars per month deriving 96,000 dollars per year. Region, Country, and City filters and the shared cost-basis controls — household (adults, pre-school kids, school-age kids), area (center or rural), school-type (public or private) — stack full-width, with a sort-by select. Each city renders as a stacked card headed City, Country with both the City and Country names as underlined links (a City link opens that city's Cost-of-living detail, a Country link opens the Cost-of-living tab filtered to that country). The first card, Jakarta, Indonesia, lists Gross, Non-salary comp, Total comp, Income band, Effective tax split into federal plus sub-national, Net, Essentials, Lifestyle, Essential savings and After-lifestyle savings each with its percent, plus a tax-funded healthcare scheme badge. Money values show local currency over USD. The top of the next card (Kuala Lumpur, Malaysia) peeks below. A legend explains OOP means out-of-pocket, and a disclaimer notes savings are computed before pension contributions and that USD figures use nominal FX, not purchasing-power parity.</desc>

  <rect x="0" y="0" width="390" height="936" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="389" height="935" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="44" fill="#0173B2"/>
  <text x="14" y="22" font-size="14" font-weight="700" fill="#FFFFFF">Cost of Living Calculator</text>
  <text x="14" y="38" font-size="12" fill="#FFFFFF">Savings · snapshot 2026-06 · estimates only</text>

  <!-- Tab pills -->
  <g font-size="12">
    <rect x="14" y="54" width="112" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="70" y="73" text-anchor="middle" fill="#808080">Cost of living</text>
    <rect x="132" y="54" width="78" height="30" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="171" y="73" text-anchor="middle" font-weight="700" fill="#FFFFFF">Savings</text>
    <rect x="216" y="54" width="106" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="269" y="73" text-anchor="middle" fill="#808080">Minimum role</text>
  </g>

  <!-- Gross salary input full-width (monthly + derived annual) -->
  <rect x="14" y="94" width="362" height="58" rx="8" fill="#F6F8FA" stroke="#0173B2" stroke-width="1.5"/>
  <text x="26" y="114" font-size="12" font-weight="700" fill="#000000">Gross salary</text>
  <rect x="26" y="120" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="36" y="138" font-size="13" fill="#000000">$8,000 / mo</text>
  <text x="184" y="138" font-size="13" fill="#808080">=</text>
  <rect x="200" y="120" width="164" height="26" rx="5" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="210" y="138" font-size="13" fill="#000000">$96,000 / yr</text>

  <!-- Filters stacked -->
  <g font-size="12">
    <text x="26" y="176" font-weight="600" fill="#000000">Region</text>
    <rect x="120" y="162" width="120" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="130" y="179" fill="#000000">All regions</text><text x="226" y="179" fill="#808080">▼</text>
    <text x="26" y="204" font-weight="600" fill="#000000">Country</text>
    <rect x="120" y="190" width="120" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="130" y="207" fill="#000000">All countries</text><text x="226" y="207" fill="#808080">▼</text>
    <text x="26" y="232" font-weight="600" fill="#000000">City</text>
    <rect x="120" y="218" width="120" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="130" y="235" fill="#000000">All cities</text><text x="226" y="235" fill="#808080">▼</text>
    <text x="252" y="179" font-weight="600" fill="#000000">Sort</text>
    <rect x="252" y="190" width="112" height="52" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="260" y="207" font-size="11" fill="#000000">Essential</text>
    <text x="260" y="221" font-size="11" fill="#000000">savings</text>
    <text x="260" y="235" font-size="11" fill="#808080">high → low ▼</text>
  </g>

  <!-- Shared cost-basis controls (stacked block) -->
  <rect x="14" y="250" width="362" height="90" rx="8" fill="#FFF8EC" stroke="#DE8F05" stroke-width="1.5"/>
  <g font-size="11">
    <text x="26" y="268" font-weight="700" fill="#DE8F05">Cost basis</text>
    <text x="100" y="268" font-size="10" fill="#808080">same controls on every tab; drives essentials</text>
    <text x="26" y="288" font-weight="600" fill="#000000">Household</text>
    <rect x="98" y="277" width="72" height="18" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="105" y="290" fill="#000000">Adults: 2</text>
    <rect x="176" y="277" width="92" height="18" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="183" y="290" fill="#000000">Pre-school: 1</text>
    <rect x="274" y="277" width="92" height="18" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="281" y="290" fill="#000000">School-age: 1</text>

    <text x="26" y="313" font-weight="600" fill="#000000">Area</text>
    <rect x="62" y="302" width="56" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="90" y="315" text-anchor="middle" fill="#808080">Center</text>
    <rect x="122" y="302" width="50" height="18" rx="9" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="147" y="315" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="186" y="313" font-weight="600" fill="#000000">School</text>
    <rect x="232" y="302" width="56" height="18" rx="9" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="260" y="315" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="292" y="302" width="58" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="321" y="315" text-anchor="middle" fill="#808080">Private</text>

    <text x="26" y="334" font-size="11" font-weight="700" fill="#CC78BC">Roles: software-engineering (IC + management)</text>
  </g>

  <!-- ===== Card 1: Jakarta, Indonesia ===== -->
  <rect x="14" y="350" width="362" height="288" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <!-- Card header -->
  <rect x="14" y="350" width="362" height="34" rx="8" fill="#F6F8FA"/>
  <rect x="14" y="368" width="362" height="16" fill="#F6F8FA"/>
  <text x="26" y="372" font-size="14" fill="#0173B2" text-decoration="underline" font-weight="700">Jakarta</text>
  <text x="84" y="372" font-size="12" fill="#000000">, </text>
  <text x="94" y="372" font-size="14" fill="#0173B2" text-decoration="underline" font-weight="700">Indonesia</text>
  <text x="282" y="372" font-size="10" fill="#808080">view detail →</text>

  <!-- scheme badge -->
  <rect x="282" y="392" width="84" height="18" rx="9" fill="#029E73"/>
  <text x="324" y="405" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
  <text x="282" y="424" font-size="9" fill="#808080" text-anchor="middle">Rp 87.7M / yr</text>

  <!-- Card body rows: label left, local over USD right -->
  <g font-size="12">
    <text x="26" y="404" fill="#000000">Gross</text>
    <text x="220" y="400" fill="#000000" text-anchor="end">Rp 125M / mo</text>
    <text x="220" y="412" fill="#808080" font-size="10" text-anchor="end">$8,000 / mo · $96k yr</text>

    <text x="26" y="428" fill="#000000">Non-salary comp</text>
    <text x="220" y="428" fill="#808080" text-anchor="end">+$10k (info)</text>

    <text x="26" y="450" fill="#000000">Total comp</text>
    <text x="220" y="450" fill="#000000" text-anchor="end">$106k</text>

    <text x="26" y="472" fill="#000000">Income band</text>
    <text x="220" y="472" fill="#000000" text-anchor="end">High</text>

    <text x="26" y="494" fill="#000000">Effective tax</text>
    <text x="220" y="490" fill="#000000" text-anchor="end">15%</text>
    <text x="220" y="502" fill="#808080" font-size="10" text-anchor="end">12 fed + 3 sub-national</text>
  </g>

  <line x1="26" y1="512" x2="364" y2="512" stroke="#E5E5E5" stroke-width="1"/>

  <g font-size="12">
    <text x="26" y="532" fill="#000000">Net</text>
    <text x="364" y="528" fill="#000000" text-anchor="end" font-weight="600">Rp 106.3M / mo</text>
    <text x="364" y="540" fill="#808080" font-size="10" text-anchor="end">$6,800 / mo</text>

    <text x="26" y="558" fill="#000000">Essentials</text>
    <text x="364" y="554" fill="#000000" text-anchor="end">Rp 21.9M / mo</text>
    <text x="364" y="566" fill="#808080" font-size="10" text-anchor="end">$1,400 / mo</text>

    <text x="26" y="584" fill="#000000">Lifestyle</text>
    <text x="364" y="580" fill="#000000" text-anchor="end">Rp 0</text>
    <text x="364" y="592" fill="#808080" font-size="10" text-anchor="end">$0</text>
  </g>

  <line x1="26" y1="600" x2="364" y2="600" stroke="#E5E5E5" stroke-width="1"/>

  <!-- savings highlight rows -->
  <g font-size="12">
    <text x="26" y="619" fill="#000000" font-weight="700">Essential savings</text>
    <text x="170" y="619" fill="#029E73" font-weight="700" font-size="11">79%</text>
    <text x="364" y="616" fill="#029E73" text-anchor="end" font-weight="700">Rp 84.4M / mo</text>
    <text x="364" y="628" fill="#029E73" font-size="10" text-anchor="end" font-weight="600">$5,400 / mo</text>
  </g>
  <text x="26" y="634" font-size="11" fill="#000000">After-lifestyle savings</text>
  <text x="170" y="634" font-size="10" fill="#808080">79%</text>
  <text x="364" y="634" font-size="11" fill="#000000" text-anchor="end" font-weight="600">$5,400 / mo</text>

  <!-- ===== Card 2 peek: Kuala Lumpur, Malaysia ===== -->
  <rect x="14" y="648" width="362" height="62" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="14" y="648" width="362" height="34" rx="8" fill="#F6F8FA"/>
  <rect x="14" y="666" width="362" height="16" fill="#F6F8FA"/>
  <text x="26" y="670" font-size="14" fill="#0173B2" text-decoration="underline" font-weight="700">Kuala Lumpur</text>
  <text x="124" y="670" font-size="12" fill="#000000">, </text>
  <text x="134" y="670" font-size="14" fill="#0173B2" text-decoration="underline" font-weight="700">Malaysia</text>
  <rect x="208" y="654" width="60" height="18" rx="9" fill="#DE8F05"/>
  <text x="238" y="667" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">payroll</text>
  <text x="282" y="667" font-size="10" fill="#808080">view detail →</text>
  <g font-size="12">
    <text x="26" y="700" fill="#000000">Essential savings</text>
    <text x="180" y="700" fill="#029E73" font-weight="700" font-size="11">74%</text>
    <text x="364" y="697" fill="#029E73" text-anchor="end" font-weight="700">RM 30.6k / yr</text>
    <text x="364" y="708" fill="#029E73" font-size="10" text-anchor="end" font-weight="600">$4,835 / mo</text>
  </g>

  <!-- OOP legend -->
  <rect x="14" y="720" width="362" height="74" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <g font-size="11">
    <text x="24" y="737" fill="#000000">Money cells: <tspan font-weight="700">local</tspan> over <tspan fill="#808080">USD</tspan>. <tspan fill="#0173B2" text-decoration="underline">City</tspan> + <tspan fill="#0173B2" text-decoration="underline">Country</tspan> are links.</text>
    <text x="24" y="753" fill="#000000"><tspan font-weight="700">OOP = out-of-pocket</tspan> — healthcare you pay for</text>
    <text x="24" y="768" fill="#000000">yourself; essentials model OOP only. The scheme</text>
    <text x="24" y="783" fill="#000000">badge shows how care is funded.</text>
  </g>

  <!-- Disclaimer -->
  <line x1="14" y1="802" x2="376" y2="802" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="14" y="820" font-weight="700" fill="#DE8F05">Estimates only — read before relying</text>
    <text x="14" y="838">Savings are computed <tspan font-weight="600">before pension / retirement</tspan></text>
    <text x="14" y="852">contributions — deducted separately, not reflected here.</text>
    <text x="14" y="870">USD uses <tspan font-weight="600">nominal FX</tspan>, not purchasing-power parity</text>
    <text x="14" y="884">(PPP); a high nominal-USD saving may buy less locally.</text>
    <text x="14" y="902">Effective tax % combines <tspan font-weight="600">federal + sub-national</tspan> bands.</text>
    <text x="14" y="920">Snapshot 2026-06. Modeled figures, not offers.</text>
  </g>
</svg>
