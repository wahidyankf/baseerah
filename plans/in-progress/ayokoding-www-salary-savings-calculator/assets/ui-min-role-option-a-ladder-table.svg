<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Minimum-role screen, Option A (Ladder Table) high-fidelity finalist</title>
  <desc>High-fidelity mockup of the Cost of Living Calculator Minimum role tab using the Ladder Table layout. A three-tab toggle has Minimum role active. A caption badge reads Roles: software-engineering (IC plus management). A baseline selector chooses my salary, reference role, or savings target, with a display-currency selector, alongside Region/Country/City filters. The ladder table lists qualifying roles ranked high to low down to a clearly marked MINIMUM row, then a divider, then dimmed non-qualifying roles below the minimum. Columns cover role, best city as a link, country, p25, median, p75, non-salary comp, total comp, essential savings in USD and local, and a qualifying status. The chosen display currency is reflected throughout.</desc>

  <rect x="0" y="0" width="1180" height="660" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1179" height="659" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="1180" height="48" fill="#0173B2"/>
  <text x="20" y="31" font-size="19" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Minimum role</text>
  <rect x="940" y="13" width="222" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="956" y="28" font-size="12" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- Tabs -->
  <g font-size="14">
    <rect x="20" y="62" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="85" y="84" text-anchor="middle" fill="#808080">Cost of living</text>
    <rect x="154" y="62" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="204" y="84" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="258" y="62" width="140" height="34" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="328" y="84" text-anchor="middle" font-weight="700" fill="#FFFFFF">Minimum role</text>
  </g>

  <!-- caption badge -->
  <rect x="414" y="62" width="356" height="34" rx="17" fill="#CC78BC"/>
  <text x="592" y="84" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Roles: software-engineering (IC + management)</text>

  <!-- Baseline selector -->
  <rect x="20" y="108" width="560" height="58" rx="8" fill="#F6F8FA" stroke="#0173B2" stroke-width="1.5"/>
  <text x="34" y="128" font-size="12" font-weight="700" fill="#000000">Baseline</text>
  <g font-size="12">
    <circle cx="44" cy="148" r="6" fill="#FFFFFF" stroke="#808080" stroke-width="1.5"/>
    <text x="56" y="152" fill="#808080">My salary</text>
    <circle cx="160" cy="148" r="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <circle cx="160" cy="148" r="2.5" fill="#FFFFFF"/>
    <text x="172" y="152" fill="#000000" font-weight="600">Reference role</text>
    <circle cx="320" cy="148" r="6" fill="#FFFFFF" stroke="#808080" stroke-width="1.5"/>
    <text x="332" y="152" fill="#808080">Savings target</text>
  </g>
  <rect x="440" y="138" width="128" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="450" y="153" font-size="11" fill="#000000">Sr SWE · Jakarta</text>

  <!-- Display currency selector -->
  <rect x="600" y="108" width="200" height="58" rx="8" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="614" y="128" font-size="12" font-weight="700" fill="#000000">Display currency</text>
  <rect x="614" y="136" width="170" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="624" y="152" font-size="12" fill="#000000">EUR (€)</text><text x="770" y="152" font-size="12" fill="#808080">▼</text>

  <!-- Region/Country/City filters -->
  <g font-size="12">
    <text x="824" y="126" font-weight="600" fill="#000000">Region</text>
    <rect x="876" y="113" width="120" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="884" y="129" fill="#000000">All</text><text x="982" y="129" fill="#808080">▼</text>
    <text x="824" y="153" font-weight="600" fill="#000000">Country</text>
    <rect x="884" y="140" width="112" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="892" y="156" fill="#000000">All</text><text x="982" y="156" fill="#808080">▼</text>
    <text x="1006" y="126" font-weight="600" fill="#000000">City</text>
    <rect x="1042" y="113" width="110" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="1050" y="129" fill="#000000">All</text><text x="1138" y="129" fill="#808080">▼</text>
    <text x="1006" y="156" font-size="11" fill="#808080">scope candidates</text>
  </g>

  <line x1="20" y1="180" x2="1160" y2="180" stroke="#808080" stroke-width="1"/>

  <!-- Threshold note -->
  <text x="20" y="200" font-size="12" font-weight="600" fill="#000000">Baseline threshold: essential savings ≥ <tspan fill="#0173B2">€1,930 / mo</tspan> (≈ $2,100)</text>

  <!-- Table header -->
  <rect x="20" y="210" width="1140" height="40" fill="#0173B2"/>
  <g font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">
    <text x="120" y="234">Role</text>
    <text x="270" y="234">Best city</text>
    <text x="390" y="234">Country</text>
    <text x="476" y="234">p25</text>
    <text x="560" y="234">Median</text>
    <text x="648" y="234">p75</text>
    <text x="740" y="228">Non-sal</text><text x="740" y="240">comp</text>
    <text x="838" y="228">Total</text><text x="838" y="240">comp</text>
    <text x="950" y="228">Essential savings</text><text x="950" y="240">(EUR + local)</text>
    <text x="1090" y="234">Status</text>
  </g>

  <!-- group label: Qualifies -->
  <rect x="20" y="250" width="1140" height="22" fill="#E7F2EA"/>
  <text x="32" y="265" font-size="11" font-weight="700" fill="#029E73">QUALIFYING ROLES (ranked high → low to the minimum)</text>

  <!-- Qualifying Row 1: Director -->
  <rect x="20" y="272" width="1140" height="40" fill="#FFFFFF"/>
  <g font-size="11" text-anchor="middle">
    <text x="120" y="296" fill="#000000" font-weight="600">Director</text>
    <text x="270" y="296" fill="#0173B2" text-decoration="underline" font-weight="600">Kuala Lumpur</text>
    <text x="390" y="296" fill="#000000">Malaysia</text>
    <text x="476" y="296" fill="#808080">€8.3k</text>
    <text x="560" y="296" fill="#000000" font-weight="600">€11.0k</text>
    <text x="648" y="296" fill="#808080">€14.7k</text>
    <text x="740" y="296" fill="#808080">+€2.4k</text>
    <text x="838" y="296" fill="#000000">€13.4k</text>
    <text x="950" y="290" fill="#029E73" font-weight="700">€4,510</text><text x="950" y="302" fill="#808080" font-size="9">RM 22.8k</text>
  </g>
  <rect x="1064" y="282" width="52" height="18" rx="9" fill="#029E73"/>
  <text x="1090" y="295" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
  <line x1="20" y1="312" x2="1160" y2="312" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Qualifying Row 2: Staff SWE -->
  <rect x="20" y="312" width="1140" height="40" fill="#F6F8FA"/>
  <g font-size="11" text-anchor="middle">
    <text x="120" y="336" fill="#000000" font-weight="600">Staff SWE</text>
    <text x="270" y="336" fill="#0173B2" text-decoration="underline" font-weight="600">Manila</text>
    <text x="390" y="336" fill="#000000">Philippines</text>
    <text x="476" y="336" fill="#808080">€5.5k</text>
    <text x="560" y="336" fill="#000000" font-weight="600">€7.3k</text>
    <text x="648" y="336" fill="#808080">€10.1k</text>
    <text x="740" y="336" fill="#808080">+€1.5k</text>
    <text x="838" y="336" fill="#000000">€8.8k</text>
    <text x="950" y="330" fill="#029E73" font-weight="700">€3,230</text><text x="950" y="342" fill="#808080" font-size="9">₱204k</text>
  </g>
  <rect x="1064" y="322" width="52" height="18" rx="9" fill="#029E73"/>
  <text x="1090" y="335" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
  <line x1="20" y1="352" x2="1160" y2="352" stroke="#E5E5E5" stroke-width="1"/>

  <!-- MINIMUM Row: Sr SWE -->
  <rect x="20" y="352" width="1140" height="44" fill="#FFF4E0"/>
  <rect x="20" y="352" width="6" height="44" fill="#DE8F05"/>
  <g font-size="11" text-anchor="middle">
    <text x="120" y="378" fill="#000000" font-weight="700">▶ Sr SWE</text>
    <text x="270" y="378" fill="#0173B2" text-decoration="underline" font-weight="700">Jakarta</text>
    <text x="390" y="378" fill="#000000">Indonesia</text>
    <text x="476" y="378" fill="#808080">€3.7k</text>
    <text x="560" y="378" fill="#000000" font-weight="700">€5.5k</text>
    <text x="648" y="378" fill="#808080">€7.3k</text>
    <text x="740" y="378" fill="#808080">+€0.9k</text>
    <text x="838" y="378" fill="#000000">€6.4k</text>
    <text x="950" y="372" fill="#DE8F05" font-weight="700">€1,930</text><text x="950" y="384" fill="#808080" font-size="9">Rp 33.4M</text>
  </g>
  <rect x="1058" y="364" width="64" height="20" rx="10" fill="#DE8F05"/>
  <text x="1090" y="378" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ MIN</text>

  <!-- Divider -->
  <rect x="20" y="396" width="1140" height="24" fill="#EFEFEF"/>
  <line x1="20" y1="408" x2="1160" y2="408" stroke="#808080" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="500" y="398" width="180" height="20" rx="10" fill="#808080"/>
  <text x="590" y="412" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">— BELOW MINIMUM —</text>

  <!-- group label: below -->
  <!-- Below Row 1: SWE II (dimmed) -->
  <rect x="20" y="420" width="1140" height="38" fill="#FFFFFF"/>
  <g font-size="11" text-anchor="middle" opacity="0.45">
    <text x="120" y="443" fill="#000000">SWE II</text>
    <text x="270" y="443" fill="#0173B2" text-decoration="underline">Jakarta</text>
    <text x="390" y="443" fill="#000000">Indonesia</text>
    <text x="476" y="443" fill="#808080">€2.8k</text>
    <text x="560" y="443" fill="#000000">€4.1k</text>
    <text x="648" y="443" fill="#808080">€5.4k</text>
    <text x="740" y="443" fill="#808080">+€0.5k</text>
    <text x="838" y="443" fill="#000000">€4.6k</text>
    <text x="950" y="437" fill="#000000">€1,470</text><text x="950" y="449" fill="#808080" font-size="9">Rp 25.4M</text>
  </g>
  <rect x="1060" y="430" width="60" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="1090" y="443" font-size="9.5" fill="#808080" text-anchor="middle">below</text>
  <line x1="20" y1="458" x2="1160" y2="458" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Below Row 2: SWE I (dimmed) -->
  <rect x="20" y="458" width="1140" height="38" fill="#F6F8FA"/>
  <g font-size="11" text-anchor="middle" opacity="0.45">
    <text x="120" y="481" fill="#000000">SWE I</text>
    <text x="270" y="481" fill="#0173B2" text-decoration="underline">Jakarta</text>
    <text x="390" y="481" fill="#000000">Indonesia</text>
    <text x="476" y="481" fill="#808080">€2.2k</text>
    <text x="560" y="481" fill="#000000">€3.2k</text>
    <text x="648" y="481" fill="#808080">€4.2k</text>
    <text x="740" y="481" fill="#808080">+€0.3k</text>
    <text x="838" y="481" fill="#000000">€3.5k</text>
    <text x="950" y="475" fill="#000000">€980</text><text x="950" y="487" fill="#808080" font-size="9">Rp 17.0M</text>
  </g>
  <rect x="1060" y="468" width="60" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="1090" y="481" font-size="9.5" fill="#808080" text-anchor="middle">below</text>

  <rect x="20" y="272" width="1140" height="224" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="20" y="510" width="700" height="26" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="32" y="527" fill="#000000">Essential savings shown in <tspan font-weight="700">display currency (EUR)</tspan> + <tspan fill="#808080">local</tspan>. Ranking uses the role × country <tspan font-weight="600">median</tspan>. Best city links to detail.</text>
  </g>

  <!-- Disclaimer -->
  <line x1="20" y1="554" x2="1160" y2="554" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="20" y="574" font-weight="700" fill="#DE8F05">Estimates only</text>
    <text x="120" y="574">Salary bands (p25 / median / p75) are modeled per role × country, not offers. The MINIMUM is the lowest-ranked role still clearing the baseline threshold.</text>
    <text x="20" y="592">Display-currency and USD figures use nominal FX (not PPP); savings are computed before pension contributions. Snapshot date 2026-06.</text>
    <text x="20" y="610">Dimmed rows below the divider do not meet the baseline savings threshold and are shown for near-miss context only.</text>
  </g>
</svg>
