    <text x="552" y="518" fill="#000000">$4.1k</text><text x="552" y="531" fill="#808080" font-size="9">Rp 71.0M</text>
    <text x="672" y="518" fill="#000000">$5.4k</text><text x="672" y="531" fill="#808080" font-size="9">Rp 93.5M</text>
    <text x="792" y="518" fill="#000000">+$0.5k</text><text x="792" y="531" fill="#808080" font-size="9">+Rp 8.7M</text>
    <text x="912" y="518" fill="#000000">$4.6k</text><text x="912" y="531" fill="#808080" font-size="9">Rp 79.7M</text>
    <text x="1032" y="518" fill="#000000">$1,470</text><text x="1032" y="531" fill="#808080" font-size="9">Rp 25.4M</text>
  </g>
  <rect x="1092" y="506" width="56" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="1120" y="519" font-size="9.5" fill="#808080" text-anchor="middle">below</text>
  <line x1="20" y1="544" x2="1160" y2="544" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Below Row 2: SWE I (dimmed) -->
  <rect x="20" y="544" width="1140" height="48" fill="#F6F8FA"/>
  <g font-size="11" text-anchor="middle" opacity="0.45">
    <text x="100" y="572" fill="#000000">SWE I</text>
    <text x="226" y="572" fill="#0173B2" text-decoration="underline">Jakarta</text>
    <text x="330" y="572" fill="#0173B2" text-decoration="underline">Indonesia</text>
    <text x="430" y="566" fill="#000000">$2.2k</text><text x="430" y="579" fill="#808080" font-size="9">Rp 38.1M</text>
    <text x="552" y="566" fill="#000000">$3.2k</text><text x="552" y="579" fill="#808080" font-size="9">Rp 55.4M</text>
    <text x="672" y="566" fill="#000000">$4.2k</text><text x="672" y="579" fill="#808080" font-size="9">Rp 72.7M</text>
    <text x="792" y="566" fill="#000000">+$0.3k</text><text x="792" y="579" fill="#808080" font-size="9">+Rp 5.2M</text>
    <text x="912" y="566" fill="#000000">$3.5k</text><text x="912" y="579" fill="#808080" font-size="9">Rp 60.6M</text>
    <text x="1032" y="566" fill="#000000">$980</text><text x="1032" y="579" fill="#808080" font-size="9">Rp 17.0M</text>
  </g>
  <rect x="1092" y="554" width="56" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="1120" y="567" font-size="9.5" fill="#808080" text-anchor="middle">below</text>

  <rect x="20" y="318" width="1140" height="274" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- legend -->
  <g font-size="11">
    <rect x="20" y="606" width="1140" height="44" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="32" y="623" fill="#000000"><tspan font-weight="700">Every money column shows display currency (USD) on line 1 + local currency on line 2.</tspan> Ranking uses the role × country <tspan font-weight="600">median</tspan>.</text>
    <text x="32" y="642" fill="#000000"><tspan fill="#0173B2" text-decoration="underline">Best city</tspan> &amp; <tspan fill="#0173B2" text-decoration="underline">Country</tspan> are links → Cost-of-living filtered. The minimum depends on the cost basis: e.g. <tspan font-weight="600">SWE I may suffice if you are single, but not with 2 kids in the city center.</tspan></text>
  </g>

  <!-- Disclaimer -->
  <line x1="20" y1="660" x2="1160" y2="660" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="20" y="680" font-weight="700" fill="#DE8F05">Estimates only</text>
    <text x="120" y="680">Salary bands (p25 / median / p75) are modeled per role × country, not offers. The MINIMUM is the lowest-ranked role still clearing the baseline threshold.</text>
    <text x="20" y="698">Display-currency and local figures use nominal FX (not PPP); savings are computed before pension contributions. Snapshot date 2026-06.</text>
    <text x="20" y="716">Essential savings uses the active household / area / school cost basis — changing the household composition can change which role is the minimum.</text>
    <text x="20" y="734">Dimmed rows below the divider do not meet the baseline savings threshold and are shown for near-miss context only.</text>
  </g>
</svg>
