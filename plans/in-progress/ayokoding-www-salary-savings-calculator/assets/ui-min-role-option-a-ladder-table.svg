  <text x="1120" y="346" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
  <line x1="20" y1="368" x2="1160" y2="368" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Qualifying Row 2: Staff SWE -->
  <rect x="20" y="368" width="1140" height="50" fill="#F6F8FA"/>
  <g font-size="11" text-anchor="middle">
    <text x="100" y="397" fill="#000000" font-weight="600">Staff SWE</text>
    <text x="226" y="397" fill="#0173B2" text-decoration="underline" font-weight="600">Manila</text>
    <text x="330" y="397" fill="#0173B2" text-decoration="underline" font-weight="600">Philippines</text>
    <text x="430" y="391" fill="#000000">$5.5k</text><text x="430" y="404" fill="#808080" font-size="9">₱347k</text>
    <text x="552" y="391" fill="#000000" font-weight="600">$7.3k</text><text x="552" y="404" fill="#808080" font-size="9">₱461k</text>
    <text x="672" y="391" fill="#000000">$10.1k</text><text x="672" y="404" fill="#808080" font-size="9">₱638k</text>
    <text x="792" y="391" fill="#000000">+$1.5k</text><text x="792" y="404" fill="#808080" font-size="9">+₱95k</text>
    <text x="912" y="391" fill="#000000">$8.8k</text><text x="912" y="404" fill="#808080" font-size="9">₱556k</text>
    <text x="1032" y="391" fill="#029E73" font-weight="700">$3,230</text><text x="1032" y="404" fill="#808080" font-size="9">₱204k</text>
  </g>
  <rect x="1096" y="383" width="48" height="18" rx="9" fill="#029E73"/>
  <text x="1120" y="396" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓</text>
  <line x1="20" y1="418" x2="1160" y2="418" stroke="#E5E5E5" stroke-width="1"/>

  <!-- MINIMUM Row: Sr SWE -->
  <rect x="20" y="418" width="1140" height="54" fill="#FFF4E0"/>
  <rect x="20" y="418" width="6" height="54" fill="#DE8F05"/>
  <g font-size="11" text-anchor="middle">
    <text x="100" y="449" fill="#000000" font-weight="700">▶ Sr SWE</text>
    <text x="226" y="449" fill="#0173B2" text-decoration="underline" font-weight="700">Jakarta</text>
    <text x="330" y="449" fill="#0173B2" text-decoration="underline" font-weight="700">Indonesia</text>
    <text x="430" y="443" fill="#000000">$3.7k</text><text x="430" y="456" fill="#808080" font-size="9">Rp 64.0M</text>
    <text x="552" y="443" fill="#000000" font-weight="700">$5.5k</text><text x="552" y="456" fill="#808080" font-size="9">Rp 95.2M</text>
    <text x="672" y="443" fill="#000000">$7.3k</text><text x="672" y="456" fill="#808080" font-size="9">Rp 126.3M</text>
    <text x="792" y="443" fill="#000000">+$0.9k</text><text x="792" y="456" fill="#808080" font-size="9">+Rp 15.6M</text>
    <text x="912" y="443" fill="#000000">$6.4k</text><text x="912" y="456" fill="#808080" font-size="9">Rp 110.7M</text>
    <text x="1032" y="443" fill="#DE8F05" font-weight="700">$1,930</text><text x="1032" y="456" fill="#808080" font-size="9">Rp 33.4M</text>
  </g>
  <rect x="1088" y="436" width="64" height="20" rx="10" fill="#DE8F05"/>
  <text x="1120" y="450" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ MIN</text>

  <!-- Divider -->
  <rect x="20" y="472" width="1140" height="24" fill="#EFEFEF"/>
  <line x1="20" y1="484" x2="1160" y2="484" stroke="#808080" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="500" y="474" width="180" height="20" rx="10" fill="#808080"/>
  <text x="590" y="488" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">— BELOW MINIMUM —</text>

  <!-- Below Row 1: SWE II (dimmed) -->
  <rect x="20" y="496" width="1140" height="48" fill="#FFFFFF"/>
