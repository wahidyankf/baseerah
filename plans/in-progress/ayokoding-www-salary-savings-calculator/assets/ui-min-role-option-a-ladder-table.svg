    <rect x="434" y="184" width="138" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="442" y="200" fill="#000000">School-age kids: 1</text>

    <text x="592" y="198" font-weight="600" fill="#000000">Area</text>
    <rect x="632" y="184" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="662" y="200" text-anchor="middle" fill="#808080">Center</text>
    <rect x="696" y="184" width="54" height="22" rx="11" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="723" y="200" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="770" y="198" font-weight="600" fill="#000000">School</text>
    <rect x="822" y="184" width="60" height="22" rx="11" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="852" y="200" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="886" y="184" width="62" height="22" rx="11" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="917" y="200" text-anchor="middle" fill="#808080">Private</text>
    <text x="966" y="192" font-size="10" fill="#808080">Same controls on every tab;</text>
    <text x="966" y="205" font-size="10" fill="#808080">drives essentials</text>
  </g>

  <line x1="20" y1="224" x2="1160" y2="224" stroke="#808080" stroke-width="1"/>

  <!-- Threshold note -->
  <text x="20" y="244" font-size="12" font-weight="600" fill="#000000">Baseline threshold: essential savings ≥ <tspan fill="#0173B2">$1,930 / mo</tspan> (≈ $2,100) at the active household + area + school basis</text>

  <!-- Table header -->
  <rect x="20" y="254" width="1140" height="42" fill="#0173B2"/>
  <g font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">
    <text x="100" y="279">Role</text>
    <text x="226" y="279" text-decoration="underline">Best city</text>
    <text x="330" y="279" text-decoration="underline">Country</text>
    <text x="430" y="273">p25</text><text x="430" y="285">(USD + local)</text>
    <text x="552" y="273">Median</text><text x="552" y="285">(USD + local)</text>
    <text x="672" y="273">p75</text><text x="672" y="285">(USD + local)</text>
    <text x="792" y="273">Non-sal comp</text><text x="792" y="285">(USD + local)</text>
    <text x="912" y="273">Total comp</text><text x="912" y="285">(USD + local)</text>
    <text x="1032" y="273">Essential savings</text><text x="1032" y="285">(USD + local)</text>
    <text x="1120" y="279">Status</text>
  </g>

  <!-- group label: Qualifies -->
  <rect x="20" y="296" width="1140" height="22" fill="#E7F2EA"/>
  <text x="32" y="311" font-size="11" font-weight="700" fill="#029E73">QUALIFYING ROLES (ranked high → low to the minimum)</text>

  <!-- Qualifying Row 1: Director -->
  <rect x="20" y="318" width="1140" height="50" fill="#FFFFFF"/>
  <g font-size="11" text-anchor="middle">
    <text x="100" y="347" fill="#000000" font-weight="600">Director</text>
    <text x="226" y="347" fill="#0173B2" text-decoration="underline" font-weight="600">Kuala Lumpur</text>
    <text x="330" y="347" fill="#0173B2" text-decoration="underline" font-weight="600">Malaysia</text>
    <text x="430" y="341" fill="#000000">$8.3k</text><text x="430" y="354" fill="#808080" font-size="9">RM 42.0k</text>
    <text x="552" y="341" fill="#000000" font-weight="600">$11.0k</text><text x="552" y="354" fill="#808080" font-size="9">RM 55.6k</text>
    <text x="672" y="341" fill="#000000">$14.7k</text><text x="672" y="354" fill="#808080" font-size="9">RM 74.3k</text>
    <text x="792" y="341" fill="#000000">+$2.4k</text><text x="792" y="354" fill="#808080" font-size="9">+RM 12.1k</text>
    <text x="912" y="341" fill="#000000">$13.4k</text><text x="912" y="354" fill="#808080" font-size="9">RM 67.7k</text>
    <text x="1032" y="341" fill="#029E73" font-weight="700">$4,510</text><text x="1032" y="354" fill="#808080" font-size="9">RM 22.8k</text>
  </g>
