<svg xmlns="http://www.w3.org/2000/svg" width="390" height="980" viewBox="0 0 390 980" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Minimum-role screen, Option A (Ladder Table) — mobile reflow</title>
  <desc>High-fidelity mobile mockup (390px wide, single column) of the Cost of Living Calculator Minimum role tab using the Ladder Table layout reflowed to a phone. A compact blue header bar reads Cost of Living Calculator — Minimum role with a snapshot estimates-only chip. Below it three full-width tab pills (Cost of living, Savings, Minimum role) have Minimum role active, followed by a purple caption badge reading Roles: software-engineering (IC plus management). The baseline selector and the USD-default display-currency selector stack vertically, then the Region/Country/City scope filters stack, then the shared amber cost-basis controls (household adults/pre-school kids/school-age kids, area center-or-rural, school public-or-private) stack — the same control set used on every tab — because the minimum qualifying role depends on the household and area cost basis. The ladder renders as stacked rank cards top to bottom: Director, Staff SWE, then a highlighted Sr SWE MIN card with an amber left accent and a MIN badge, then a dashed Below Minimum divider, then dimmed SWE II and SWE I cards. Each card shows the role label, the best city and its country as underlined links, and the six money rows p25, Median, p75, Non-salary comp, Total comp, and Essential savings — each shown as the display currency (USD) over the local currency. A legend explains that the minimum depends on the household and area cost basis, and an estimates-only disclaimer closes the screen.</desc>

  <rect x="0" y="0" width="390" height="980" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="389" height="979" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="64" fill="#0173B2"/>
  <text x="14" y="26" font-size="15" font-weight="700" fill="#FFFFFF">Cost of Living Calculator</text>
  <text x="14" y="46" font-size="13" font-weight="700" fill="#FFFFFF">Minimum role</text>
  <rect x="222" y="40" width="156" height="18" rx="9" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="232" y="53" font-size="10" fill="#000000">Snapshot 2026-06 · estimates</text>

  <!-- Tab pills (full width, 3 across) -->
  <g font-size="12">
    <rect x="14" y="76" width="116" height="32" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="72" y="96" text-anchor="middle" fill="#808080">Cost of living</text>
    <rect x="136" y="76" width="80" height="32" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="176" y="96" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="222" y="76" width="154" height="32" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="299" y="96" text-anchor="middle" font-weight="700" fill="#FFFFFF">Minimum role</text>
  </g>

  <!-- caption badge -->
  <rect x="14" y="116" width="362" height="28" rx="14" fill="#CC78BC"/>
  <text x="195" y="135" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Roles: software-engineering (IC + management)</text>

  <!-- Baseline selector (stacked) -->
  <rect x="14" y="152" width="362" height="62" rx="8" fill="#F6F8FA" stroke="#0173B2" stroke-width="1.5"/>
  <text x="26" y="170" font-size="12" font-weight="700" fill="#000000">Baseline</text>
  <g font-size="11">
    <circle cx="32" cy="188" r="6" fill="#FFFFFF" stroke="#808080" stroke-width="1.5"/>
    <text x="44" y="192" fill="#808080">My salary</text>
    <circle cx="128" cy="188" r="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <circle cx="128" cy="188" r="2.5" fill="#FFFFFF"/>
    <text x="140" y="192" fill="#000000" font-weight="600">Reference role</text>
    <circle cx="262" cy="188" r="6" fill="#FFFFFF" stroke="#808080" stroke-width="1.5"/>
    <text x="274" y="192" fill="#808080">Savings target</text>
  </g>
  <rect x="26" y="200" width="160" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="36" y="215" font-size="11" fill="#000000">Sr SWE · Jakarta</text>
  <text x="200" y="215" font-size="10" fill="#808080">reference role + city</text>

  <!-- Display currency selector (stacked) -->
  <rect x="14" y="224" width="362" height="46" rx="8" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="26" y="242" font-size="12" font-weight="700" fill="#000000">Display currency</text>
  <rect x="26" y="248" width="150" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="36" y="263" font-size="11" fill="#000000">USD ($)</text><text x="162" y="263" font-size="11" fill="#808080">▼</text>
  <text x="190" y="263" font-size="10" fill="#808080">default · line 1 of each money cell</text>

  <!-- Scope filters (stacked) -->
  <rect x="14" y="280" width="362" height="62" rx="8" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <g font-size="11">
    <text x="26" y="299" font-weight="700" fill="#000000">Scope</text>
    <text x="78" y="299" font-weight="600" fill="#000000">Region</text>
    <rect x="124" y="287" width="80" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="130" y="301" fill="#000000">All</text><text x="190" y="301" fill="#808080">▼</text>
    <text x="218" y="299" font-weight="600" fill="#000000">Country</text>
    <rect x="270" y="287" width="96" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="276" y="301" fill="#000000">All</text><text x="352" y="301" fill="#808080">▼</text>
    <text x="26" y="327" font-weight="600" fill="#000000">City</text>
    <rect x="78" y="315" width="126" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="84" y="329" fill="#000000">All</text><text x="190" y="329" fill="#808080">▼</text>
    <text x="218" y="329" font-size="10" fill="#808080">scope candidates</text>
  </g>

  <!-- Shared cost-basis controls (stacked) -->
  <rect x="14" y="350" width="362" height="86" rx="8" fill="#FFF8EC" stroke="#DE8F05" stroke-width="1.5"/>
  <g font-size="11">
    <text x="26" y="369" font-weight="700" fill="#DE8F05">Cost basis</text>
    <text x="118" y="369" font-size="9.5" fill="#808080">same controls on every tab · drives essentials</text>
    <text x="26" y="390" font-weight="600" fill="#000000">Household</text>
    <rect x="100" y="378" width="78" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="106" y="392" fill="#000000">Adults: 2</text>
    <rect x="184" y="378" width="104" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="190" y="392" fill="#000000">Pre-school: 1</text>
    <rect x="294" y="378" width="74" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="300" y="392" fill="#000000">School: 1</text>

    <text x="26" y="424" font-weight="600" fill="#000000">Area</text>
    <rect x="62" y="412" width="54" height="20" rx="10" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="89" y="426" text-anchor="middle" fill="#808080">Center</text>
    <rect x="120" y="412" width="48" height="20" rx="10" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="144" y="426" text-anchor="middle" fill="#FFFFFF">Rural</text>
    <text x="184" y="424" font-weight="600" fill="#000000">School</text>
    <rect x="238" y="412" width="54" height="20" rx="10" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="265" y="426" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="296" y="412" width="56" height="20" rx="10" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="324" y="426" text-anchor="middle" fill="#808080">Private</text>
  </g>

  <!-- Threshold note -->
  <text x="14" y="456" font-size="11" font-weight="600" fill="#000000">Threshold: essential savings ≥ <tspan fill="#0173B2">$1,930 / mo</tspan> at active basis</text>

  <!-- ===== Stacked rank cards ===== -->
  <text x="14" y="478" font-size="10" font-weight="700" fill="#029E73">QUALIFYING ROLES (ranked high → low to the minimum)</text>

  <!-- Card 1: Director -->
  <rect x="14" y="486" width="362" height="74" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="26" y="505" font-size="13" font-weight="700" fill="#000000">Director</text>
  <text x="26" y="521" font-size="11" fill="#0173B2" text-decoration="underline">Kuala Lumpur</text>
  <text x="118" y="521" font-size="11" fill="#808080">·</text>
  <text x="128" y="521" font-size="11" fill="#0173B2" text-decoration="underline">Malaysia</text>
  <rect x="318" y="492" width="48" height="18" rx="9" fill="#029E73"/>
  <text x="342" y="505" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ OK</text>
  <g font-size="10">
    <text x="26" y="539" fill="#808080">p25</text><text x="62" y="539" fill="#000000" font-weight="600">$8.3k</text><text x="100" y="539" fill="#808080">RM 42.0k</text>
    <text x="170" y="539" fill="#808080">Median</text><text x="218" y="539" fill="#000000" font-weight="700">$11.0k</text><text x="262" y="539" fill="#808080">RM 55.6k</text>
    <text x="26" y="553" fill="#808080">p75</text><text x="62" y="553" fill="#000000" font-weight="600">$14.7k</text><text x="100" y="553" fill="#808080">RM 74.3k</text>
    <text x="170" y="553" fill="#808080">Non-sal</text><text x="218" y="553" fill="#000000" font-weight="600">+$2.4k</text><text x="262" y="553" fill="#808080">+RM 12.1k</text>
  </g>

  <!-- Card 2: Staff SWE -->
  <rect x="14" y="568" width="362" height="74" rx="6" fill="#F6F8FA" stroke="#000000" stroke-width="1"/>
  <text x="26" y="587" font-size="13" font-weight="700" fill="#000000">Staff SWE</text>
  <text x="26" y="603" font-size="11" fill="#0173B2" text-decoration="underline">Manila</text>
  <text x="80" y="603" font-size="11" fill="#808080">·</text>
  <text x="90" y="603" font-size="11" fill="#0173B2" text-decoration="underline">Philippines</text>
  <rect x="318" y="574" width="48" height="18" rx="9" fill="#029E73"/>
  <text x="342" y="587" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ OK</text>
  <g font-size="10">
    <text x="26" y="621" fill="#808080">p25</text><text x="62" y="621" fill="#000000" font-weight="600">$5.5k</text><text x="100" y="621" fill="#808080">₱347k</text>
    <text x="170" y="621" fill="#808080">Median</text><text x="218" y="621" fill="#000000" font-weight="700">$7.3k</text><text x="262" y="621" fill="#808080">₱461k</text>
    <text x="26" y="635" fill="#808080">p75</text><text x="62" y="635" fill="#000000" font-weight="600">$10.1k</text><text x="100" y="635" fill="#808080">₱638k</text>
    <text x="170" y="635" fill="#808080">Non-sal</text><text x="218" y="635" fill="#000000" font-weight="600">+$1.5k</text><text x="262" y="635" fill="#808080">+₱95k</text>
  </g>

  <!-- Card 3: MIN Sr SWE -->
  <rect x="14" y="650" width="362" height="92" rx="6" fill="#FFF4E0" stroke="#DE8F05" stroke-width="2"/>
  <rect x="14" y="650" width="6" height="92" rx="3" fill="#DE8F05"/>
  <text x="28" y="671" font-size="13" font-weight="700" fill="#000000">▶ Sr SWE</text>
  <text x="28" y="687" font-size="11" fill="#0173B2" text-decoration="underline" font-weight="700">Jakarta</text>
  <text x="84" y="687" font-size="11" fill="#808080">·</text>
  <text x="94" y="687" font-size="11" fill="#0173B2" text-decoration="underline" font-weight="700">Indonesia</text>
  <rect x="306" y="656" width="62" height="20" rx="10" fill="#DE8F05"/>
  <text x="337" y="670" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ MIN</text>
  <g font-size="10">
    <text x="28" y="705" fill="#808080">p25</text><text x="64" y="705" fill="#000000" font-weight="600">$3.7k</text><text x="102" y="705" fill="#808080">Rp 64.0M</text>
    <text x="200" y="705" fill="#808080">Median</text><text x="248" y="705" fill="#000000" font-weight="700">$5.5k</text><text x="292" y="705" fill="#808080">Rp 95.2M</text>
    <text x="28" y="719" fill="#808080">p75</text><text x="64" y="719" fill="#000000" font-weight="600">$7.3k</text><text x="102" y="719" fill="#808080">Rp 126.3M</text>
    <text x="200" y="719" fill="#808080">Non-sal</text><text x="248" y="719" fill="#000000" font-weight="600">+$0.9k</text><text x="292" y="719" fill="#808080">+Rp 15.6M</text>
    <text x="28" y="734" fill="#808080">Total comp</text><text x="98" y="734" fill="#000000" font-weight="600">$6.4k</text><text x="136" y="734" fill="#808080">Rp 110.7M</text>
    <text x="218" y="734" fill="#DE8F05" font-weight="700">Ess. savings $1,930</text><text x="332" y="734" fill="#808080">Rp 33.4M</text>
  </g>

  <!-- Below Minimum divider -->
  <line x1="14" y1="756" x2="376" y2="756" stroke="#808080" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="115" y="747" width="160" height="18" rx="9" fill="#808080"/>
  <text x="195" y="760" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">— BELOW MINIMUM —</text>

  <!-- Card 4: SWE II (dimmed) -->
  <g opacity="0.5">
    <rect x="14" y="772" width="362" height="62" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="26" y="791" font-size="13" font-weight="700" fill="#000000">SWE II</text>
    <text x="26" y="807" font-size="11" fill="#0173B2" text-decoration="underline">Jakarta</text>
    <text x="82" y="807" font-size="11" fill="#808080">·</text>
    <text x="92" y="807" font-size="11" fill="#0173B2" text-decoration="underline">Indonesia</text>
    <rect x="312" y="778" width="56" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="340" y="791" font-size="10" fill="#808080" text-anchor="middle">below</text>
    <g font-size="10">
      <text x="26" y="825" fill="#808080">Median</text><text x="74" y="825" fill="#000000" font-weight="600">$4.1k</text><text x="112" y="825" fill="#808080">Rp 71.0M</text>
      <text x="200" y="825" fill="#808080">Ess. savings</text><text x="278" y="825" fill="#000000" font-weight="600">$1,470</text><text x="322" y="825" fill="#808080">Rp 25.4M</text>
    </g>
  </g>

  <!-- Card 5: SWE I (dimmed) -->
  <g opacity="0.5">
    <rect x="14" y="842" width="362" height="62" rx="6" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="26" y="861" font-size="13" font-weight="700" fill="#000000">SWE I</text>
    <text x="26" y="877" font-size="11" fill="#0173B2" text-decoration="underline">Jakarta</text>
    <text x="82" y="877" font-size="11" fill="#808080">·</text>
    <text x="92" y="877" font-size="11" fill="#0173B2" text-decoration="underline">Indonesia</text>
    <rect x="312" y="848" width="56" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="340" y="861" font-size="10" fill="#808080" text-anchor="middle">below</text>
    <g font-size="10">
      <text x="26" y="895" fill="#808080">Median</text><text x="74" y="895" fill="#000000" font-weight="600">$3.2k</text><text x="112" y="895" fill="#808080">Rp 55.4M</text>
      <text x="200" y="895" fill="#808080">Ess. savings</text><text x="278" y="895" fill="#000000" font-weight="600">$980</text><text x="318" y="895" fill="#808080">Rp 17.0M</text>
    </g>
  </g>

  <!-- legend -->
  <rect x="14" y="912" width="362" height="32" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="22" y="926" font-size="9.5" fill="#000000"><tspan font-weight="700">Each money cell:</tspan> display currency (USD) over local currency.</text>
  <text x="22" y="939" font-size="9.5" fill="#000000">The minimum depends on the household/area cost basis above.</text>

  <!-- Disclaimer -->
  <line x1="14" y1="950" x2="376" y2="950" stroke="#808080" stroke-width="1"/>
  <g font-size="9.5" fill="#808080">
    <text x="14" y="964"><tspan font-weight="700" fill="#DE8F05">Estimates only.</tspan> Bands modeled per role × country, not offers. MIN = lowest role clearing the threshold.</text>
    <text x="14" y="976">Nominal FX (not PPP); dimmed rows are near-miss context. Snapshot 2026-06.</text>
  </g>
</svg>
