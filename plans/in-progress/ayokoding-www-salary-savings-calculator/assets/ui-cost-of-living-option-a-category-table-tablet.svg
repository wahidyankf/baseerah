<svg xmlns="http://www.w3.org/2000/svg" width="768" height="640" viewBox="0 0 768 640" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Cost-of-living screen, Option A (Category Table) — tablet reflow</title>
  <desc>High-fidelity tablet mockup (768px md width) of the Cost of Living Calculator Cost-of-living tab. A blue header bar shows the title and an estimates-only snapshot pill. Three tab pills follow with Cost of living active. The Region, Country, and City cascading filters and the household, area, and school-type controls are arranged in a two-column grid. Below sits a condensed table with columns Country, City, Essentials, Total, and Relocation, plus a chevron in each row hinting that the full category columns reveal on row tap. Three city rows appear: Jakarta Indonesia, Singapore, and Berlin Germany. Country and City names are underlined links. Money cells show local currency over USD. Healthcare funding-scheme badges (tax-funded, payroll) sit in a per-row scheme column. A legend explains OOP means out-of-pocket and that Country and City are links, and an estimates-only disclaimer closes the screen.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="768" height="640" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="767" height="639" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- ===== Header bar ===== -->
  <rect x="0" y="0" width="768" height="46" fill="#0173B2"/>
  <text x="18" y="30" font-size="17" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Cost of living</text>
  <rect x="528" y="12" width="222" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="544" y="27" font-size="11" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- ===== Tab pills ===== -->
  <g font-size="13">
    <rect x="18" y="58" width="134" height="30" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="85" y="78" text-anchor="middle" font-weight="700" fill="#FFFFFF">Cost of living</text>
    <rect x="158" y="58" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="206" y="78" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="260" y="58" width="118" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="319" y="78" text-anchor="middle" fill="#808080">Minimum role</text>
  </g>

  <!-- ===== Controls in a 2-column grid ===== -->
  <!-- Left column: cascading filters; Right column: household/area/school -->
  <g font-size="12">
    <!-- left column -->
    <text x="18" y="116" font-weight="600" fill="#000000">Region</text>
    <rect x="78" y="103" width="288" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="120" fill="#000000">All regions</text>
    <text x="352" y="120" fill="#808080">▼</text>

    <text x="18" y="150" font-weight="600" fill="#000000">Country</text>
    <rect x="78" y="137" width="288" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="154" fill="#000000">All countries</text>
    <text x="352" y="154" fill="#808080">▼</text>

    <text x="18" y="184" font-weight="600" fill="#000000">City</text>
    <rect x="78" y="171" width="288" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="188" fill="#000000">All cities</text>
    <text x="352" y="188" fill="#808080">▼</text>

    <!-- right column -->
    <text x="402" y="116" font-weight="600" fill="#000000">Household</text>
    <rect x="480" y="103" width="86" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="488" y="120" fill="#000000">Adults: 2</text>
    <rect x="572" y="103" width="178" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="580" y="120" fill="#000000">Kids: 1 pre · 1 school</text>

    <text x="402" y="150" font-weight="600" fill="#000000">Area</text>
    <rect x="444" y="137" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="475" y="154" text-anchor="middle" fill="#808080">Center</text>
    <rect x="510" y="137" width="56" height="26" rx="13" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="538" y="154" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="402" y="184" font-weight="600" fill="#000000">School</text>
    <rect x="456" y="171" width="62" height="26" rx="13" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="487" y="188" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="522" y="171" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="554" y="188" text-anchor="middle" fill="#808080">Private</text>
    <text x="600" y="188" font-size="11" fill="#808080">Region▸Country▸City</text>
  </g>

  <line x1="18" y1="210" x2="750" y2="210" stroke="#808080" stroke-width="1"/>

  <!-- ===== Condensed table ===== -->
  <!-- header band -->
  <rect x="18" y="220" width="732" height="34" fill="#0173B2"/>
  <g font-size="12" fill="#FFFFFF" font-weight="700">
    <text x="44" y="241" text-decoration="underline">Country</text>
    <text x="160" y="241" text-decoration="underline">City</text>
    <text x="300" y="241">Scheme</text>
    <text x="500" y="241" text-anchor="end">Essentials</text>
    <text x="618" y="241" text-anchor="end">Total</text>
    <text x="730" y="241" text-anchor="end">Relocation</text>
  </g>

  <!-- Row 1: Jakarta, Indonesia (height 76 so dual-currency + badge never clip) -->
  <rect x="18" y="254" width="732" height="76" fill="#FFFFFF"/>
  <g font-size="13">
    <text x="44" y="296" fill="#0173B2" text-decoration="underline" font-weight="600">Indonesia</text>
    <text x="160" y="288" fill="#0173B2" text-decoration="underline" font-weight="600">Jakarta</text>
    <text x="160" y="304" font-size="10" fill="#808080">tap row to expand ▾</text>
    <rect x="300" y="282" width="88" height="18" rx="9" fill="#029E73"/>
    <text x="344" y="295" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
    <text x="500" y="288" text-anchor="end" fill="#000000">Rp 22M</text><text x="500" y="304" text-anchor="end" font-size="11" fill="#808080">$1,400</text>
    <text x="618" y="288" text-anchor="end" fill="#000000" font-weight="700">Rp 24.8M</text><text x="618" y="304" text-anchor="end" font-size="11" fill="#808080">$1,580</text>
    <text x="730" y="288" text-anchor="end" fill="#000000">Rp 64M</text><text x="730" y="304" text-anchor="end" font-size="11" fill="#808080">$4,100 sunk</text>
  </g>
  <line x1="18" y1="330" x2="750" y2="330" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 2: Singapore -->
  <rect x="18" y="330" width="732" height="76" fill="#F6F8FA"/>
  <g font-size="13">
    <text x="44" y="372" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="160" y="364" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="160" y="380" font-size="10" fill="#808080">tap row to expand ▾</text>
    <rect x="300" y="358" width="88" height="18" rx="9" fill="#DE8F05"/>
    <text x="344" y="371" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">payroll</text>
    <text x="500" y="364" text-anchor="end" fill="#000000">S$6.3k</text><text x="500" y="380" text-anchor="end" font-size="11" fill="#808080">$4,730</text>
    <text x="618" y="364" text-anchor="end" fill="#000000" font-weight="700">S$7.5k</text><text x="618" y="380" text-anchor="end" font-size="11" fill="#808080">$5,630</text>
    <text x="730" y="364" text-anchor="end" fill="#000000">S$12k</text><text x="730" y="380" text-anchor="end" font-size="11" fill="#808080">$9,000 sunk</text>
  </g>
  <line x1="18" y1="406" x2="750" y2="406" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 3: Berlin, Germany -->
  <rect x="18" y="406" width="732" height="76" fill="#FFFFFF"/>
  <g font-size="13">
    <text x="44" y="448" fill="#0173B2" text-decoration="underline" font-weight="600">Germany</text>
    <text x="160" y="440" fill="#0173B2" text-decoration="underline" font-weight="600">Berlin</text>
    <text x="160" y="456" font-size="10" fill="#808080">tap row to expand ▾</text>
    <rect x="300" y="434" width="88" height="18" rx="9" fill="#029E73"/>
    <text x="344" y="447" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
    <text x="500" y="440" text-anchor="end" fill="#000000">€2,315</text><text x="500" y="456" text-anchor="end" font-size="11" fill="#808080">$2,520</text>
    <text x="618" y="440" text-anchor="end" fill="#000000" font-weight="700">€2,635</text><text x="618" y="456" text-anchor="end" font-size="11" fill="#808080">$2,870</text>
    <text x="730" y="440" text-anchor="end" fill="#000000">€6,790</text><text x="730" y="456" text-anchor="end" font-size="11" fill="#808080">$7,400 sunk</text>
  </g>
  <rect x="18" y="254" width="732" height="228" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- ===== Legend + disclaimer ===== -->
  <g font-size="11">
    <rect x="18" y="494" width="732" height="44" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="30" y="511" fill="#000000"><tspan font-weight="700">OOP = out-of-pocket</tspan> — the healthcare you pay yourself, on top of any tax-funded or insurance cover. The scheme badge shows how care is funded.</text>
    <text x="30" y="530" fill="#000000">Money cells: <tspan font-weight="700">local currency</tspan> over <tspan fill="#808080">USD</tspan>. <tspan fill="#0173B2" text-decoration="underline">Country</tspan> &amp; <tspan fill="#0173B2" text-decoration="underline">City</tspan> are links → Cost-of-living filtered. Tap a row to reveal all category columns.</text>
  </g>

  <line x1="18" y1="552" x2="750" y2="552" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="18" y="572" font-weight="700" fill="#DE8F05">Estimates only</text>
    <text x="120" y="572">Modeled monthly figures, not quotes; snapshot 2026-06, FX nominal.</text>
    <text x="18" y="592">Relocation is a one-time sunk cost; a separate liquidity reserve (held cushion) appears in the expanded row and city detail.</text>
    <text x="18" y="612">Healthcare (OOP) is the out-of-pocket spend you cover yourself; the per-row badge shows the funding model.</text>
  </g>
</svg>
