<svg xmlns="http://www.w3.org/2000/svg" width="768" height="700" viewBox="0 0 768 700" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Minimum-role screen, Option A (Ladder Table) — tablet reflow</title>
  <desc>High-fidelity tablet mockup (768px wide) of the Cost of Living Calculator Minimum role tab using the Ladder Table layout reflowed for tablet. A blue header bar reads Cost of Living Calculator — Minimum role with a snapshot estimates-only chip. Three tab pills (Cost of living, Savings, Minimum role) have Minimum role active, with a purple caption badge reading Roles: software-engineering (IC plus management). The baseline selector, the USD-default display-currency selector, the Region/Country/City scope filters, and the shared amber cost-basis controls (household, area center-or-rural, school public-or-private) are laid out in a two-column grid — the same control set used on every tab — because the minimum qualifying role depends on the household and area cost basis. Below is a condensed ladder table with the columns Role, Best city (Country), Median, Essential savings, and Status; each row carries a chevron implying that tapping it reveals p25/p75, non-salary comp, and total comp. The table lists Director and Staff SWE as qualifying rows, then a highlighted Sr SWE row with an amber left accent and a MIN badge, then a dashed Below Minimum divider, then dimmed SWE II and SWE I rows. Best-city and country names render as underlined links, and every money cell is dual — the display currency (USD) over the local currency. A legend explains that the minimum depends on the household and area cost basis, and an estimates-only disclaimer closes the screen.</desc>

  <rect x="0" y="0" width="768" height="700" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="767" height="699" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="768" height="46" fill="#0173B2"/>
  <text x="18" y="30" font-size="17" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Minimum role</text>
  <rect x="556" y="13" width="196" height="20" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="570" y="27" font-size="11" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- Tabs + caption -->
  <g font-size="13">
    <rect x="18" y="58" width="118" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="77" y="78" text-anchor="middle" fill="#808080">Cost of living</text>
    <rect x="142" y="58" width="86" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="185" y="78" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="234" y="58" width="124" height="30" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="296" y="78" text-anchor="middle" font-weight="700" fill="#FFFFFF">Minimum role</text>
  </g>
  <rect x="374" y="58" width="376" height="30" rx="15" fill="#CC78BC"/>
  <text x="562" y="78" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Roles: software-engineering (IC + management)</text>

  <!-- ===== 2-column controls grid ===== -->
  <!-- Left col: Baseline -->
  <rect x="18" y="100" width="364" height="58" rx="8" fill="#F6F8FA" stroke="#0173B2" stroke-width="1.5"/>
  <text x="30" y="118" font-size="12" font-weight="700" fill="#000000">Baseline</text>
  <g font-size="11">
    <circle cx="36" cy="138" r="6" fill="#FFFFFF" stroke="#808080" stroke-width="1.5"/>
    <text x="48" y="142" fill="#808080">My salary</text>
    <circle cx="132" cy="138" r="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <circle cx="132" cy="138" r="2.5" fill="#FFFFFF"/>
    <text x="144" y="142" fill="#000000" font-weight="600">Reference role</text>
    <circle cx="262" cy="138" r="6" fill="#FFFFFF" stroke="#808080" stroke-width="1.5"/>
    <text x="274" y="142" fill="#808080">Savings target</text>
  </g>
  <rect x="30" y="148" width="160" height="0" fill="none" stroke="none"/>

  <!-- Right col: Display currency -->
  <rect x="390" y="100" width="360" height="58" rx="8" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="402" y="118" font-size="12" font-weight="700" fill="#000000">Display currency</text>
  <rect x="402" y="126" width="150" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="412" y="141" font-size="11" fill="#000000">USD ($)</text><text x="538" y="141" font-size="11" fill="#808080">▼</text>
  <text x="402" y="155" font-size="10" fill="#808080">default · line 1 of every money cell</text>

  <!-- Left col row 2: Scope filters -->
  <rect x="18" y="166" width="364" height="58" rx="8" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <g font-size="11">
    <text x="30" y="184" font-weight="700" fill="#000000">Scope</text>
    <text x="30" y="206" font-weight="600" fill="#000000">Region</text>
    <rect x="80" y="194" width="72" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="86" y="208" fill="#000000">All</text><text x="138" y="208" fill="#808080">▼</text>
    <text x="162" y="206" font-weight="600" fill="#000000">Country</text>
    <rect x="214" y="194" width="72" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="220" y="208" fill="#000000">All</text><text x="272" y="208" fill="#808080">▼</text>
    <text x="296" y="206" font-weight="600" fill="#000000">City</text>
    <rect x="324" y="194" width="52" height="20" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="330" y="208" fill="#000000">All</text><text x="362" y="208" fill="#808080">▼</text>
  </g>

  <!-- Right col row 2: Cost basis -->
  <rect x="390" y="166" width="360" height="58" rx="8" fill="#FFF8EC" stroke="#DE8F05" stroke-width="1.5"/>
  <g font-size="10.5">
    <text x="402" y="183" font-weight="700" fill="#DE8F05">Cost basis</text>
    <rect x="470" y="172" width="78" height="18" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="476" y="185" fill="#000000">Adults: 2</text>
    <rect x="554" y="172" width="98" height="18" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="560" y="185" fill="#000000">Pre-school: 1</text>
    <rect x="658" y="172" width="80" height="18" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="664" y="185" fill="#000000">School: 1</text>

    <text x="402" y="212" font-weight="600" fill="#000000">Area</text>
    <rect x="436" y="201" width="48" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="460" y="214" text-anchor="middle" fill="#808080">Center</text>
    <rect x="488" y="201" width="44" height="18" rx="9" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="510" y="214" text-anchor="middle" fill="#FFFFFF">Rural</text>
    <text x="540" y="212" font-weight="600" fill="#000000">School</text>
    <rect x="586" y="201" width="48" height="18" rx="9" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="610" y="214" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="638" y="201" width="50" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="663" y="214" text-anchor="middle" fill="#808080">Private</text>
  </g>

  <!-- Threshold note -->
  <text x="18" y="244" font-size="12" font-weight="600" fill="#000000">Baseline threshold: essential savings ≥ <tspan fill="#0173B2">$1,930 / mo</tspan> at the active household + area + school basis. Tap a row for p25/p75 · non-salary · total comp.</text>

  <!-- ===== Condensed ladder table ===== -->
  <!-- Table header -->
  <rect x="18" y="254" width="732" height="36" fill="#0173B2"/>
  <g font-size="11" fill="#FFFFFF" font-weight="700">
    <text x="44" y="276">Role</text>
    <text x="156" y="276" text-decoration="underline">Best city (Country)</text>
    <text x="396" y="270">Median</text><text x="396" y="285" font-size="9">(USD / local)</text>
    <text x="540" y="270">Essential savings</text><text x="540" y="285" font-size="9">(USD / local)</text>
    <text x="690" y="276">Status</text>
  </g>

  <!-- Group label -->
  <rect x="18" y="290" width="732" height="20" fill="#E7F2EA"/>
  <text x="30" y="304" font-size="10" font-weight="700" fill="#029E73">QUALIFYING ROLES (ranked high → low to the minimum)</text>

  <!-- Row 1: Director -->
  <rect x="18" y="310" width="732" height="42" fill="#FFFFFF"/>
  <text x="30" y="330" font-size="12" fill="#808080">›</text>
  <text x="44" y="330" font-size="12" font-weight="600" fill="#000000">Director</text>
  <text x="156" y="328" font-size="11" fill="#0173B2" text-decoration="underline" font-weight="600">Kuala Lumpur</text>
  <text x="156" y="343" font-size="10" fill="#0173B2" text-decoration="underline">Malaysia</text>
  <text x="396" y="328" font-size="11" fill="#000000" font-weight="700">$11.0k</text><text x="396" y="343" font-size="9.5" fill="#808080">RM 55.6k</text>
  <text x="540" y="328" font-size="11" fill="#029E73" font-weight="700">$4,510</text><text x="540" y="343" font-size="9.5" fill="#808080">RM 22.8k</text>
  <rect x="668" y="322" width="46" height="18" rx="9" fill="#029E73"/>
  <text x="691" y="335" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ OK</text>
  <line x1="18" y1="352" x2="750" y2="352" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 2: Staff SWE -->
  <rect x="18" y="352" width="732" height="42" fill="#F6F8FA"/>
  <text x="30" y="372" font-size="12" fill="#808080">›</text>
  <text x="44" y="372" font-size="12" font-weight="600" fill="#000000">Staff SWE</text>
  <text x="156" y="370" font-size="11" fill="#0173B2" text-decoration="underline" font-weight="600">Manila</text>
  <text x="156" y="385" font-size="10" fill="#0173B2" text-decoration="underline">Philippines</text>
  <text x="396" y="370" font-size="11" fill="#000000" font-weight="700">$7.3k</text><text x="396" y="385" font-size="9.5" fill="#808080">₱461k</text>
  <text x="540" y="370" font-size="11" fill="#029E73" font-weight="700">$3,230</text><text x="540" y="385" font-size="9.5" fill="#808080">₱204k</text>
  <rect x="668" y="364" width="46" height="18" rx="9" fill="#029E73"/>
  <text x="691" y="377" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ OK</text>
  <line x1="18" y1="394" x2="750" y2="394" stroke="#E5E5E5" stroke-width="1"/>

  <!-- MIN Row: Sr SWE -->
  <rect x="18" y="394" width="732" height="48" fill="#FFF4E0"/>
  <rect x="18" y="394" width="6" height="48" fill="#DE8F05"/>
  <text x="32" y="416" font-size="12" fill="#DE8F05" font-weight="700">▶</text>
  <text x="46" y="416" font-size="12" font-weight="700" fill="#000000">Sr SWE</text>
  <text x="156" y="414" font-size="11" fill="#0173B2" text-decoration="underline" font-weight="700">Jakarta</text>
  <text x="156" y="429" font-size="10" fill="#0173B2" text-decoration="underline" font-weight="700">Indonesia</text>
  <text x="396" y="414" font-size="11" fill="#000000" font-weight="700">$5.5k</text><text x="396" y="429" font-size="9.5" fill="#808080">Rp 95.2M</text>
  <text x="540" y="414" font-size="11" fill="#DE8F05" font-weight="700">$1,930</text><text x="540" y="429" font-size="9.5" fill="#808080">Rp 33.4M</text>
  <rect x="658" y="408" width="64" height="20" rx="10" fill="#DE8F05"/>
  <text x="690" y="422" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">✓ MIN</text>

  <!-- Divider -->
  <rect x="18" y="442" width="732" height="22" fill="#EFEFEF"/>
  <line x1="18" y1="453" x2="750" y2="453" stroke="#808080" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="294" y="444" width="180" height="18" rx="9" fill="#808080"/>
  <text x="384" y="457" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="700">— BELOW MINIMUM —</text>

  <!-- Below Row 1: SWE II (dimmed) -->
  <rect x="18" y="464" width="732" height="40" fill="#FFFFFF"/>
  <g opacity="0.45">
    <text x="30" y="488" font-size="12" fill="#808080">›</text>
    <text x="44" y="488" font-size="12" fill="#000000">SWE II</text>
    <text x="156" y="482" font-size="11" fill="#0173B2" text-decoration="underline">Jakarta</text>
    <text x="156" y="497" font-size="10" fill="#0173B2" text-decoration="underline">Indonesia</text>
    <text x="396" y="482" font-size="11" fill="#000000">$4.1k</text><text x="396" y="497" font-size="9.5" fill="#808080">Rp 71.0M</text>
    <text x="540" y="482" font-size="11" fill="#000000">$1,470</text><text x="540" y="497" font-size="9.5" fill="#808080">Rp 25.4M</text>
    <rect x="666" y="475" width="50" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="691" y="488" font-size="9.5" fill="#808080" text-anchor="middle">below</text>
  </g>
  <line x1="18" y1="504" x2="750" y2="504" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Below Row 2: SWE I (dimmed) -->
  <rect x="18" y="504" width="732" height="40" fill="#F6F8FA"/>
  <g opacity="0.45">
    <text x="30" y="528" font-size="12" fill="#808080">›</text>
    <text x="44" y="528" font-size="12" fill="#000000">SWE I</text>
    <text x="156" y="522" font-size="11" fill="#0173B2" text-decoration="underline">Jakarta</text>
    <text x="156" y="537" font-size="10" fill="#0173B2" text-decoration="underline">Indonesia</text>
    <text x="396" y="522" font-size="11" fill="#000000">$3.2k</text><text x="396" y="537" font-size="9.5" fill="#808080">Rp 55.4M</text>
    <text x="540" y="522" font-size="11" fill="#000000">$980</text><text x="540" y="537" font-size="9.5" fill="#808080">Rp 17.0M</text>
    <rect x="666" y="515" width="50" height="18" rx="9" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="691" y="528" font-size="9.5" fill="#808080" text-anchor="middle">below</text>
  </g>

  <rect x="18" y="310" width="732" height="234" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- legend -->
  <rect x="18" y="554" width="732" height="40" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <text x="28" y="571" font-size="11" fill="#000000"><tspan font-weight="700">Every money cell shows display currency (USD) over local currency.</tspan> Tap a row to reveal p25/p75, non-salary comp, and total comp.</text>
  <text x="28" y="588" font-size="11" fill="#000000"><tspan fill="#0173B2" text-decoration="underline">Best city</tspan> &amp; <tspan fill="#0173B2" text-decoration="underline">Country</tspan> are links → Cost-of-living filtered. The minimum depends on the household/area cost basis above.</text>

  <!-- Disclaimer -->
  <line x1="18" y1="602" x2="750" y2="602" stroke="#808080" stroke-width="1"/>
  <g font-size="10.5" fill="#808080">
    <text x="18" y="620"><tspan font-weight="700" fill="#DE8F05">Estimates only.</tspan> Salary bands (p25 / median / p75) are modeled per role × country, not offers. The MIN is the lowest-ranked role still clearing the baseline threshold.</text>
    <text x="18" y="636">Display-currency and local figures use nominal FX (not PPP); savings are computed before pension contributions. Snapshot date 2026-06.</text>
    <text x="18" y="652">Essential savings uses the active household / area / school cost basis — changing the household composition can change which role is the minimum.</text>
    <text x="18" y="668">Dimmed rows below the divider do not meet the baseline savings threshold and are shown for near-miss context only.</text>
  </g>
</svg>
