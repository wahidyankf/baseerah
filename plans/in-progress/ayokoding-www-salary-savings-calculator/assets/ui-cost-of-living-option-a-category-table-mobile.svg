<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Cost-of-living screen, Option A (Category Table) — mobile reflow</title>
  <desc>High-fidelity mobile mockup (390px phone width) of the Cost of Living Calculator Cost-of-living tab. A compact blue header bar shows the title and an estimates-only snapshot pill. Three tab pills follow with Cost of living active. The Region, Country, and City cascading filters stack full-width, then the household, area, and school-type controls stack below. Each city renders as a stacked card headed by an underlined City and Country link pair (Jakarta, Indonesia) with one labeled row per expense category: Housing, Food, Transport, Utilities, Healthcare (OOP) with a tax-funded funding-scheme badge, Childcare, School, and Lifestyle. Each money value shows local currency over USD. The card ends with an Essentials subtotal, a Monthly total, and a Relocation line combining sunk cost and liquidity reserve. A legend explains OOP means out-of-pocket and that Country and City are links. The top edge of a second city card (Singapore) peeks at the bottom to imply vertical scroll, followed by an estimates-only disclaimer.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="390" height="900" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="389" height="899" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- ===== Compact header bar ===== -->
  <rect x="0" y="0" width="390" height="44" fill="#0173B2"/>
  <text x="14" y="22" font-size="14" font-weight="700" fill="#FFFFFF">Cost of Living Calculator</text>
  <text x="14" y="37" font-size="11" fill="#FFFFFF">Cost of living</text>
  <rect x="232" y="11" width="146" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="244" y="26" font-size="10" fill="#000000">2026-06 · estimates only</text>

  <!-- ===== Tab pills ===== -->
  <g font-size="12">
    <rect x="14" y="56" width="120" height="30" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="74" y="76" text-anchor="middle" font-weight="700" fill="#FFFFFF">Cost of living</text>
    <rect x="140" y="56" width="86" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="183" y="76" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="232" y="56" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="287" y="76" text-anchor="middle" fill="#808080">Min. role</text>
  </g>

  <!-- ===== Stacked full-width filters ===== -->
  <g font-size="12">
    <text x="14" y="106" font-weight="600" fill="#000000">Region</text>
    <rect x="14" y="112" width="362" height="28" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="24" y="130" fill="#000000">All regions</text>
    <text x="360" y="130" fill="#808080">▼</text>

    <text x="14" y="160" font-weight="600" fill="#000000">Country</text>
    <rect x="14" y="166" width="362" height="28" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="24" y="184" fill="#000000">All countries</text>
    <text x="360" y="184" fill="#808080">▼</text>

    <text x="14" y="214" font-weight="600" fill="#000000">City</text>
    <rect x="14" y="220" width="362" height="28" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="24" y="238" fill="#000000">All cities</text>
    <text x="360" y="238" fill="#808080">▼</text>
    <text x="14" y="262" font-size="10" fill="#808080">Region narrows Country narrows City</text>
  </g>

  <!-- ===== Stacked controls ===== -->
  <g font-size="11">
    <text x="14" y="284" font-weight="600" fill="#000000">Household</text>
    <rect x="14" y="290" width="116" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="22" y="306" fill="#000000">Adults: 2</text>
    <rect x="136" y="290" width="118" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="144" y="306" fill="#000000">Pre-school: 1</text>
    <rect x="260" y="290" width="116" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="268" y="306" fill="#000000">School-age: 1</text>

    <text x="14" y="334" font-weight="600" fill="#000000">Area</text>
    <rect x="56" y="320" width="58" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="85" y="336" text-anchor="middle" fill="#808080">Center</text>
    <rect x="120" y="320" width="52" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="146" y="336" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="196" y="334" font-weight="600" fill="#000000">School</text>
    <rect x="244" y="320" width="58" height="24" rx="12" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="273" y="336" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="308" y="320" width="60" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="338" y="336" text-anchor="middle" fill="#808080">Private</text>
  </g>

  <line x1="14" y1="356" x2="376" y2="356" stroke="#808080" stroke-width="1"/>

  <!-- ===== City card 1: Jakarta, Indonesia ===== -->
  <rect x="14" y="366" width="362" height="372" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <!-- card header -->
  <rect x="14" y="366" width="362" height="34" rx="8" fill="#0173B2"/>
  <text x="26" y="388" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">Jakarta</text>
  <text x="86" y="388" font-size="14" fill="#FFFFFF">, </text>
  <text x="96" y="388" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">Indonesia</text>
  <text x="364" y="388" font-size="11" fill="#FFFFFF" text-anchor="end">view detail →</text>

  <!-- category rows: label left, local over USD right -->
  <g font-size="12" fill="#000000">
    <text x="26" y="424">Housing</text>
    <text x="364" y="420" text-anchor="end">Rp 9.4M</text><text x="364" y="433" text-anchor="end" font-size="10" fill="#808080">$600</text>
    <line x1="26" y1="440" x2="364" y2="440" stroke="#E5E5E5" stroke-width="1"/>

    <text x="26" y="460">Food</text>
    <text x="364" y="456" text-anchor="end">Rp 3.9M</text><text x="364" y="469" text-anchor="end" font-size="10" fill="#808080">$250</text>
    <line x1="26" y1="476" x2="364" y2="476" stroke="#E5E5E5" stroke-width="1"/>

    <text x="26" y="496">Transport</text>
    <text x="364" y="492" text-anchor="end">Rp 0.5M</text><text x="364" y="505" text-anchor="end" font-size="10" fill="#808080">$30</text>
    <line x1="26" y1="512" x2="364" y2="512" stroke="#E5E5E5" stroke-width="1"/>

    <text x="26" y="532">Utilities</text>
    <text x="364" y="528" text-anchor="end">Rp 1.9M</text><text x="364" y="541" text-anchor="end" font-size="10" fill="#808080">$120</text>
    <line x1="26" y1="548" x2="364" y2="548" stroke="#E5E5E5" stroke-width="1"/>

    <text x="26" y="566">Healthcare (OOP)</text>
    <rect x="26" y="572" width="78" height="16" rx="8" fill="#029E73"/>
    <text x="65" y="583.5" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
    <text x="364" y="570" text-anchor="end">Rp 0.6M</text><text x="364" y="583" text-anchor="end" font-size="10" fill="#808080">$40</text>
    <line x1="26" y1="596" x2="364" y2="596" stroke="#E5E5E5" stroke-width="1"/>

    <text x="26" y="616">Childcare</text>
    <text x="364" y="612" text-anchor="end">Rp 2.8M</text><text x="364" y="625" text-anchor="end" font-size="10" fill="#808080">$180</text>
    <line x1="26" y1="632" x2="364" y2="632" stroke="#E5E5E5" stroke-width="1"/>

    <text x="26" y="652">School</text>
    <text x="364" y="648" text-anchor="end">—</text>
    <line x1="26" y1="664" x2="364" y2="664" stroke="#E5E5E5" stroke-width="1"/>

    <text x="26" y="684">Lifestyle</text>
    <text x="364" y="680" text-anchor="end">Rp 2.8M</text><text x="364" y="693" text-anchor="end" font-size="10" fill="#808080">$180</text>
  </g>

  <!-- subtotal / total / relocation strip -->
  <rect x="14" y="700" width="362" height="38" rx="0" fill="#F6F8FA"/>
  <g font-size="12">
    <text x="26" y="715" fill="#000000" font-weight="700">Essentials</text>
    <text x="364" y="715" text-anchor="end" fill="#000000" font-weight="700">Rp 22M · $1,400</text>
    <text x="26" y="731" fill="#000000" font-weight="700">Monthly total</text>
    <text x="364" y="731" text-anchor="end" fill="#000000" font-weight="700">Rp 24.8M · $1,580</text>
  </g>
  <text x="26" y="755" font-size="11" fill="#808080">Relocation (sunk Rp 64M / $4,100 · reserve Rp 75M / $4,800)</text>

  <!-- ===== City card 2: Singapore (top edge only — implies scroll) ===== -->
  <rect x="14" y="772" width="362" height="34" rx="8" fill="#F6F8FA" stroke="#000000" stroke-width="1.5"/>
  <rect x="14" y="772" width="362" height="34" rx="8" fill="#0173B2"/>
  <text x="26" y="794" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">Singapore</text>
  <text x="98" y="794" font-size="14" fill="#FFFFFF">, </text>
  <text x="108" y="794" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">Singapore</text>
  <text x="364" y="794" font-size="11" fill="#FFFFFF" text-anchor="end">view detail →</text>

  <!-- ===== Legend + disclaimer ===== -->
  <g font-size="10">
    <text x="14" y="824" fill="#000000"><tspan font-weight="700">OOP = out-of-pocket</tspan> — healthcare you pay yourself, on</text>
    <text x="14" y="838" fill="#000000">top of tax-funded or insurance cover.</text>
    <text x="14" y="852" fill="#000000">Money cells: <tspan font-weight="700">local</tspan> over <tspan fill="#808080">USD</tspan>. <tspan fill="#0173B2" text-decoration="underline">Country</tspan> &amp; <tspan fill="#0173B2" text-decoration="underline">City</tspan> are links.</text>
    <text x="14" y="872" fill="#DE8F05" font-weight="700">Estimates only<tspan fill="#808080" font-weight="400"> — modeled monthly figures,</tspan></text>
    <text x="14" y="886" fill="#808080">not quotes; FX nominal.</text>
  </g>
</svg>
