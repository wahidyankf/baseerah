<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Minimum-role screen, Option B (Banner + List) high-fidelity finalist</title>
  <desc>High-fidelity mockup of the Salary Savings Calculator Minimum-role tab using the Banner + List layout (runner-up finalist). A prominent answer banner up top states the minimum role and city plainly. Below the banner a ranked qualifying list shows the qualifying role-city combinations sorted by essential savings, then the below-minimum rungs. A three-tab toggle shows Minimum role active. Baseline selector, display-currency selector, Region/Country/City scope filters, and shared cost-basis controls sit above the banner. Both city names and country names are underlined links.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="1180" height="780" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1179" height="779" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- ===== Header bar ===== -->
  <rect x="0" y="0" width="1180" height="48" fill="#0173B2"/>
  <text x="20" y="31" font-size="19" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Minimum role</text>
  <!-- roles caption badge -->
  <rect x="640" y="13" width="270" height="22" rx="11" fill="#DE8F05" stroke="#000000" stroke-width="1"/>
  <text x="775" y="28" font-size="12" text-anchor="middle" fill="#FFFFFF">Roles: software-engineering (IC + mgmt)</text>
  <!-- snapshot date pill -->
  <rect x="930" y="13" width="232" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="946" y="28" font-size="12" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- ===== Tab toggle ===== -->
  <g font-size="14">
    <rect x="20" y="62" width="150" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="95" y="84" text-anchor="middle" fill="#808080">Cost of living</text>
    <rect x="174" y="62" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="229" y="84" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="288" y="62" width="130" height="34" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="353" y="84" text-anchor="middle" font-weight="700" fill="#FFFFFF">Minimum role</text>
  </g>

  <!-- ===== Baseline and display selectors row ===== -->
  <g font-size="13">
    <text x="20" y="118" font-weight="600" fill="#000000">Baseline</text>
    <rect x="86" y="105" width="110" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="141" y="121" text-anchor="middle" fill="#808080">My salary</text>
    <rect x="202" y="105" width="124" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="264" y="121" text-anchor="middle" fill="#FFFFFF">Reference role</text>
    <rect x="332" y="105" width="124" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="394" y="121" text-anchor="middle" fill="#808080">Savings target</text>

    <text x="480" y="118" font-weight="600" fill="#000000">Reference</text>
    <rect x="548" y="105" width="200" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="558" y="121" fill="#000000">Jakarta · Senior SWE</text>
    <text x="736" y="121" fill="#808080">▼</text>

    <text x="780" y="118" font-weight="600" fill="#000000">Show in</text>
    <rect x="836" y="105" width="80" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="846" y="121" fill="#000000">USD</text>
    <text x="904" y="121" fill="#808080">▼</text>
    <text x="940" y="118" font-size="12" fill="#808080">bar = $2,100/mo</text>
  </g>

  <!-- ===== Cascading filter row ===== -->
  <g font-size="13">
    <text x="20" y="150" font-weight="600" fill="#000000">Region</text>
    <rect x="78" y="137" width="130" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="154" fill="#000000">All regions</text>
    <text x="196" y="154" fill="#808080">▼</text>

    <text x="218" y="150" font-weight="600" fill="#000000">Country</text>
    <rect x="278" y="137" width="130" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="288" y="154" fill="#000000">All countries</text>
    <text x="396" y="154" fill="#808080">▼</text>

    <text x="416" y="150" font-weight="600" fill="#000000">City</text>
    <rect x="446" y="137" width="120" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="456" y="154" fill="#000000">All cities</text>
    <text x="554" y="154" fill="#808080">▼</text>
  </g>

  <!-- ===== Shared controls row ===== -->
  <g font-size="13">
    <text x="20" y="186" font-weight="600" fill="#000000">Household</text>
    <rect x="98" y="173" width="90" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="106" y="189" fill="#000000">Adults: 2</text>
    <rect x="194" y="173" width="142" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="202" y="189" fill="#000000">Pre-school kids: 1</text>
    <rect x="342" y="173" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="350" y="189" fill="#000000">School-age kids: 1</text>

    <text x="510" y="186" font-weight="600" fill="#000000">Area</text>
    <rect x="548" y="173" width="62" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="579" y="189" text-anchor="middle" fill="#808080">Center</text>
    <rect x="614" y="173" width="56" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="642" y="189" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="686" y="186" font-weight="600" fill="#000000">School</text>
    <rect x="736" y="173" width="62" height="24" rx="12" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="767" y="189" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="802" y="173" width="64" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="834" y="189" text-anchor="middle" fill="#808080">Private</text>
  </g>

  <line x1="20" y1="207" x2="1160" y2="207" stroke="#808080" stroke-width="1"/>

  <!-- ===== Big answer banner ===== -->
  <rect x="20" y="217" width="1140" height="100" rx="8" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
  <text x="590" y="248" font-size="14" text-anchor="middle" fill="#FFFFFF" font-weight="600">Minimum role to match $2,100/mo essential savings:</text>
  <!-- MIN badge -->
  <rect x="186" y="262" width="50" height="24" rx="4" fill="#FFFFFF"/>
  <text x="211" y="279" font-size="13" font-weight="700" fill="#0173B2" text-anchor="middle">MIN</text>
  <text x="246" y="279" font-size="18" font-weight="700" fill="#FFFFFF">Senior SWE</text>
  <text x="484" y="279" font-size="16" fill="#FFFFFF">in</text>
  <text x="506" y="279" font-size="18" fill="#FFFFFF" text-decoration="underline">Jakarta</text>
  <text x="601" y="279" font-size="16" fill="#FFFFFF">,</text>
  <text x="612" y="279" font-size="16" fill="#FFFFFF" text-decoration="underline">Indonesia</text>
  <text x="186" y="305" font-size="13" fill="#FFFFFF">Median salary: $5,500/mo · Essential savings: $2,310/mo · p25/med/p75: $3,700 / $5,500 / $7,300</text>

  <!-- ===== Qualifies section ===== -->
  <text x="20" y="345" font-size="14" font-weight="700" fill="#029E73">Qualifies (ranked by essential savings)</text>

  <!-- qualifying list header -->
  <rect x="20" y="353" width="1140" height="30" fill="#029E73"/>
  <g font-size="12" fill="#FFFFFF" font-weight="700">
    <text x="30" y="373">Role</text>
    <text x="220" y="373">Country</text>
    <text x="330" y="373">Best city</text>
    <text x="490" y="373">p25 / Median / p75</text>
    <text x="700" y="373">Non-salary (info)</text>
    <text x="870" y="373">Total comp (info)</text>
    <text x="1040" y="373">E.Save ✓</text>
  </g>

  <!-- qualifying rows -->
  <!-- row 1: Staff SWE -->
  <rect x="20" y="383" width="1140" height="36" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
  <g font-size="13" fill="#000000">
    <text x="30" y="406">Staff SWE</text>
    <text x="220" y="406" text-decoration="underline">Philippines</text>
    <text x="330" y="406" text-decoration="underline">Manila</text>
    <text x="490" y="406">$5.5k / $7.3k / $10k</text>
    <text x="700" y="406" fill="#808080">+$1.5k</text>
    <text x="870" y="406" fill="#808080">$8.8k</text>
    <text x="1040" y="406" fill="#029E73" font-weight="700">$3,230 ✓</text>
  </g>

  <!-- row 2: Eng. Manager -->
  <rect x="20" y="419" width="1140" height="36" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="0.5"/>
  <g font-size="13" fill="#000000">
    <text x="30" y="442">Eng. Manager</text>
    <text x="220" y="442" text-decoration="underline">Thailand</text>
    <text x="330" y="442" text-decoration="underline">Bangkok</text>
    <text x="490" y="442">$5.8k / $8k / $11k</text>
    <text x="700" y="442" fill="#808080">+$2k</text>
    <text x="870" y="442" fill="#808080">$10k</text>
    <text x="1040" y="442" fill="#029E73" font-weight="700">$2,640 ✓</text>
  </g>

  <!-- row 3: Senior SWE — MIN row highlighted -->
  <rect x="20" y="455" width="1140" height="40" fill="#E8F4FD" stroke="#0173B2" stroke-width="1.5"/>
  <!-- MIN badge in row -->
  <rect x="30" y="462" width="42" height="20" rx="4" fill="#0173B2"/>
  <text x="51" y="476" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">MIN</text>
  <g font-size="13" fill="#000000" font-weight="700">
    <text x="80" y="480">Sr SWE</text>
    <text x="220" y="480" text-decoration="underline">Indonesia</text>
    <text x="330" y="480" text-decoration="underline">Jakarta</text>
    <text x="490" y="480">$3.7k / $5.5k / $7.3k</text>
    <text x="700" y="480" fill="#808080">+$0.9k</text>
    <text x="870" y="480" fill="#808080">$6.4k</text>
    <text x="1040" y="480" fill="#0173B2">$2,310 ✓</text>
  </g>

  <!-- ===== Below minimum section ===== -->
  <text x="20" y="520" font-size="13" font-weight="700" fill="#808080">Below minimum (cannot clear the bar anywhere in the filtered set)</text>

  <!-- below-minimum header -->
  <rect x="20" y="527" width="1140" height="28" fill="#808080"/>
  <g font-size="12" fill="#FFFFFF" font-weight="700">
    <text x="30" y="546">Role</text>
    <text x="220" y="546">Country</text>
    <text x="330" y="546">Best city</text>
    <text x="490" y="546">p25 / Median / p75</text>
    <text x="700" y="546">Non-salary (info)</text>
    <text x="1040" y="546">E.Save</text>
  </g>

  <!-- below-minimum row 1: SWE II -->
  <rect x="20" y="555" width="1140" height="34" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="0.5"/>
  <g font-size="13" fill="#808080">
    <text x="30" y="577">░ SWE II</text>
    <text x="220" y="577" text-decoration="underline">Indonesia</text>
    <text x="330" y="577" text-decoration="underline">Jakarta</text>
    <text x="490" y="577">$2.8k / $4.1k / $5.4k</text>
    <text x="700" y="577">+$0.5k</text>
    <text x="1040" y="577">$1,780</text>
  </g>

  <!-- below-minimum row 2: SWE I -->
  <rect x="20" y="589" width="1140" height="34" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="0.5"/>
  <g font-size="13" fill="#808080">
    <text x="30" y="611">░ SWE I</text>
    <text x="220" y="611" text-decoration="underline">Vietnam</text>
    <text x="330" y="611" text-decoration="underline">Hanoi</text>
    <text x="490" y="611">$2.2k / $3.2k / $4.2k</text>
    <text x="700" y="611">+$0.3k</text>
    <text x="1040" y="611">$1,150</text>
  </g>

  <!-- ===== Legend / disclaimer ===== -->
  <rect x="20" y="638" width="1140" height="36" rx="4" fill="#F5F5F5" stroke="#808080" stroke-width="0.5"/>
  <text x="30" y="653" font-size="12" fill="#000000">Minimum depends on the household/area cost basis above. Non-salary comp is informational only, not in savings math.</text>
  <text x="30" y="668" font-size="12" fill="#000000">OOP = out-of-pocket. All money shown in USD and local currency. Figures are estimates, not financial advice.</text>

  <!-- ===== Why dropped note ===== -->
  <rect x="20" y="688" width="1140" height="40" rx="4" fill="#FFFFFF" stroke="#808080" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="30" y="706" font-size="12" fill="#808080" font-style="italic">Runner-up finalist (dropped at narrow stage): the banner gives the plain answer directly but hides near-miss context — how close SWE I or SWE II</text>
  <text x="30" y="721" font-size="12" fill="#808080" font-style="italic">came to qualifying. Selected: Option A — Ladder Table (shows the full qualifying/non-qualifying ranked ladder with p25/median/p75 per role).</text>

  <!-- ===== Footer disclaimer ===== -->
  <text x="20" y="760" font-size="11" fill="#808080">All figures are estimates. Sourced from public data; updated periodically. Not financial advice.</text>
</svg>
