<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="High-fidelity mockup of the Salary Savings Calculator minimum-role screen, banner-and-list layout">
  <rect width="680" height="560" fill="#f1f5f9"/>
  <!-- card -->
  <rect x="24" y="24" width="632" height="512" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header -->
  <text x="48" y="62" font-size="22" font-weight="700" fill="#0f172a">Minimum Engineering Role</text>
  <text x="48" y="86" font-size="13.5" fill="#64748b">The plain answer, then the other ways to clear the bar.</text>

  <!-- tab toggle -->
  <rect x="48" y="102" width="120" height="34" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="108" y="124" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Compare All</text>
  <rect x="174" y="102" width="120" height="34" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="234" y="124" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Single City</text>
  <rect x="300" y="102" width="128" height="34" rx="9" fill="#0f766e"/>
  <text x="364" y="124" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Minimum Role</text>

  <!-- baseline + currency line -->
  <text x="48" y="166" font-size="13" fill="#475569">Baseline savings bar</text>
  <rect x="184" y="150" width="150" height="30" rx="7" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
  <text x="198" y="170" font-size="13" font-weight="700" fill="#0f766e">$2,100 / mo</text>
  <text x="356" y="166" font-size="13" fill="#475569">Show in</text>
  <rect x="416" y="150" width="84" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="428" y="170" font-size="13" fill="#0f172a">USD</text>
  <path d="M482 161 l5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="1.4"/>

  <!-- answer banner -->
  <rect x="48" y="200" width="584" height="92" rx="12" fill="#0f766e"/>
  <text x="72" y="234" font-size="13.5" fill="#bbf7e9">Minimum role to match $2,100 / mo</text>
  <text x="72" y="266" font-size="24" font-weight="700" fill="#ffffff">Senior SWE  in  Jakarta</text>
  <text x="430" y="266" font-size="16" font-weight="600" fill="#ecfdf5">saves $2,310 / mo</text>
  <text x="430" y="285" font-size="12" fill="#bbf7e9">Rp36.9m local</text>

  <!-- list heading -->
  <text x="48" y="328" font-size="12.5" font-weight="700" fill="#64748b" letter-spacing="0.3">OTHER WAYS TO CLEAR THE BAR — RANKED BY SAVINGS</text>

  <!-- list rows -->
  <circle cx="56" cy="354" r="3" fill="#0f766e"/>
  <text x="72" y="359" font-size="14" fill="#0f172a">Staff SWE</text>
  <text x="260" y="359" font-size="14" fill="#334155">Manila</text>
  <text x="470" y="359" font-size="14" font-weight="600" fill="#0f766e">$3,520 / mo</text>

  <circle cx="56" cy="386" r="3" fill="#0f766e"/>
  <text x="72" y="391" font-size="14" fill="#0f172a">Eng. Manager</text>
  <text x="260" y="391" font-size="14" fill="#334155">Bangkok</text>
  <text x="470" y="391" font-size="14" font-weight="600" fill="#0f766e">$2,640 / mo</text>

  <!-- highlighted minimum row -->
  <rect x="40" y="404" width="592" height="32" rx="8" fill="#ecfdf5"/>
  <circle cx="56" cy="420" r="3" fill="#0f766e"/>
  <text x="72" y="425" font-size="14" font-weight="700" fill="#0f172a">Senior SWE</text>
  <text x="260" y="425" font-size="14" font-weight="600" fill="#0f172a">Jakarta</text>
  <text x="470" y="425" font-size="14" font-weight="700" fill="#0f766e">$2,310 / mo</text>
  <text x="556" y="425" font-size="11" font-weight="700" fill="#0f766e">minimum</text>

  <circle cx="56" cy="456" r="3" fill="#94a3b8"/>
  <text x="72" y="461" font-size="14" fill="#475569">Senior SWE</text>
  <text x="260" y="461" font-size="14" fill="#64748b">Hanoi</text>
  <text x="470" y="461" font-size="14" font-weight="600" fill="#475569">$2,180 / mo</text>

  <!-- footer -->
  <line x1="48" y1="486" x2="632" y2="486" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="48" y="510" font-size="11.5" fill="#94a3b8">Salary snapshot: 2026-Q1  ·  estimates only  ·  absolute savings normalised to USD</text>
</svg>
