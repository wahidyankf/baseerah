<svg xmlns="http://www.w3.org/2000/svg" width="768" height="660" viewBox="0 0 768 660" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Savings screen, Option A (Net/Savings Table), tablet reflow</title>
  <desc>Tablet reflow of the Cost of Living Calculator Savings tab using the Net/Savings Table layout. A blue header bar reads Cost of Living Calculator — Savings. A three-tab toggle has Savings active. A gross-salary input shows 8,000 dollars per month deriving 96,000 dollars per year. The Region, Country, City filters and the shared cost-basis controls — household (adults, pre-school kids, school-age kids), area (center or rural), school-type (public or private) — are arranged in a 2-column grid. A condensed table ranks three cities (Jakarta, Indonesia; Kuala Lumpur, Malaysia; Berlin, Germany) by essential savings with the most important columns inline: Country, City, Net, Essentials, Essential savings, After-lifestyle savings with percent, and a healthcare scheme badge; a right-hand chevron on each row implies the fuller column set — gross monthly and annual, non-salary comp, total comp, and the federal plus sub-national tax split — reveals on row-tap. Money cells show local currency over USD; both Country and City names are underlined links (a City link opens that city's Cost-of-living detail, a Country link opens the Cost-of-living tab filtered to that country). A legend explains OOP means out-of-pocket, and a disclaimer notes savings are computed before pension contributions and that USD figures use nominal FX, not purchasing-power parity.</desc>

  <rect x="0" y="0" width="768" height="660" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="767" height="659" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="768" height="46" fill="#0173B2"/>
  <text x="18" y="30" font-size="17" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Savings</text>
  <rect x="548" y="12" width="204" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="562" y="27" font-size="11" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- Tabs -->
  <g font-size="13">
    <rect x="18" y="58" width="118" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="77" y="77" text-anchor="middle" fill="#808080">Cost of living</text>
    <rect x="142" y="58" width="86" height="30" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="185" y="77" text-anchor="middle" font-weight="700" fill="#FFFFFF">Savings</text>
    <rect x="234" y="58" width="116" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="292" y="77" text-anchor="middle" fill="#808080">Minimum role</text>
  </g>
  <rect x="540" y="58" width="212" height="30" rx="15" fill="#CC78BC"/>
  <text x="646" y="77" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">Roles: software-engineering (IC + mgmt)</text>

  <!-- Gross salary input -->
  <rect x="18" y="98" width="356" height="54" rx="8" fill="#F6F8FA" stroke="#0173B2" stroke-width="1.5"/>
  <text x="30" y="116" font-size="12" font-weight="700" fill="#000000">Gross salary</text>
  <rect x="30" y="122" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="40" y="139" font-size="13" fill="#000000">$8,000 / mo</text>
  <text x="190" y="139" font-size="13" fill="#808080">=</text>
  <rect x="204" y="122" width="158" height="24" rx="5" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <text x="214" y="139" font-size="13" fill="#000000">$96,000 / yr</text>

  <!-- Controls 2-column grid -->
  <!-- Column 1: filters -->
  <rect x="386" y="98" width="364" height="54" rx="8" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
  <g font-size="12">
    <text x="398" y="118" font-weight="600" fill="#000000">Region</text>
    <rect x="452" y="105" width="106" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="460" y="120" fill="#000000">All regions</text><text x="544" y="120" fill="#808080">▼</text>
    <text x="566" y="118" font-weight="600" fill="#000000">Country</text>
    <rect x="624" y="105" width="116" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="632" y="120" fill="#000000">All countries</text><text x="726" y="120" fill="#808080">▼</text>
    <text x="398" y="143" font-weight="600" fill="#000000">City</text>
    <rect x="452" y="130" width="106" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="460" y="145" fill="#000000">All cities</text><text x="544" y="145" fill="#808080">▼</text>
    <text x="566" y="143" font-weight="600" fill="#000000">Sort</text>
    <rect x="624" y="130" width="116" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="632" y="145" font-size="11" fill="#000000">Ess. savings ▼</text>
  </g>

  <!-- Cost-basis controls row -->
  <rect x="18" y="160" width="732" height="42" rx="8" fill="#FFF8EC" stroke="#DE8F05" stroke-width="1.5"/>
  <g font-size="12">
    <text x="30" y="185" font-weight="700" fill="#DE8F05">Cost basis</text>
    <text x="108" y="185" font-weight="600" fill="#000000">Household</text>
    <rect x="184" y="171" width="80" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="191" y="187" fill="#000000">Adults: 2</text>
    <rect x="270" y="171" width="116" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="277" y="187" fill="#000000">Pre-school kids: 1</text>
    <rect x="392" y="171" width="120" height="22" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="399" y="187" fill="#000000">School-age kids: 1</text>

    <text x="526" y="185" font-weight="600" fill="#000000">Area</text>
    <rect x="562" y="171" width="50" height="22" rx="11" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="587" y="187" text-anchor="middle" fill="#808080">Center</text>
    <rect x="616" y="171" width="46" height="22" rx="11" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="639" y="187" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="672" y="185" font-weight="600" fill="#000000">Sch.</text>
    <rect x="702" y="171" width="44" height="22" rx="11" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="724" y="187" text-anchor="middle" font-size="11" fill="#FFFFFF">Public</text>
  </g>

  <text x="18" y="222" font-size="11" fill="#808080">Condensed ranking — tap a row to reveal gross (mo / yr), non-salary comp, total comp, and the federal + sub-national tax split.</text>

  <!-- Condensed table -->
  <line x1="18" y1="230" x2="750" y2="230" stroke="#808080" stroke-width="1"/>
  <!-- header -->
  <g font-size="11" fill="#FFFFFF" font-weight="700">
    <rect x="18" y="232" width="732" height="26" fill="#0173B2"/>
    <text x="30"  y="249" text-decoration="underline">Country</text>
    <text x="118" y="249" text-decoration="underline">City</text>
    <text x="262" y="249" text-anchor="middle">Net</text>
    <text x="360" y="249" text-anchor="middle">Essentials</text>
    <text x="470" y="249" text-anchor="middle">Essential savings ↓</text>
    <text x="588" y="249" text-anchor="middle">After-life (%)</text>
    <text x="688" y="249" text-anchor="middle">Scheme</text>
  </g>

  <!-- Row 1: Jakarta -->
  <rect x="18" y="258" width="732" height="56" fill="#FFFFFF"/>
  <g font-size="12">
    <text x="30"  y="282" fill="#0173B2" text-decoration="underline" font-weight="600">Indonesia</text>
    <text x="118" y="282" fill="#0173B2" text-decoration="underline" font-weight="600">Jakarta</text>
    <text x="118" y="298" fill="#808080" font-size="10">view detail →</text>
    <text x="262" y="280" fill="#000000" text-anchor="middle">Rp 106.3M</text>
    <text x="262" y="294" fill="#808080" font-size="10" text-anchor="middle">$6,800 / mo</text>
    <text x="360" y="280" fill="#000000" text-anchor="middle">Rp 21.9M</text>
    <text x="360" y="294" fill="#808080" font-size="10" text-anchor="middle">$1,400 / mo</text>
    <text x="470" y="280" fill="#029E73" text-anchor="middle" font-weight="700">Rp 84.4M</text>
    <text x="470" y="294" fill="#029E73" font-size="10" text-anchor="middle" font-weight="600">$5,400 / mo · 79%</text>
    <text x="588" y="280" fill="#000000" text-anchor="middle">$5,400</text>
    <text x="588" y="294" fill="#808080" font-size="10" text-anchor="middle">79%</text>
  </g>
  <rect x="650" y="276" width="76" height="18" rx="9" fill="#029E73"/>
  <text x="688" y="289" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
  <text x="736" y="290" font-size="14" fill="#808080" text-anchor="middle">›</text>
  <line x1="18" y1="314" x2="750" y2="314" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 2: Kuala Lumpur -->
  <rect x="18" y="314" width="732" height="56" fill="#F6F8FA"/>
  <g font-size="12">
    <text x="30"  y="338" fill="#0173B2" text-decoration="underline" font-weight="600">Malaysia</text>
    <text x="118" y="338" fill="#0173B2" text-decoration="underline" font-weight="600">Kuala Lumpur</text>
    <text x="118" y="354" fill="#808080" font-size="10">view detail →</text>
    <text x="262" y="336" fill="#000000" text-anchor="middle">RM 30.6k</text>
    <text x="262" y="350" fill="#808080" font-size="10" text-anchor="middle">$6,500 / mo</text>
    <text x="360" y="336" fill="#000000" text-anchor="middle">RM 7.8k</text>
    <text x="360" y="350" fill="#808080" font-size="10" text-anchor="middle">$1,665 / mo</text>
    <text x="470" y="336" fill="#029E73" text-anchor="middle" font-weight="700">RM 22.8k</text>
    <text x="470" y="350" fill="#029E73" font-size="10" text-anchor="middle" font-weight="600">$4,835 / mo · 74%</text>
    <text x="588" y="336" fill="#000000" text-anchor="middle">$4,835</text>
    <text x="588" y="350" fill="#808080" font-size="10" text-anchor="middle">74%</text>
  </g>
  <rect x="658" y="332" width="60" height="18" rx="9" fill="#DE8F05"/>
  <text x="688" y="345" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">payroll</text>
  <text x="736" y="346" font-size="14" fill="#808080" text-anchor="middle">›</text>
  <line x1="18" y1="370" x2="750" y2="370" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Row 3: Berlin -->
  <rect x="18" y="370" width="732" height="56" fill="#FFFFFF"/>
  <g font-size="12">
    <text x="30"  y="394" fill="#0173B2" text-decoration="underline" font-weight="600">Germany</text>
    <text x="118" y="394" fill="#0173B2" text-decoration="underline" font-weight="600">Berlin</text>
    <text x="118" y="410" fill="#808080" font-size="10">view detail →</text>
    <text x="262" y="392" fill="#000000" text-anchor="middle">€4,810</text>
    <text x="262" y="406" fill="#808080" font-size="10" text-anchor="middle">$5,200 / mo</text>
    <text x="360" y="392" fill="#000000" text-anchor="middle">€2,330</text>
    <text x="360" y="406" fill="#808080" font-size="10" text-anchor="middle">$2,520 / mo</text>
    <text x="470" y="392" fill="#029E73" text-anchor="middle" font-weight="700">€2,480</text>
    <text x="470" y="406" fill="#029E73" font-size="10" text-anchor="middle" font-weight="600">$2,680 / mo · 52%</text>
    <text x="588" y="392" fill="#000000" text-anchor="middle">$2,680</text>
    <text x="588" y="406" fill="#808080" font-size="10" text-anchor="middle">52%</text>
  </g>
  <rect x="650" y="388" width="76" height="18" rx="9" fill="#029E73"/>
  <text x="688" y="401" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">tax-funded</text>
  <text x="736" y="402" font-size="14" fill="#808080" text-anchor="middle">›</text>

  <rect x="18" y="258" width="732" height="168" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- legend -->
  <rect x="18" y="438" width="732" height="44" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
  <g font-size="11">
    <text x="30" y="455" fill="#000000">Money cells: <tspan font-weight="700">local</tspan> over <tspan fill="#808080">USD</tspan>. <tspan fill="#0173B2" text-decoration="underline">Country</tspan> &amp; <tspan fill="#0173B2" text-decoration="underline">City</tspan> are links → Cost-of-living filtered. Chevron (›) expands the full column set. Sorted by <tspan fill="#029E73" font-weight="700">essential savings</tspan>.</text>
    <text x="30" y="474" fill="#000000"><tspan font-weight="700">OOP = out-of-pocket</tspan> — healthcare you pay yourself; the essentials behind these savings model OOP only. The scheme badge shows how care is funded per country.</text>
  </g>

  <!-- Disclaimer -->
  <line x1="18" y1="488" x2="750" y2="488" stroke="#808080" stroke-width="1"/>
  <g font-size="11" fill="#808080">
    <text x="18" y="508" font-weight="700" fill="#DE8F05">Estimates only — read before relying</text>
    <text x="18" y="528">Savings are computed <tspan font-weight="600">before pension / retirement contributions</tspan> — these are deducted separately and are not reflected here.</text>
    <text x="18" y="546">USD figures use <tspan font-weight="600">nominal FX</tspan>, not purchasing-power parity (PPP); a high nominal-USD saving may buy less locally than the local figure implies.</text>
    <text x="18" y="564">Effective tax % combines <tspan font-weight="600">federal + sub-national</tspan> bands. Non-salary comp (RSU/bonus) is shown for total-comp context only and is not added to net or savings.</text>
    <text x="18" y="582">Snapshot date 2026-06. Modeled figures, not quotes or offers.</text>
  </g>
</svg>
