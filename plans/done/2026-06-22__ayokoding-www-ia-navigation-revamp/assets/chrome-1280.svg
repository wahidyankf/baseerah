<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Header + footer navigation — hi-fi detail, desktop (1280px), Option A</title>
  <desc>Header: logo + inline Learn/Tools links + search pill + language + theme. Footer: three nav columns (Learn, Tools, About) plus a legal row. Spacing and tokens match ayokoding-www.</desc>
  <rect width="1280" height="420" fill="#ffffff"/>

  <!-- Header detail -->
  <rect x="0" y="0" width="1280" height="64" fill="#ffffff"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#e5e5e5"/>
  <text x="64" y="40" font-size="19" font-weight="700" fill="#0a0a0a">AyoKoding</text>
  <text x="240" y="40" font-size="15" font-weight="500" fill="#0a0a0a">Learn</text>
  <rect x="236" y="48" width="38" height="2" fill="#2563eb" opacity="0"/>
  <text x="320" y="40" font-size="15" font-weight="500" fill="#0a0a0a">Tools</text>
  <rect x="900" y="18" width="190" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="918" y="39" font-size="13" fill="#737373">Search…</text>
  <rect x="1048" y="24" width="34" height="20" rx="4" fill="#f5f5f5"/>
  <text x="1056" y="38" font-size="11" fill="#737373">⌘K</text>
  <rect x="1104" y="18" width="56" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="1114" y="39" font-size="13" fill="#0a0a0a">EN ▾</text>
  <circle cx="1196" cy="34" r="15" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="1190" y="39" font-size="13">☾</text>
  <text x="64" y="92" font-size="12" fill="#737373" font-style="italic">Sticky, border-b, bg-background/95 backdrop-blur · nav links use foreground; active = primary underline</text>

  <!-- Footer detail -->
  <line x1="0" y1="200" x2="1280" y2="200" stroke="#e5e5e5"/>
  <text x="64" y="246" font-size="14" font-weight="700" fill="#0a0a0a">Learn</text>
  <text x="64" y="274" font-size="13" fill="#737373">Browse all</text>
  <text x="64" y="298" font-size="13" fill="#737373">Software Engineering</text>
  <text x="64" y="322" font-size="13" fill="#737373">Rants</text>

  <text x="380" y="246" font-size="14" font-weight="700" fill="#0a0a0a">Tools</text>
  <text x="380" y="274" font-size="13" fill="#737373">Cost of Living Calculator</text>

  <text x="696" y="246" font-size="14" font-weight="700" fill="#0a0a0a">About</text>
  <text x="696" y="274" font-size="13" fill="#737373">About AyoKoding</text>
  <text x="696" y="298" font-size="13" fill="#737373">Terms &amp; Conditions</text>

  <text x="1012" y="246" font-size="14" font-weight="700" fill="#0a0a0a">Project</text>
  <text x="1012" y="274" font-size="13" fill="#737373">Source on GitHub ↗</text>

  <line x1="64" y1="350" x2="1216" y2="350" stroke="#f5f5f5"/>
  <text x="64" y="382" font-size="12" fill="#737373">© 2026 AyoKoding · FSL-1.1-MIT · Source-Available Project</text>
</svg>
