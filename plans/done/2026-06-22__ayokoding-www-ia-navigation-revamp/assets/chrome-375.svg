<svg xmlns="http://www.w3.org/2000/svg" width="375" height="560" viewBox="0 0 375 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Header + MobileNav drawer + footer — hi-fi detail, mobile (375px), Option A</title>
  <desc>Mobile header collapses inline nav into a hamburger. Tapping it opens the MobileNav drawer mirroring the same Learn/Tools links plus language and theme. Footer columns stack.</desc>
  <rect width="375" height="560" fill="#ffffff"/>

  <!-- Mobile header -->
  <rect x="0" y="0" width="375" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#e5e5e5"/>
  <text x="16" y="35" font-size="20">≡</text>
  <text x="48" y="36" font-size="17" font-weight="700" fill="#0a0a0a">AyoKoding</text>
  <text x="300" y="35" font-size="16">🔍</text>
  <circle cx="348" cy="28" r="14" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="343" y="33" font-size="12">☾</text>

  <!-- MobileNav drawer (open) -->
  <rect x="0" y="56" width="280" height="320" fill="#ffffff"/>
  <line x1="280" y1="56" x2="280" y2="376" stroke="#e5e5e5"/>
  <rect x="280" y="56" width="95" height="320" fill="#0a0a0a" opacity="0.32"/>
  <text x="24" y="98" font-size="13" font-weight="700" fill="#737373" letter-spacing="1">MENU</text>
  <rect x="16" y="116" width="248" height="44" rx="8" fill="#eff4ff"/>
  <text x="32" y="144" font-size="16" font-weight="600" fill="#2563eb">Learn</text>
  <text x="32" y="196" font-size="16" font-weight="500" fill="#0a0a0a">Tools</text>
  <line x1="16" y1="224" x2="264" y2="224" stroke="#f5f5f5"/>
  <text x="32" y="256" font-size="14" fill="#737373">Language</text>
  <rect x="180" y="238" width="84" height="30" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="196" y="258" font-size="13" fill="#0a0a0a">EN / ID</text>
  <text x="32" y="298" font-size="14" fill="#737373">Theme</text>
  <rect x="180" y="280" width="84" height="30" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="196" y="300" font-size="13" fill="#0a0a0a">☾ Dark</text>

  <!-- Stacked footer -->
  <line x1="0" y1="408" x2="375" y2="408" stroke="#e5e5e5"/>
  <text x="16" y="442" font-size="14" font-weight="700" fill="#0a0a0a">Learn</text>
  <text x="16" y="464" font-size="12" fill="#737373">Browse all · Software Engineering · Rants</text>
  <text x="16" y="494" font-size="14" font-weight="700" fill="#0a0a0a">Tools</text>
  <text x="16" y="516" font-size="12" fill="#737373">Cost of Living Calculator</text>
  <text x="16" y="544" font-size="11" fill="#737373">About · Terms · © 2026 AyoKoding · FSL-1.1-MIT</text>
</svg>
