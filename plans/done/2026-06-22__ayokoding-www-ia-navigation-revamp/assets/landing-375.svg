<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1500" viewBox="0 0 375 1500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AyoKoding landing homepage — hi-fi, mobile (375px), Option A</title>
  <desc>Mobile reflow: hamburger MobileNav, single-column section cards, stacked full-width CTAs and Tools teaser, stacked footer. No horizontal overflow.</desc>
  <rect width="375" height="1500" fill="#ffffff"/>

  <!-- Header (mobile) -->
  <rect x="0" y="0" width="375" height="56" fill="#ffffff"/>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#e5e5e5"/>
  <text x="16" y="35" font-size="20">≡</text>
  <text x="48" y="36" font-size="17" font-weight="700" fill="#0a0a0a">AyoKoding</text>
  <text x="300" y="35" font-size="16">🔍</text>
  <circle cx="348" cy="28" r="14" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="343" y="33" font-size="12">☾</text>

  <!-- Hero -->
  <text x="16" y="110" font-size="27" font-weight="800" fill="#0a0a0a">AyoKoding —</text>
  <text x="16" y="144" font-size="27" font-weight="800" fill="#0a0a0a">learn software</text>
  <text x="16" y="178" font-size="27" font-weight="800" fill="#0a0a0a">engineering in</text>
  <text x="16" y="212" font-size="27" font-weight="800" fill="#0a0a0a">public</text>
  <text x="16" y="246" font-size="14" fill="#737373">Practical, battle-tested notes from</text>
  <text x="16" y="266" font-size="14" fill="#737373">building a real platform.</text>
  <rect x="16" y="288" width="343" height="48" rx="8" fill="#2563eb"/>
  <text x="130" y="318" font-size="16" font-weight="600" fill="#ffffff">Browse Learn →</text>
  <rect x="16" y="348" width="343" height="48" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="148" y="378" font-size="16" font-weight="600" fill="#0a0a0a">Open Tools</text>

  <line x1="16" y1="430" x2="359" y2="430" stroke="#e5e5e5"/>
  <text x="16" y="470" font-size="20" font-weight="700" fill="#0a0a0a">Explore</text>

  <!-- Single-column cards -->
  <g>
    <rect x="16" y="490" width="343" height="96" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="36" y="528" font-size="16" font-weight="700" fill="#0a0a0a">Software Engineering</text>
    <text x="36" y="554" font-size="12" fill="#737373">Languages, architecture, system design.</text>

    <rect x="16" y="602" width="343" height="96" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="36" y="640" font-size="16" font-weight="700" fill="#0a0a0a">Information Security</text>
    <text x="36" y="666" font-size="12" fill="#737373">AppSec, threat modelling, secure default.</text>

    <rect x="16" y="714" width="343" height="96" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="36" y="752" font-size="16" font-weight="700" fill="#0a0a0a">Artificial Intelligence</text>
    <text x="36" y="778" font-size="12" fill="#737373">LLMs, agents, applied ML.</text>

    <rect x="16" y="826" width="343" height="96" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="36" y="864" font-size="16" font-weight="700" fill="#0a0a0a">Business</text>
    <text x="36" y="890" font-size="12" fill="#737373">IT governance &amp; strategy.</text>

    <rect x="16" y="938" width="343" height="96" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="36" y="976" font-size="16" font-weight="700" fill="#0a0a0a">Personal Development</text>
    <text x="36" y="1002" font-size="12" fill="#737373">Career growth, learning how to learn.</text>

    <rect x="16" y="1050" width="343" height="96" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="36" y="1088" font-size="16" font-weight="700" fill="#0a0a0a">Rants</text>
    <text x="36" y="1114" font-size="12" fill="#737373">Opinionated takes — first-class section.</text>
  </g>

  <!-- Tools teaser full-width -->
  <rect x="16" y="1174" width="343" height="150" rx="12" fill="#eff4ff" stroke="#dbe6ff"/>
  <text x="36" y="1210" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">TOOLS</text>
  <text x="36" y="1240" font-size="18" font-weight="700" fill="#0a0a0a">Cost of Living Calculator</text>
  <text x="36" y="1264" font-size="12" fill="#737373">Compare living costs across cities.</text>
  <rect x="36" y="1278" width="303" height="42" rx="8" fill="#2563eb"/>
  <text x="120" y="1305" font-size="14" font-weight="600" fill="#ffffff">Open calculator →</text>

  <!-- Footer stacked -->
  <line x1="0" y1="1360" x2="375" y2="1360" stroke="#e5e5e5"/>
  <text x="16" y="1396" font-size="14" font-weight="700" fill="#0a0a0a">Learn</text>
  <text x="16" y="1418" font-size="12" fill="#737373">Browse all · Rants</text>
  <text x="16" y="1446" font-size="14" font-weight="700" fill="#0a0a0a">Tools</text>
  <text x="16" y="1468" font-size="12" fill="#737373">Cost of Living Calculator</text>
  <text x="16" y="1494" font-size="11" fill="#737373">© 2026 AyoKoding · FSL-1.1-MIT</text>
</svg>
