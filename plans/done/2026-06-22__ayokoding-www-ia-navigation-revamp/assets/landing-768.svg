<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1320" viewBox="0 0 768 1320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AyoKoding landing homepage — hi-fi, tablet (768px), Option A</title>
  <desc>Tablet reflow: section cards in 2 columns, header nav still inline, footer 2 columns. Tokens match ayokoding-www.</desc>
  <rect width="768" height="1320" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="768" height="64" fill="#ffffff"/>
  <line x1="0" y1="64" x2="768" y2="64" stroke="#e5e5e5"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0a0a0a">AyoKoding</text>
  <text x="180" y="40" font-size="15" font-weight="500" fill="#0a0a0a">Learn</text>
  <text x="252" y="40" font-size="15" font-weight="500" fill="#0a0a0a">Tools</text>
  <rect x="560" y="18" width="40" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="572" y="39" font-size="14">🔍</text>
  <rect x="612" y="18" width="56" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="622" y="39" font-size="13" fill="#0a0a0a">EN ▾</text>
  <circle cx="704" cy="34" r="15" fill="#f5f5f5" stroke="#e5e5e5"/>
  <text x="698" y="39" font-size="13">☾</text>

  <!-- Hero -->
  <text x="32" y="148" font-size="34" font-weight="800" fill="#0a0a0a">AyoKoding — learn</text>
  <text x="32" y="190" font-size="34" font-weight="800" fill="#0a0a0a">software engineering</text>
  <text x="32" y="232" font-size="34" font-weight="800" fill="#0a0a0a">in public</text>
  <text x="32" y="272" font-size="16" fill="#737373">Practical, battle-tested notes from building a real platform.</text>
  <rect x="32" y="298" width="168" height="48" rx="8" fill="#2563eb"/>
  <text x="58" y="328" font-size="16" font-weight="600" fill="#ffffff">Browse Learn →</text>
  <rect x="216" y="298" width="150" height="48" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="244" y="328" font-size="16" font-weight="600" fill="#0a0a0a">Open Tools</text>

  <line x1="32" y1="388" x2="736" y2="388" stroke="#e5e5e5"/>
  <text x="32" y="436" font-size="22" font-weight="700" fill="#0a0a0a">Explore</text>

  <!-- 2-column grid -->
  <g>
    <rect x="32" y="458" width="344" height="140" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
