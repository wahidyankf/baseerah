    <text x="56" y="526" font-size="13" fill="#737373">Languages, architecture,</text>
    <text x="56" y="544" font-size="13" fill="#737373">system design — by example.</text>

    <rect x="392" y="458" width="344" height="140" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="416" y="500" font-size="16" font-weight="700" fill="#0a0a0a">Information Security</text>
    <text x="416" y="526" font-size="13" fill="#737373">AppSec, threat modelling,</text>
    <text x="416" y="544" font-size="13" fill="#737373">secure-by-default practice.</text>

    <rect x="32" y="614" width="344" height="140" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="56" y="656" font-size="16" font-weight="700" fill="#0a0a0a">Artificial Intelligence</text>
    <text x="56" y="682" font-size="13" fill="#737373">LLMs, agents, applied ML.</text>

    <rect x="392" y="614" width="344" height="140" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="416" y="656" font-size="16" font-weight="700" fill="#0a0a0a">Business</text>
    <text x="416" y="682" font-size="13" fill="#737373">IT governance &amp; strategy.</text>

    <rect x="32" y="770" width="344" height="140" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="56" y="812" font-size="16" font-weight="700" fill="#0a0a0a">Personal Development</text>
    <text x="56" y="838" font-size="13" fill="#737373">Career growth, learning.</text>

    <rect x="392" y="770" width="344" height="140" rx="10" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="416" y="812" font-size="16" font-weight="700" fill="#0a0a0a">Rants</text>
    <text x="416" y="838" font-size="13" fill="#737373">Opinionated takes.</text>
  </g>

  <!-- Tools teaser -->
  <rect x="32" y="942" width="704" height="128" rx="12" fill="#eff4ff" stroke="#dbe6ff"/>
  <text x="56" y="980" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">TOOLS</text>
  <text x="56" y="1010" font-size="20" font-weight="700" fill="#0a0a0a">Cost of Living Calculator</text>
  <text x="56" y="1034" font-size="13" fill="#737373">Compare living costs across cities.</text>
  <rect x="56" y="1048" width="190" height="42" rx="8" fill="#2563eb"/>
  <text x="80" y="1075" font-size="14" font-weight="600" fill="#ffffff">Open calculator →</text>

  <!-- Footer -->
  <line x1="0" y1="1130" x2="768" y2="1130" stroke="#e5e5e5"/>
  <text x="32" y="1174" font-size="14" font-weight="700" fill="#0a0a0a">Learn</text>
  <text x="32" y="1200" font-size="13" fill="#737373">Browse all · Rants</text>
  <text x="392" y="1174" font-size="14" font-weight="700" fill="#0a0a0a">Tools</text>
  <text x="392" y="1200" font-size="13" fill="#737373">Cost of Living Calculator</text>
  <text x="32" y="1240" font-size="14" font-weight="700" fill="#0a0a0a">About</text>
  <text x="32" y="1266" font-size="13" fill="#737373">About AyoKoding · Terms &amp; Conditions</text>
  <text x="32" y="1304" font-size="12" fill="#737373">© 2026 AyoKoding · FSL-1.1-MIT</text>
