<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="High-fidelity mockup of Option C — split layout with controls on the left and results table on the right">
  <rect width="680" height="440" fill="#f1f5f9"/>
  <rect x="24" y="24" width="632" height="392" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header -->
  <text x="48" y="62" font-size="20" font-weight="700" fill="#0f172a">Salary Savings Calculator</text>

  <!-- tabs -->
  <rect x="48" y="80" width="124" height="32" rx="8" fill="#0f766e"/>
  <text x="110" y="101" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Compare All</text>
  <rect x="178" y="80" width="124" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="240" y="101" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">Single City</text>

  <!-- vertical divider -->
  <line x1="290" y1="136" x2="290" y2="392" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- left rail: controls -->
  <text x="48" y="160" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CONTROLS</text>

  <text x="48" y="190" font-size="12.5" fill="#475569">Salary (USD / month)</text>
  <rect x="48" y="200" width="208" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="221" font-size="13.5" font-weight="600" fill="#0f172a">4,000</text>

  <text x="48" y="258" font-size="12.5" fill="#475569">Household</text>
  <rect x="48" y="268" width="208" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="62" y="289" font-size="13.5" fill="#0f172a">Single</text>
  <path d="M238 280 l6 7 l6 -7" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <text x="48" y="326" font-size="12.5" fill="#475569">Area</text>
  <circle cx="56" cy="344" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="349" font-size="12.5" fill="#334155">City center</text>
  <circle cx="164" cy="344" r="6" fill="#0f766e"/>
  <circle cx="164" cy="344" r="2.4" fill="#ffffff"/>
  <text x="178" y="349" font-size="12.5" font-weight="600" fill="#0f172a">Rural</text>

  <!-- right column: results table -->
  <text x="318" y="160" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">CITY</text>
  <text x="446" y="160" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SAVE/MO</text>
  <text x="548" y="160" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="0.5">%</text>

  <!-- rows -->
  <text x="318" y="192" font-size="13.5" fill="#0f172a">Jakarta</text>
  <text x="446" y="192" font-size="13.5" font-weight="600" fill="#0f766e">$2,100</text>
  <text x="548" y="192" font-size="13.5" fill="#334155">52%</text>
  <rect x="582" y="183" width="50" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="582" y="183" width="50" height="9" rx="4.5" fill="#0f766e"/>

  <text x="318" y="228" font-size="13.5" fill="#0f172a">Kuala Lumpur</text>
  <text x="446" y="228" font-size="13.5" font-weight="600" fill="#0f766e">$1,800</text>
  <text x="548" y="228" font-size="13.5" fill="#334155">45%</text>
  <rect x="582" y="219" width="50" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="582" y="219" width="43" height="9" rx="4.5" fill="#0f766e"/>

  <text x="318" y="264" font-size="13.5" fill="#0f172a">Singapore</text>
  <text x="446" y="264" font-size="13.5" font-weight="600" fill="#0f766e">$1,200</text>
  <text x="548" y="264" font-size="13.5" fill="#334155">30%</text>
  <rect x="582" y="255" width="50" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="582" y="255" width="29" height="9" rx="4.5" fill="#0f766e"/>

  <text x="318" y="300" font-size="13.5" fill="#0f172a">Berlin</text>
  <text x="446" y="300" font-size="13.5" font-weight="600" fill="#0f766e">$900</text>
  <text x="548" y="300" font-size="13.5" fill="#334155">22%</text>
  <rect x="582" y="291" width="50" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="582" y="291" width="21" height="9" rx="4.5" fill="#0f766e"/>
</svg>
