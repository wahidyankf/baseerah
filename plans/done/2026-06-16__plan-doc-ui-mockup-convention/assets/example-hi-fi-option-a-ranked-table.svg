<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="High-fidelity mockup of the Salary Savings Calculator compare-all screen">
  <rect width="680" height="560" fill="#f1f5f9"/>
  <!-- card -->
  <rect x="24" y="24" width="632" height="512" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header -->
  <text x="48" y="66" font-size="22" font-weight="700" fill="#0f172a">Salary Savings Calculator</text>
  <text x="48" y="90" font-size="13.5" fill="#64748b">Where in the world does this salary save the most?</text>

  <!-- tab toggle -->
  <rect x="48" y="108" width="138" height="36" rx="9" fill="#0f766e"/>
  <text x="117" y="131" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Compare All</text>
  <rect x="192" y="108" width="138" height="36" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="261" y="131" font-size="13.5" font-weight="600" fill="#475569" text-anchor="middle">Single City</text>

  <!-- form -->
  <text x="48" y="180" font-size="13" fill="#475569">Salary (USD / month)</text>
  <rect x="240" y="164" width="180" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="254" y="185" font-size="13.5" font-weight="600" fill="#0f172a">4,000</text>

  <text x="48" y="220" font-size="13" fill="#475569">Household</text>
  <rect x="240" y="204" width="180" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="254" y="225" font-size="13.5" fill="#0f172a">Single</text>
  <path d="M402 216 l6 7 l6 -7" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <text x="48" y="260" font-size="13" fill="#475569">Area</text>
  <circle cx="248" cy="255" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="262" y="260" font-size="13" fill="#334155">City center</text>
  <circle cx="360" cy="255" r="6" fill="#0f766e"/>
  <circle cx="360" cy="255" r="2.4" fill="#ffffff"/>
  <text x="374" y="260" font-size="13" fill="#0f172a" font-weight="600">Rural</text>

  <!-- divider -->
  <line x1="48" y1="288" x2="632" y2="288" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- results table header -->
  <text x="48" y="316" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.4">CITY</text>
  <text x="250" y="316" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.4">SAVINGS / MO</text>
  <text x="396" y="316" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.4">% OF SALARY</text>

  <!-- row: Jakarta -->
  <text x="48" y="348" font-size="14" fill="#0f172a">Jakarta</text>
  <text x="250" y="348" font-size="14" font-weight="600" fill="#0f766e">$2,100</text>
  <text x="396" y="348" font-size="14" fill="#334155">52%</text>
  <rect x="470" y="338" width="146" height="11" rx="5.5" fill="#e2e8f0"/>
  <rect x="470" y="338" width="146" height="11" rx="5.5" fill="#0f766e"/>

  <!-- row: Kuala Lumpur -->
  <text x="48" y="382" font-size="14" fill="#0f172a">Kuala Lumpur</text>
  <text x="250" y="382" font-size="14" font-weight="600" fill="#0f766e">$1,800</text>
  <text x="396" y="382" font-size="14" fill="#334155">45%</text>
  <rect x="470" y="372" width="146" height="11" rx="5.5" fill="#e2e8f0"/>
  <rect x="470" y="372" width="126" height="11" rx="5.5" fill="#0f766e"/>

  <!-- row: Singapore -->
  <text x="48" y="416" font-size="14" fill="#0f172a">Singapore</text>
  <text x="250" y="416" font-size="14" font-weight="600" fill="#0f766e">$1,200</text>
  <text x="396" y="416" font-size="14" fill="#334155">30%</text>
  <rect x="470" y="406" width="146" height="11" rx="5.5" fill="#e2e8f0"/>
  <rect x="470" y="406" width="84" height="11" rx="5.5" fill="#0f766e"/>

  <!-- row: Berlin -->
  <text x="48" y="450" font-size="14" fill="#0f172a">Berlin</text>
  <text x="250" y="450" font-size="14" font-weight="600" fill="#0f766e">$900</text>
  <text x="396" y="450" font-size="14" fill="#334155">22%</text>
  <rect x="470" y="440" width="146" height="11" rx="5.5" fill="#e2e8f0"/>
  <rect x="470" y="440" width="62" height="11" rx="5.5" fill="#0f766e"/>

  <!-- footer -->
  <line x1="48" y1="478" x2="632" y2="478" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="48" y="504" font-size="12" fill="#94a3b8">FX snapshot: 2026-06-01  ·  transit-pass cost basis  ·  sorted by savings</text>
</svg>
