<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Savings screen, Option B (Savings Card Grid) high-fidelity finalist</title>
  <desc>High-fidelity mockup of the Salary Savings Calculator Savings tab using the Card Grid layout (runner-up finalist). Each city is rendered as a card showing net take-home, the non-salary comp line, the essential and after-lifestyle savings, and a healthcare scheme badge. A three-tab toggle shows Savings active. A gross-salary input, Region/Country/City cascading filters, and shared cost-basis controls sit above the card grid. Both city names and country names are underlined links.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="1180" height="780" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1179" height="779" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- ===== Header bar ===== -->
  <rect x="0" y="0" width="1180" height="48" fill="#0173B2"/>
  <text x="20" y="31" font-size="19" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Savings</text>
  <!-- roles caption badge -->
  <rect x="650" y="13" width="270" height="22" rx="11" fill="#DE8F05" stroke="#000000" stroke-width="1"/>
  <text x="785" y="28" font-size="12" text-anchor="middle" fill="#FFFFFF">Roles: software-engineering (IC + mgmt)</text>
  <!-- snapshot date pill -->
  <rect x="930" y="13" width="232" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="946" y="28" font-size="12" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- ===== Tab toggle ===== -->
  <g font-size="14">
    <rect x="20" y="62" width="150" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="95" y="84" text-anchor="middle" fill="#808080">Cost of living</text>
    <rect x="174" y="62" width="110" height="34" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="229" y="84" text-anchor="middle" font-weight="700" fill="#FFFFFF">Savings</text>
    <rect x="288" y="62" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="353" y="84" text-anchor="middle" fill="#808080">Minimum role</text>
  </g>

  <!-- ===== Gross salary input ===== -->
  <g font-size="13">
    <text x="20" y="120" font-weight="600" fill="#000000">Gross salary</text>
    <rect x="120" y="107" width="180" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="130" y="124" fill="#000000">$8,000 / mo</text>
    <text x="312" y="120" fill="#808080">= $96,000 / yr</text>
  </g>

  <!-- ===== Cascading filter row ===== -->
  <g font-size="13">
    <text x="20" y="152" font-weight="600" fill="#000000">Region</text>
    <rect x="78" y="139" width="130" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="156" fill="#000000">All regions</text>
    <text x="196" y="156" fill="#808080">▼</text>

    <text x="218" y="152" font-weight="600" fill="#000000">Country</text>
    <rect x="278" y="139" width="130" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="288" y="156" fill="#000000">All countries</text>
    <text x="396" y="156" fill="#808080">▼</text>

    <text x="416" y="152" font-weight="600" fill="#000000">City</text>
    <rect x="446" y="139" width="120" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="456" y="156" fill="#000000">All cities</text>
    <text x="554" y="156" fill="#808080">▼</text>
  </g>

  <!-- ===== Shared controls row ===== -->
  <g font-size="13">
    <text x="20" y="188" font-weight="600" fill="#000000">Household</text>
    <rect x="98" y="175" width="90" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="106" y="191" fill="#000000">Adults: 2</text>
    <rect x="194" y="175" width="142" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="202" y="191" fill="#000000">Pre-school kids: 1</text>
    <rect x="342" y="175" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="350" y="191" fill="#000000">School-age kids: 1</text>

    <text x="510" y="188" font-weight="600" fill="#000000">Area</text>
    <rect x="548" y="175" width="62" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="579" y="191" text-anchor="middle" fill="#808080">Center</text>
    <rect x="614" y="175" width="56" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="642" y="191" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="686" y="188" font-weight="600" fill="#000000">School</text>
    <rect x="736" y="175" width="62" height="24" rx="12" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="767" y="191" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="802" y="175" width="64" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="834" y="191" text-anchor="middle" fill="#808080">Private</text>
  </g>

  <line x1="20" y1="208" x2="1160" y2="208" stroke="#808080" stroke-width="1"/>

  <!-- ===== Section heading ===== -->
  <text x="20" y="230" font-size="13" fill="#808080">4 cities sorted by Essential savings (highest first) · Non-salary comp is informational total-comp context, not in savings math</text>

  <!-- ===== Savings cards — 2x2 grid ===== -->
  <!-- Card 1: Jakarta (rank 1 — top left) -->
  <rect x="20" y="240" width="270" height="240" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="240" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="20" y="268" width="270" height="12" fill="#0173B2"/>
  <!-- rank badge -->
  <rect x="26" y="247" width="22" height="22" rx="4" fill="#FFFFFF"/>
  <text x="37" y="263" font-size="12" font-weight="700" fill="#0173B2" text-anchor="middle">1</text>
  <text x="56" y="258" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">Jakarta</text>
  <text x="134" y="258" font-size="12" fill="#FFFFFF">,</text>
  <text x="142" y="258" font-size="12" fill="#FFFFFF" text-decoration="underline">Indonesia</text>
  <!-- scheme badge -->
  <rect x="30" y="288" width="120" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="90" y="301" font-size="11" text-anchor="middle" fill="#FFFFFF">tax-funded</text>
  <!-- financials -->
  <g font-size="12" fill="#000000">
    <text x="30" y="327">Net take-home</text>              <text x="280" y="327" text-anchor="end" font-weight="700">$6,800</text>
    <text x="30" y="345">Non-salary comp</text>            <text x="280" y="345" text-anchor="end" fill="#808080">+$10k RSU (info)</text>
    <text x="30" y="363">Essentials</text>                 <text x="280" y="363" text-anchor="end">$1,400</text>
  </g>
  <line x1="30" y1="370" x2="280" y2="370" stroke="#808080" stroke-width="1"/>
  <g font-size="13" font-weight="700">
    <text x="30" y="388" fill="#029E73">E.Save</text>      <text x="280" y="388" text-anchor="end" fill="#029E73">$5,400 / mo</text>
    <text x="30" y="407" fill="#029E73">79% of net</text>
  </g>
  <g font-size="12" fill="#808080">
    <text x="30" y="426">After-lifestyle</text>            <text x="280" y="426" text-anchor="end">$5,220 / mo</text>
  </g>
  <text x="150" y="464" text-anchor="middle" font-size="11" fill="#0173B2" text-decoration="underline">→ city detail</text>

  <!-- Card 2: K. Lumpur (rank 2 — top right) -->
  <rect x="306" y="240" width="270" height="240" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="306" y="240" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="306" y="268" width="270" height="12" fill="#0173B2"/>
  <rect x="312" y="247" width="22" height="22" rx="4" fill="#FFFFFF"/>
  <text x="323" y="263" font-size="12" font-weight="700" fill="#0173B2" text-anchor="middle">2</text>
  <text x="342" y="258" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">K. Lumpur</text>
  <text x="432" y="258" font-size="12" fill="#FFFFFF">,</text>
  <text x="440" y="258" font-size="12" fill="#FFFFFF" text-decoration="underline">Malaysia</text>
  <rect x="316" y="288" width="128" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="380" y="301" font-size="11" text-anchor="middle" fill="#FFFFFF">mixed public/priv</text>
  <g font-size="12" fill="#000000">
    <text x="316" y="327">Net take-home</text>             <text x="566" y="327" text-anchor="end" font-weight="700">$6,500</text>
    <text x="316" y="345">Non-salary comp</text>           <text x="566" y="345" text-anchor="end" fill="#808080">+$8k RSU (info)</text>
    <text x="316" y="363">Essentials</text>                <text x="566" y="363" text-anchor="end">$1,665</text>
  </g>
  <line x1="316" y1="370" x2="566" y2="370" stroke="#808080" stroke-width="1"/>
  <g font-size="13" font-weight="700">
    <text x="316" y="388" fill="#029E73">E.Save</text>     <text x="566" y="388" text-anchor="end" fill="#029E73">$4,835 / mo</text>
    <text x="316" y="407" fill="#029E73">74% of net</text>
  </g>
  <g font-size="12" fill="#808080">
    <text x="316" y="426">After-lifestyle</text>           <text x="566" y="426" text-anchor="end">$4,625 / mo</text>
  </g>
  <text x="436" y="464" text-anchor="middle" font-size="11" fill="#0173B2" text-decoration="underline">→ city detail</text>

  <!-- Card 3: Lisbon (rank 3 — bottom left) -->
  <rect x="20" y="496" width="270" height="240" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="20" y="496" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="20" y="524" width="270" height="12" fill="#0173B2"/>
  <rect x="26" y="503" width="22" height="22" rx="4" fill="#FFFFFF"/>
  <text x="37" y="519" font-size="12" font-weight="700" fill="#0173B2" text-anchor="middle">3</text>
  <text x="56" y="514" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">Lisbon</text>
  <text x="108" y="514" font-size="12" fill="#FFFFFF">,</text>
  <text x="116" y="514" font-size="12" fill="#FFFFFF" text-decoration="underline">Portugal</text>
  <rect x="30" y="544" width="120" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="90" y="557" font-size="11" text-anchor="middle" fill="#FFFFFF">tax-funded</text>
  <g font-size="12" fill="#000000">
    <text x="30" y="583">Net take-home</text>              <text x="280" y="583" text-anchor="end" font-weight="700">$5,400</text>
    <text x="30" y="601">Non-salary comp</text>            <text x="280" y="601" text-anchor="end" fill="#808080">+$5k RSU (info)</text>
    <text x="30" y="619">Essentials</text>                 <text x="280" y="619" text-anchor="end">$2,080</text>
  </g>
  <line x1="30" y1="626" x2="280" y2="626" stroke="#808080" stroke-width="1"/>
  <g font-size="13" font-weight="700">
    <text x="30" y="644" fill="#DE8F05">E.Save</text>      <text x="280" y="644" text-anchor="end" fill="#DE8F05">$3,320 / mo</text>
    <text x="30" y="663" fill="#DE8F05">61% of net</text>
  </g>
  <g font-size="12" fill="#808080">
    <text x="30" y="682">After-lifestyle</text>            <text x="280" y="682" text-anchor="end">$3,020 / mo</text>
  </g>
  <text x="150" y="720" text-anchor="middle" font-size="11" fill="#0173B2" text-decoration="underline">→ city detail</text>

  <!-- Card 4: Berlin (rank 4 — bottom right) -->
  <rect x="306" y="496" width="270" height="240" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="306" y="496" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="306" y="524" width="270" height="12" fill="#0173B2"/>
  <rect x="312" y="503" width="22" height="22" rx="4" fill="#FFFFFF"/>
  <text x="323" y="519" font-size="12" font-weight="700" fill="#0173B2" text-anchor="middle">4</text>
  <text x="342" y="514" font-size="14" font-weight="700" fill="#FFFFFF" text-decoration="underline">Berlin</text>
  <text x="393" y="514" font-size="12" fill="#FFFFFF">,</text>
  <text x="401" y="514" font-size="12" fill="#FFFFFF" text-decoration="underline">Germany</text>
  <rect x="316" y="544" width="120" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="376" y="557" font-size="11" text-anchor="middle" fill="#FFFFFF">tax-funded</text>
  <g font-size="12" fill="#000000">
    <text x="316" y="583">Net take-home</text>             <text x="566" y="583" text-anchor="end" font-weight="700">$5,200</text>
    <text x="316" y="601">Non-salary comp</text>           <text x="566" y="601" text-anchor="end" fill="#808080">+$6k RSU (info)</text>
    <text x="316" y="619">Essentials</text>                <text x="566" y="619" text-anchor="end">$2,520</text>
  </g>
  <line x1="316" y1="626" x2="566" y2="626" stroke="#808080" stroke-width="1"/>
  <g font-size="13" font-weight="700">
    <text x="316" y="644" fill="#CA9161">E.Save</text>     <text x="566" y="644" text-anchor="end" fill="#CA9161">$2,680 / mo</text>
    <text x="316" y="663" fill="#CA9161">52% of net</text>
  </g>
  <g font-size="12" fill="#808080">
    <text x="316" y="682">After-lifestyle</text>           <text x="566" y="682" text-anchor="end">$2,360 / mo</text>
  </g>
  <text x="436" y="720" text-anchor="middle" font-size="11" fill="#0173B2" text-decoration="underline">→ city detail</text>

  <!-- ===== Legend / disclaimer ===== -->
  <rect x="20" y="748" width="1140" height="22" rx="4" fill="#F5F5F5" stroke="#808080" stroke-width="0.5"/>
  <text x="30" y="763" font-size="11" fill="#000000">OOP = out-of-pocket · Non-salary comp is informational only, not in savings math · Savings before pension · All figures are estimates, not financial advice</text>
</svg>
