  <!-- ===== OOP legend and disclaimer ===== -->
  <rect x="20" y="548" width="1140" height="22" rx="4" fill="#F5F5F5" stroke="#808080" stroke-width="0.5"/>
  <text x="30" y="563" font-size="12" fill="#000000">OOP = out-of-pocket: healthcare costs you pay yourself above any tax-funded or insurance coverage · All money also shown in local currency</text>

  <!-- ===== Why dropped note ===== -->
  <rect x="20" y="580" width="1140" height="40" rx="4" fill="#FFFFFF" stroke="#808080" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="30" y="597" font-size="12" fill="#808080" font-style="italic">Runner-up finalist (dropped at narrow stage): card grid is more visual but shows too few cities per screen for the worldwide scan;</text>
  <text x="30" y="612" font-size="12" fill="#808080" font-style="italic">side-by-side category comparison is weaker than the inline table. Selected: Option A — Category Table.</text>

  <!-- ===== Footer disclaimer ===== -->
  <text x="20" y="755" font-size="11" fill="#808080">All figures are estimates. Sourced from public data; updated periodically. Not financial advice.</text>
</svg>
