<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Cost-of-living screen, Option B (Category Cards) high-fidelity finalist</title>
  <desc>High-fidelity mockup of the Cost of Living Calculator Cost-of-living tab using the Category Cards layout (runner-up finalist). Each city is rendered as a card with expense categories stacked, an essentials subtotal, a monthly total, a relocation sunk-cost line, and a liquidity-reserve line. A three-tab toggle shows Cost of living active. Region/Country/City cascading filters and household/area/school controls sit above the card grid. Healthcare cells carry a funding-scheme badge. An OOP legend explains the Healthcare column. Both the city name (detail view) and country name (filtered list) are tappable links.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="1180" height="780" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1179" height="779" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- ===== Header bar ===== -->
  <rect x="0" y="0" width="1180" height="48" fill="#0173B2"/>
  <text x="20" y="31" font-size="19" font-weight="700" fill="#FFFFFF">Cost of Living Calculator — Cost of living</text>
  <!-- snapshot date pill -->
  <rect x="930" y="13" width="232" height="22" rx="11" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="946" y="28" font-size="12" fill="#000000">Snapshot: 2026-06 · estimates only</text>

  <!-- ===== Tab toggle ===== -->
  <g font-size="14">
    <rect x="20" y="62" width="150" height="34" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="95" y="84" text-anchor="middle" font-weight="700" fill="#FFFFFF">Cost of living</text>
    <rect x="174" y="62" width="110" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="229" y="84" text-anchor="middle" fill="#808080">Savings</text>
    <rect x="288" y="62" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="353" y="84" text-anchor="middle" fill="#808080">Minimum role</text>
  </g>

  <!-- ===== Cascading filter row ===== -->
  <g font-size="13">
    <text x="20" y="125" font-weight="600" fill="#000000">Region</text>
    <rect x="78" y="112" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="88" y="129" fill="#000000">All regions</text>
    <text x="216" y="129" fill="#808080">▼</text>

    <text x="250" y="125" font-weight="600" fill="#000000">Country</text>
    <rect x="312" y="112" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="322" y="129" fill="#000000">All countries</text>
    <text x="450" y="129" fill="#808080">▼</text>

    <text x="484" y="125" font-weight="600" fill="#000000">City</text>
    <rect x="524" y="112" width="150" height="26" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="534" y="129" fill="#000000">All cities</text>
    <text x="662" y="129" fill="#808080">▼</text>
    <text x="694" y="129" font-size="12" fill="#808080">Region narrows Country narrows City</text>
  </g>

  <!-- ===== Shared controls row ===== -->
  <g font-size="13">
    <text x="20" y="162" font-weight="600" fill="#000000">Household</text>
    <rect x="98" y="149" width="98" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="106" y="165" fill="#000000">Adults: 2</text>
    <rect x="202" y="149" width="142" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="210" y="165" fill="#000000">Pre-school kids: 1</text>
    <rect x="350" y="149" width="150" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="358" y="165" fill="#000000">School-age kids: 1</text>

    <text x="520" y="162" font-weight="600" fill="#000000">Area</text>
    <rect x="558" y="149" width="62" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="589" y="165" text-anchor="middle" fill="#808080">Center</text>
    <rect x="624" y="149" width="56" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="652" y="165" text-anchor="middle" fill="#FFFFFF">Rural</text>

    <text x="700" y="162" font-weight="600" fill="#000000">School</text>
    <rect x="752" y="149" width="62" height="24" rx="12" fill="#029E73" stroke="#000000" stroke-width="1"/>
    <text x="783" y="165" text-anchor="middle" fill="#FFFFFF">Public</text>
    <rect x="818" y="149" width="64" height="24" rx="12" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="850" y="165" text-anchor="middle" fill="#808080">Private</text>
  </g>

  <line x1="20" y1="184" x2="1160" y2="184" stroke="#808080" stroke-width="1"/>

  <!-- ===== Section heading ===== -->
  <text x="20" y="208" font-size="13" fill="#808080">4 cities shown · Healthcare (OOP = out-of-pocket: costs you pay above any tax-funded or insurance coverage) · Sort by: Total ▼</text>

  <!-- ===== City cards — row 1 ===== -->
  <!-- Card 1: Jakarta, Indonesia -->
  <rect x="20" y="220" width="270" height="310" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <!-- card header -->
  <rect x="20" y="220" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="20" y="248" width="270" height="12" fill="#0173B2"/>
  <text x="30" y="245" font-size="15" font-weight="700" fill="#FFFFFF" text-decoration="underline">Jakarta</text>
  <text x="118" y="245" font-size="13" fill="#FFFFFF">,</text>
  <text x="126" y="245" font-size="13" fill="#FFFFFF" text-decoration="underline">Indonesia</text>
  <!-- scheme badge -->
  <rect x="30" y="267" width="130" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="95" y="280" font-size="11" text-anchor="middle" fill="#FFFFFF">tax-funded</text>
  <!-- expense rows -->
  <g font-size="12" fill="#000000">
    <text x="30" y="304">Housing</text>         <text x="240" y="304" text-anchor="end">$600</text>
    <text x="30" y="322">Food</text>            <text x="240" y="322" text-anchor="end">$250</text>
    <text x="30" y="340">Transport</text>       <text x="240" y="340" text-anchor="end">$30</text>
    <text x="30" y="358">Utilities</text>       <text x="240" y="358" text-anchor="end">$120</text>
    <text x="30" y="376">Healthcare (OOP)</text> <text x="240" y="376" text-anchor="end">$40</text>
    <text x="30" y="394">Childcare</text>       <text x="240" y="394" text-anchor="end">$300</text>
    <text x="30" y="412">School (pub)</text>    <text x="240" y="412" text-anchor="end">$0</text>
    <text x="30" y="430">Lifestyle</text>       <text x="240" y="430" text-anchor="end">$180</text>
  </g>
  <line x1="30" y1="438" x2="260" y2="438" stroke="#808080" stroke-width="1"/>
  <g font-size="12" font-weight="700" fill="#000000">
    <text x="30" y="455">Essentials</text>      <text x="240" y="455" text-anchor="end">$1,400</text>
  </g>
  <g font-size="13" font-weight="700" fill="#0173B2">
    <text x="30" y="474">Total</text>            <text x="240" y="474" text-anchor="end">$1,580</text>
  </g>
  <line x1="30" y1="480" x2="260" y2="480" stroke="#808080" stroke-width="0.5" stroke-dasharray="4,2"/>
  <g font-size="11" fill="#808080">
    <text x="30" y="495">Reloc sunk</text>       <text x="240" y="495" text-anchor="end">$4,100</text>
    <text x="30" y="511">Reserve (kept)</text>   <text x="240" y="511" text-anchor="end">$4,800</text>
  </g>

  <!-- Card 2: K. Lumpur, Malaysia -->
  <rect x="306" y="220" width="270" height="310" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="306" y="220" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="306" y="248" width="270" height="12" fill="#0173B2"/>
  <text x="316" y="245" font-size="15" font-weight="700" fill="#FFFFFF" text-decoration="underline">K. Lumpur</text>
  <text x="416" y="245" font-size="13" fill="#FFFFFF">,</text>
  <text x="424" y="245" font-size="13" fill="#FFFFFF" text-decoration="underline">Malaysia</text>
  <rect x="316" y="267" width="128" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="380" y="280" font-size="11" text-anchor="middle" fill="#FFFFFF">mixed public/priv</text>
  <g font-size="12" fill="#000000">
    <text x="316" y="304">Housing</text>         <text x="526" y="304" text-anchor="end">$720</text>
    <text x="316" y="322">Food</text>            <text x="526" y="322" text-anchor="end">$300</text>
    <text x="316" y="340">Transport</text>       <text x="526" y="340" text-anchor="end">$35</text>
    <text x="316" y="358">Utilities</text>       <text x="526" y="358" text-anchor="end">$140</text>
    <text x="316" y="376">Healthcare (OOP)</text> <text x="526" y="376" text-anchor="end">$50</text>
    <text x="316" y="394">Childcare</text>       <text x="526" y="394" text-anchor="end">$350</text>
    <text x="316" y="412">School (pub)</text>    <text x="526" y="412" text-anchor="end">$0</text>
    <text x="316" y="430">Lifestyle</text>       <text x="526" y="430" text-anchor="end">$220</text>
  </g>
  <line x1="316" y1="438" x2="546" y2="438" stroke="#808080" stroke-width="1"/>
  <g font-size="12" font-weight="700" fill="#000000">
    <text x="316" y="455">Essentials</text>      <text x="526" y="455" text-anchor="end">$1,665</text>
  </g>
  <g font-size="13" font-weight="700" fill="#0173B2">
    <text x="316" y="474">Total</text>            <text x="526" y="474" text-anchor="end">$1,885</text>
  </g>
  <line x1="316" y1="480" x2="546" y2="480" stroke="#808080" stroke-width="0.5" stroke-dasharray="4,2"/>
  <g font-size="11" fill="#808080">
    <text x="316" y="495">Reloc sunk</text>       <text x="526" y="495" text-anchor="end">$5,000</text>
    <text x="316" y="511">Reserve (kept)</text>   <text x="526" y="511" text-anchor="end">$5,500</text>
  </g>

  <!-- Card 3: Berlin, Germany -->
  <rect x="592" y="220" width="270" height="310" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="592" y="220" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="592" y="248" width="270" height="12" fill="#0173B2"/>
  <text x="602" y="245" font-size="15" font-weight="700" fill="#FFFFFF" text-decoration="underline">Berlin</text>
  <text x="653" y="245" font-size="13" fill="#FFFFFF">,</text>
  <text x="661" y="245" font-size="13" fill="#FFFFFF" text-decoration="underline">Germany</text>
  <rect x="602" y="267" width="120" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="662" y="280" font-size="11" text-anchor="middle" fill="#FFFFFF">tax-funded</text>
  <g font-size="12" fill="#000000">
    <text x="602" y="304">Housing</text>         <text x="812" y="304" text-anchor="end">$1,100</text>
    <text x="602" y="322">Food</text>            <text x="812" y="322" text-anchor="end">$400</text>
    <text x="602" y="340">Transport</text>       <text x="812" y="340" text-anchor="end">$90</text>
    <text x="602" y="358">Utilities</text>       <text x="812" y="358" text-anchor="end">$180</text>
    <text x="602" y="376">Healthcare (OOP)</text> <text x="812" y="376" text-anchor="end">$30</text>
    <text x="602" y="394">Childcare</text>       <text x="812" y="394" text-anchor="end">$320</text>
    <text x="602" y="412">School (pub)</text>    <text x="812" y="412" text-anchor="end">$0</text>
    <text x="602" y="430">Lifestyle</text>       <text x="812" y="430" text-anchor="end">$350</text>
  </g>
  <line x1="602" y1="438" x2="832" y2="438" stroke="#808080" stroke-width="1"/>
  <g font-size="12" font-weight="700" fill="#000000">
    <text x="602" y="455">Essentials</text>      <text x="812" y="455" text-anchor="end">$2,520</text>
  </g>
  <g font-size="13" font-weight="700" fill="#0173B2">
    <text x="602" y="474">Total</text>            <text x="812" y="474" text-anchor="end">$2,870</text>
  </g>
  <line x1="602" y1="480" x2="832" y2="480" stroke="#808080" stroke-width="0.5" stroke-dasharray="4,2"/>
  <g font-size="11" fill="#808080">
    <text x="602" y="495">Reloc sunk</text>       <text x="812" y="495" text-anchor="end">$7,400</text>
    <text x="602" y="511">Reserve (kept)</text>   <text x="812" y="511" text-anchor="end">$7,800</text>
  </g>

  <!-- Card 4: Lisbon, Portugal -->
  <rect x="878" y="220" width="270" height="310" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="878" y="220" width="270" height="40" rx="8" fill="#0173B2"/>
  <rect x="878" y="248" width="270" height="12" fill="#0173B2"/>
  <text x="888" y="245" font-size="15" font-weight="700" fill="#FFFFFF" text-decoration="underline">Lisbon</text>
  <text x="941" y="245" font-size="13" fill="#FFFFFF">,</text>
  <text x="949" y="245" font-size="13" fill="#FFFFFF" text-decoration="underline">Portugal</text>
  <rect x="888" y="267" width="120" height="18" rx="4" fill="#029E73" stroke="#000000" stroke-width="1"/>
  <text x="948" y="280" font-size="11" text-anchor="middle" fill="#FFFFFF">tax-funded</text>
  <g font-size="12" fill="#000000">
    <text x="888" y="304">Housing</text>         <text x="1098" y="304" text-anchor="end">$950</text>
    <text x="888" y="322">Food</text>            <text x="1098" y="322" text-anchor="end">$350</text>
    <text x="888" y="340">Transport</text>       <text x="1098" y="340" text-anchor="end">$45</text>
    <text x="888" y="358">Utilities</text>       <text x="1098" y="358" text-anchor="end">$160</text>
    <text x="888" y="376">Healthcare (OOP)</text> <text x="1098" y="376" text-anchor="end">$35</text>
    <text x="888" y="394">Childcare</text>       <text x="1098" y="394" text-anchor="end">$270</text>
    <text x="888" y="412">School (pub)</text>    <text x="1098" y="412" text-anchor="end">$0</text>
    <text x="888" y="430">Lifestyle</text>       <text x="1098" y="430" text-anchor="end">$300</text>
  </g>
  <line x1="888" y1="438" x2="1118" y2="438" stroke="#808080" stroke-width="1"/>
  <g font-size="12" font-weight="700" fill="#000000">
    <text x="888" y="455">Essentials</text>      <text x="1098" y="455" text-anchor="end">$2,080</text>
  </g>
  <g font-size="13" font-weight="700" fill="#0173B2">
    <text x="888" y="474">Total</text>            <text x="1098" y="474" text-anchor="end">$2,380</text>
  </g>
  <line x1="888" y1="480" x2="1118" y2="480" stroke="#808080" stroke-width="0.5" stroke-dasharray="4,2"/>
  <g font-size="11" fill="#808080">
    <text x="888" y="495">Reloc sunk</text>       <text x="1098" y="495" text-anchor="end">$6,200</text>
    <text x="888" y="511">Reserve (kept)</text>   <text x="1098" y="511" text-anchor="end">$6,600</text>
