<svg xmlns="http://www.w3.org/2000/svg" width="768" height="620" viewBox="0 0 768 620" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Comparison table, Option A (summary-first reorder) — tablet high-fidelity mockup</title>
  <desc>High-fidelity tablet mockup (768px) of the Cost of Living Calculator Cost-of-living tab after the UWT-004 fix. The table keeps Total and Essentials immediately after City; at tablet width fewer breakdown columns fit so a right-edge scroll affordance and fade signal more columns to the right. Filters stack into two rows. Country and City names are underlined links.</desc>

  <!-- palette: blue #0173B2, orange #DE8F05, teal #029E73, purple #CC78BC, brown #CA9161, gray #808080, black #000000 -->
  <rect x="0" y="0" width="768" height="620" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="767" height="619" fill="none" stroke="#000000" stroke-width="1"/>

  <rect x="0" y="0" width="768" height="46" fill="#0173B2"/>
  <text x="16" y="29" font-size="16" font-weight="700" fill="#FFFFFF">Cost of Living — Cost of living</text>
  <text x="16" y="62" font-size="11" fill="#808080">Salary Savings Calculator — compare cost of living across tech hubs</text>

  <!-- tabs -->
  <g font-size="12">
    <rect x="16" y="72" width="120" height="30" rx="6" fill="#0173B2" stroke="#000000" stroke-width="1.5"/>
    <text x="76" y="92" text-anchor="middle" font-weight="700" fill="#FFFFFF">Cost of living</text>
    <rect x="140" y="72" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="215" y="92" text-anchor="middle" fill="#808080">Savings after exp.</text>
    <rect x="294" y="72" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <text x="374" y="92" text-anchor="middle" fill="#808080">Min. salary needed</text>
  </g>

  <!-- filters row 1 -->
  <g font-size="12">
    <text x="16" y="130" font-weight="600" fill="#000000">Region</text>
    <rect x="68" y="118" width="130" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="76" y="134" fill="#000000">All regions</text>
    <text x="186" y="134" fill="#808080">▼</text>
    <text x="214" y="130" font-weight="600" fill="#000000">Country</text>
    <rect x="274" y="118" width="130" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="282" y="134" fill="#000000">All countries</text>
    <text x="392" y="134" fill="#808080">▼</text>
  </g>
  <!-- filters row 2 -->
  <g font-size="12">
    <text x="16" y="162" font-weight="600" fill="#000000">City</text>
    <rect x="56" y="150" width="130" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="64" y="166" fill="#000000">All cities</text>
    <text x="174" y="166" fill="#808080">▼</text>
    <rect x="204" y="150" width="80" height="24" rx="5" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="212" y="166" fill="#000000">Adults: 2</text>
    <rect x="292" y="150" width="56" height="24" rx="12" fill="#0173B2" stroke="#000000" stroke-width="1"/>
    <text x="320" y="166" text-anchor="middle" fill="#FFFFFF">Rural</text>
  </g>

  <line x1="16" y1="186" x2="752" y2="186" stroke="#808080" stroke-width="1"/>

  <!-- header band: Country City | TOTAL Essen | Hous Food Tran Util ▸ -->
  <rect x="16" y="194" width="736" height="34" fill="#0173B2"/>
  <rect x="150" y="194" width="150" height="34" fill="#015C8E"/>
  <g font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">
    <text x="56"  y="215" text-decoration="underline">Country</text>
    <text x="118" y="215" text-decoration="underline">City</text>
    <text x="200" y="215">TOTAL</text>
    <text x="268" y="215">Essen.</text>
    <text x="340" y="215">Housing</text>
    <text x="408" y="215">Food</text>
    <text x="470" y="215">Transp.</text>
    <text x="540" y="215">Utilities</text>
    <text x="612" y="209">Health</text>
    <text x="612" y="221">(OOP)</text>
    <text x="690" y="215">more ›</text>
  </g>

  <!-- rows -->
  <rect x="16" y="228" width="736" height="40" fill="#FFFFFF"/>
  <rect x="150" y="228" width="150" height="40" fill="#EAF3F9"/>
  <g font-size="11" text-anchor="middle">
    <text x="56"  y="252" fill="#0173B2" text-decoration="underline" font-weight="600">Indonesia</text>
    <text x="118" y="252" fill="#0173B2" text-decoration="underline" font-weight="600">Jakarta</text>
    <text x="200" y="252" fill="#000000" font-weight="700">$1,580</text>
    <text x="268" y="252" fill="#000000" font-weight="600">$1,400</text>
    <text x="340" y="252" fill="#000000">$600</text>
    <text x="408" y="252" fill="#000000">$250</text>
    <text x="470" y="252" fill="#000000">$30</text>
    <text x="540" y="252" fill="#000000">$120</text>
    <text x="612" y="252" fill="#000000">$40</text>
  </g>
  <line x1="16" y1="268" x2="752" y2="268" stroke="#E5E5E5" stroke-width="1"/>

  <rect x="16" y="268" width="736" height="40" fill="#F6F8FA"/>
  <rect x="150" y="268" width="150" height="40" fill="#E1EEF6"/>
  <g font-size="11" text-anchor="middle">
    <text x="56"  y="292" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="118" y="292" fill="#0173B2" text-decoration="underline" font-weight="600">Singapore</text>
    <text x="200" y="292" fill="#000000" font-weight="700">$5,630</text>
    <text x="268" y="292" fill="#000000" font-weight="600">$4,730</text>
    <text x="340" y="292" fill="#000000">$2,250</text>
    <text x="408" y="292" fill="#000000">$600</text>
    <text x="470" y="292" fill="#000000">$150</text>
    <text x="540" y="292" fill="#000000">$230</text>
    <text x="612" y="292" fill="#000000">$300</text>
  </g>
  <line x1="16" y1="308" x2="752" y2="308" stroke="#E5E5E5" stroke-width="1"/>

  <rect x="16" y="308" width="736" height="40" fill="#FFFFFF"/>
  <rect x="150" y="308" width="150" height="40" fill="#EAF3F9"/>
  <g font-size="11" text-anchor="middle">
    <text x="56"  y="332" fill="#0173B2" text-decoration="underline" font-weight="600">Germany</text>
    <text x="118" y="332" fill="#0173B2" text-decoration="underline" font-weight="600">Berlin</text>
    <text x="200" y="332" fill="#000000" font-weight="700">$2,870</text>
    <text x="268" y="332" fill="#000000" font-weight="600">$2,520</text>
    <text x="340" y="332" fill="#000000">$1,100</text>
    <text x="408" y="332" fill="#000000">$400</text>
    <text x="470" y="332" fill="#000000">$90</text>
    <text x="540" y="332" fill="#000000">$180</text>
    <text x="612" y="332" fill="#000000">$30</text>
  </g>
  <rect x="16" y="228" width="736" height="120" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- right-edge fade -->
  <rect x="712" y="228" width="40" height="120" fill="url(#fadeT)"/>
  <defs>
    <linearGradient id="fadeT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <text x="742" y="292" font-size="14" fill="#808080" text-anchor="middle">›</text>

  <rect x="150" y="362" width="150" height="22" rx="11" fill="#029E73"/>
  <text x="225" y="377" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">Total leads</text>
  <text x="310" y="377" font-size="11" fill="#808080">Fewer breakdown columns fit at tablet width — scroll right (›) for the rest.</text>

  <g font-size="11" fill="#808080">
    <rect x="16" y="404" width="736" height="100" rx="5" fill="#F6F8FA" stroke="#808080" stroke-width="1"/>
    <text x="28" y="426" fill="#000000" font-weight="700">Tablet (768px) responsive notes</text>
    <text x="28" y="446">Filters reflow to two rows; the summary columns (Total, Essentials) stay pinned after City.</text>
    <text x="28" y="464">Breakdown columns beyond Healthcare scroll horizontally with a right-edge fade + › affordance.</text>
    <text x="28" y="482">Controls are at least 44px tall (UWT-009). Country &amp; City remain underlined links.</text>
    <text x="28" y="500">Relocation (sunk) and Liquidity reserve headers carry definition tooltips (reach by scrolling right).</text>
  </g>
</svg>
