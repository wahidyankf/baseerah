services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: organiclever
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: ../..
      dockerfile: apps/organiclever-be/Dockerfile.integration
      target: builder
    volumes:
      - ../../specs:/specs:ro
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/organiclever
      API_BASE_URL: http://localhost:8202
      ORGANICLEVER_BE_NATS_URL: nats://dummy:4222
      ORGANICLEVER_BE_CRANE_URL: http://dummy:8300
    depends_on:
      postgres:
        condition: service_healthy
    command: ["cargo", "test", "--test", "integration"]
