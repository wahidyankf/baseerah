[package]
name = "rhino-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Repository Hygiene & INtegration Orchestrator — Rust port"
license = "MIT"
publish = false

[[bin]]
name = "rhino-cli"
path = "src/main.rs"

[lib]
name = "rhino_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
walkdir = "2.5.0"
ignore = "0.4.25"
regex = "1.12.3"
pulldown-cmark = "0.13.4"
tree-sitter = "0.26.9"
anyhow = "1.0.102"
thiserror = "2.0.18"

[dev-dependencies]
cucumber = "0.23.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.14.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
