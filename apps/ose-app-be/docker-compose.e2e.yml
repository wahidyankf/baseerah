services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ose_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    command: ["-js"]
    ports:
      - "4222:4222"

  crane-be:
    image: crane-be:local
    ports:
      - "8300:8300"
    environment:
      CRANE_BE_PORT: "8300"
      CRANE_BE_ORGANICLEVER_NATS_URL: nats://nats:4222
      CRANE_BE_OSE_APP_NATS_URL: nats://nats:4222
    depends_on:
      - nats
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8300/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
