services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ose_app
      POSTGRES_PASSWORD: ose_app
      POSTGRES_DB: ose_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ose_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: apps/ose-app-be/Dockerfile.integration
    environment:
      DATABASE_URL: postgres://ose_app:ose_app@postgres:5432/ose_app
      PORT: "8302"
      CORS_ORIGINS: "*"
      OSE_APP_BE_NATS_URL: nats://dummy:4222
      OSE_APP_BE_CRANE_URL: http://dummy:8300
    ports:
      - "8302:8302"
    depends_on:
      postgres:
        condition: service_healthy

  test-runner:
    build:
      context: ../..
      dockerfile: apps/ose-app-be/Dockerfile.integration
      target: builder
    volumes:
      - ../../specs:/specs:ro
    environment:
      DATABASE_URL: postgres://ose_app:ose_app@postgres:5432/ose_app
      API_BASE_URL: http://app:8302
      OSE_APP_BE_NATS_URL: nats://dummy:4222
      OSE_APP_BE_CRANE_URL: http://dummy:8300
    depends_on:
      - app
    command: ["cargo", "test", "--test", "integration"]
