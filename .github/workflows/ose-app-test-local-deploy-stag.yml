name: ose-app-test-local-deploy-stag

# Heavy-test CRON pipeline for the ose-app app-group (web + be + e2e).
# On success force-pushes BOTH stag-ose-app-web (Vercel preview) and
# stag-ose-be (triggers ose-be-build-deploy-stag.yml).

on:
  schedule:
    - cron: "0 20 * * *" # 3 AM WIB (UTC+7)
    - cron: "0 8 * * *" # 3 PM WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-local-deploy-stag:
    uses: ./.github/workflows/_reusable-app-test-local-deploy-stag.yml
    with:
      web-project: ose-app-web
      be-project: ose-be
      contracts-project: ose-contracts
      compose-dir: infra/dev/ose-app
      stag-web-branch: stag-ose-app-web
      stag-be-branch: stag-ose-be
      be-port: 8302
      web-port: 3300
      environment: ose-app-local
