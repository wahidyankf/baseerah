name: _reusable-app-test-local-deploy-stag

# Combined same-origin runtime verification. It intentionally publishes no
# staging branch: no combined staging target is provisioned yet.
on:
  workflow_call:
    inputs:
      web-project:
        required: true
        type: string
      be-project:
        required: true
        type: string
      contracts-project:
        required: true
        type: string
      compose-dir:
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Combined runtime quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - name: Run unit, integration, and specification gates
        run: |
          npx nx run ${{ inputs.be-project }}:test:quick
          npx nx run ${{ inputs.be-project }}:test:integration
          npx nx run ${{ inputs.web-project }}:test:quick
          npx nx run ${{ inputs.web-project }}:test:integration
          npx nx run ${{ inputs.be-project }}-e2e:test:specs
          npx nx run ${{ inputs.web-project }}-e2e:test:specs

  e2e:
    name: Combined same-origin E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - name: Start one disposable combined runtime
        shell: bash
        run: |
          set -euo pipefail
          beaver_nest_ci_root=$(mktemp -d)
          install -d -m 0700 "$beaver_nest_ci_root/data" "$beaver_nest_ci_root/backups"
          {
            echo "BEAVER_NEST_CI_ROOT=$beaver_nest_ci_root"
            echo "BEAVER_NEST_BE_VPN_HOST_IP=127.0.0.1"
            echo "BEAVER_NEST_BE_PUBLIC_PORT=19300"
            echo "BEAVER_NEST_BE_HOST_DATA_DIRECTORY=$beaver_nest_ci_root/data"
            echo "BEAVER_NEST_BE_BACKUP_DIRECTORY=$beaver_nest_ci_root/backups"
          } >> "$GITHUB_ENV"
          docker compose --env-file /dev/null -f ${{ inputs.compose-dir }}/docker-compose.yml -f ${{ inputs.compose-dir }}/docker-compose.ci.yml build beaver-nest-app
          docker compose --env-file /dev/null -f ${{ inputs.compose-dir }}/docker-compose.yml -f ${{ inputs.compose-dir }}/docker-compose.ci.yml run --rm --no-deps --user 0:0 --entrypoint sh beaver-nest-app -ceu 'chown 10001:10001 /var/lib/beaver-nest && chmod 0700 /var/lib/beaver-nest'
          docker compose --env-file /dev/null -f ${{ inputs.compose-dir }}/docker-compose.yml -f ${{ inputs.compose-dir }}/docker-compose.ci.yml up -d beaver-nest-app
      - name: Wait for combined origin
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:19300/api/v1/readiness >/dev/null && exit 0
            sleep 2
          done
          docker compose --env-file /dev/null -f ${{ inputs.compose-dir }}/docker-compose.yml -f ${{ inputs.compose-dir }}/docker-compose.ci.yml logs beaver-nest-app
          exit 1
      - name: Run pure BE and FE E2E runners
        run: |
          npx nx run ${{ inputs.be-project }}-e2e:test:e2e:runner
          npx nx run ${{ inputs.web-project }}-e2e:test:e2e:runner
        env:
          API_BASE_URL: http://127.0.0.1:19300
          WEB_BASE_URL: http://127.0.0.1:19300
      - name: Teardown combined runtime
        if: always()
        run: |
          docker compose --env-file /dev/null -f ${{ inputs.compose-dir }}/docker-compose.yml -f ${{ inputs.compose-dir }}/docker-compose.ci.yml down --remove-orphans
          rm -rf -- "$BEAVER_NEST_CI_ROOT"
