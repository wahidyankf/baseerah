name: beaver-nest-be-build-deploy-stag

# Fires when the app-tier local-deploy-stag run force-pushes stag-beaver-nest-be.
# Builds the beaver-nest-be image and pushes it to GHCR.

on:
  push:
    branches: [stag-beaver-nest-be]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    uses: ./.github/workflows/_reusable-be-build-deploy.yml
    with:
      be-project: beaver-nest-be
      image-name: ghcr.io/wahidyankf/beaver-nest-be
