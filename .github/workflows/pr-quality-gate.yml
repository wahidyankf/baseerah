name: PR - Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  detect:
    name: Detect affected languages
    runs-on: ubuntu-latest
    outputs:
      has-ts: ${{ steps.detect.outputs.has-ts }}
      has-golang: ${{ steps.detect.outputs.has-golang }}
      has-dotnet: ${{ steps.detect.outputs.has-dotnet }}
      has-rust: ${{ steps.detect.outputs.has-rust }}
      has-markdown: ${{ steps.detect.outputs.has-markdown }}
    env:
      NX_BASE: origin/${{ github.base_ref }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        run: |
          AFFECTED=$(npx nx show projects --affected 2>/dev/null || echo "")
          # Check language tags for affected projects
          {
            echo "has-ts=false"
            echo "has-golang=false"
            echo "has-dotnet=false"
            echo "has-rust=false"
            echo "has-markdown=false"
          } >> "$GITHUB_OUTPUT"

          for project in $AFFECTED; do
            TAGS=$(npx nx show project "$project" --json 2>/dev/null | jq -r '.tags[]' 2>/dev/null || echo "")
            for tag in $TAGS; do
              case "$tag" in
                lang:ts) echo "has-ts=true" >> "$GITHUB_OUTPUT" ;;
                lang:golang) echo "has-golang=true" >> "$GITHUB_OUTPUT" ;;
                lang:fsharp|lang:csharp) echo "has-dotnet=true" >> "$GITHUB_OUTPUT" ;;
                lang:rust) echo "has-rust=true" >> "$GITHUB_OUTPUT" ;;
              esac
            done
          done

          # Check for markdown changes
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          if echo "$CHANGED_FILES" | grep -q '\.md$'; then
            echo "has-markdown=true" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npx prettier --check .

  shell:
    name: Shell lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ShellCheck (warning threshold)
        run: |
          shellcheck --version
          files=$(git ls-files '*.sh' | grep -v 'husky/_/' | grep -v '^archived/')
          # shellcheck disable=SC2086 # word-splitting the file list is intentional
          shellcheck --severity=warning $files

  dockerfile:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: hadolint (warning threshold)
        run: |
          sudo curl -sSL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version
          files=$(git ls-files | grep -iE 'Dockerfile' | grep -vE '^archived/')
          # shellcheck disable=SC2086 # word-splitting the file list is intentional
          hadolint --failure-threshold warning $files

  actions:
    name: GitHub Actions lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        run: |
          curl -sSL -o download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash
          bash download-actionlint.bash 1.7.12
          ./actionlint -color

  typescript:
    name: TypeScript quality gate
    needs: detect
    if: needs.detect.outputs.has-ts == 'true'
    runs-on: ubuntu-latest
    env:
      NX_BASE: origin/${{ github.base_ref }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: npx nx affected -t typecheck lint test:quick spec-coverage --exclude='tag:lang:golang,tag:lang:fsharp,tag:lang:csharp,tag:lang:rust'

  golang:
    name: Go quality gate
    needs: detect
    if: needs.detect.outputs.has-golang == 'true'
    runs-on: ubuntu-latest
    env:
      NX_BASE: origin/${{ github.base_ref }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-golang
      - run: npx nx run-many -t typecheck lint test:quick spec-coverage --projects='tag:lang:golang'

  dotnet:
    name: .NET quality gate
    needs: detect
    if: needs.detect.outputs.has-dotnet == 'true'
    runs-on: ubuntu-latest
    env:
      NX_BASE: origin/${{ github.base_ref }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-dotnet
      - run: npx nx run-many -t typecheck lint test:quick spec-coverage --projects='tag:lang:fsharp,tag:lang:csharp'

  rust:
    name: Rust quality gate
    needs: detect
    if: needs.detect.outputs.has-rust == 'true'
    runs-on: ubuntu-latest
    env:
      NX_BASE: origin/${{ github.base_ref }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx run-many -t typecheck lint test:quick spec-coverage --projects='tag:lang:rust'
      - run: npx nx run rhino-cli:fmt:check
      - run: npx nx run rhino-cli:deny:check
      - run: npx nx run rhino-cli:check:msrv

  markdown:
    name: Markdown quality gate
    needs: detect
    if: needs.detect.outputs.has-markdown == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: npm run lint:md

  naming:
    name: Naming validators (agents + workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx run rhino-cli:validate:naming-agents
      - run: npx nx run rhino-cli:validate:naming-workflows

  specs-gate:
    name: Specs gate (BDD+DDD validators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - run: npx nx run-many -t validate:specs-adoption validate:specs-tree validate:specs-counts validate:specs-links --projects=rhino-cli

  quality-gate:
    name: Quality gate
    needs: [detect, format, shell, dockerfile, actions, typescript, golang, dotnet, rust, markdown, naming, specs-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates
        run: |
          echo "Checking quality gate results..."
          # A skipped job is OK (language not affected). Only an actual failure blocks.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more quality gate jobs failed"
            exit 1
          fi
          echo "All quality gates passed"
