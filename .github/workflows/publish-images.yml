name: publish-images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect affected images
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ github.event.before }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        run: |
          # Fall back to HEAD~1 when before is the null SHA (first push / force-push)
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          export NX_BASE="$BASE"
          AFFECTED=$(npx nx show projects --affected 2>/dev/null || echo "")
          # No backend image project is registered yet — Phase 7 adds the
          # baseerah-be case arm and its matching output/publish job.
          for project in $AFFECTED; do
            case "$project" in
              *) ;;
            esac
          done
