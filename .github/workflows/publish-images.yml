name: publish-images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect affected images
    runs-on: ubuntu-latest
    outputs:
      build-baseerah-be: ${{ steps.detect.outputs.build-baseerah-be }}
    env:
      NX_BASE: ${{ github.event.before }}
      NX_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - id: detect
        run: |
          # Fall back to HEAD~1 when before is the null SHA (first push / force-push)
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          export NX_BASE="$BASE"
          AFFECTED=$(npx nx show projects --affected 2>/dev/null || echo "")
          {
            echo "build-baseerah-be=false"
          } >> "$GITHUB_OUTPUT"
          for project in $AFFECTED; do
            case "$project" in
              baseerah-be) echo "build-baseerah-be=true" >> "$GITHUB_OUTPUT" ;;
            esac
          done

  publish-baseerah-be:
    name: Publish baseerah-be
    needs: detect
    if: needs.detect.outputs.build-baseerah-be == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push baseerah-be
        run: |
          docker build -f apps/baseerah-be/Dockerfile \
            -t ghcr.io/wahidyankf/baseerah-be:latest \
            -t ghcr.io/wahidyankf/baseerah-be:${{ github.sha }} \
            .
          docker push ghcr.io/wahidyankf/baseerah-be:latest
          docker push ghcr.io/wahidyankf/baseerah-be:${{ github.sha }}
