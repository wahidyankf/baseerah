name: markdown-validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-markdown:
    name: Validate markdown (mermaid, links, heading-hierarchy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Validate mermaid diagrams
        run: npx nx run rhino-cli:mermaid:validation

      - name: Validate markdown links
        run: npx nx run rhino-cli:links:validation

      - name: Validate heading hierarchy
        run: npx nx run rhino-cli:headings:hierarchy-validation
