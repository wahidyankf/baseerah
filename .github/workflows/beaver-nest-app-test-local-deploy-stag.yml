name: beaver-nest-app-test-local-deploy-stag

# Heavy-test CRON pipeline for the beaver-nest-app app-group (web + be + e2e).
# On success force-pushes BOTH stag-beaver-nest-fe (Vercel preview) and
# stag-beaver-nest-be (triggers beaver-nest-be-build-deploy-stag.yml).

on:
  schedule:
    - cron: "0 20 * * *" # 3 AM WIB (UTC+7)
    - cron: "0 8 * * *" # 3 PM WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-local-deploy-stag:
    uses: ./.github/workflows/_reusable-app-test-local-deploy-stag.yml
    with:
      web-project: beaver-nest-fe
      be-project: beaver-nest-be
      contracts-project: beaver-nest-contracts
      compose-dir: infra/dev/beaver-nest-app
      stag-web-branch: stag-beaver-nest-fe
      stag-be-branch: stag-beaver-nest-be
      be-port: 19320
      web-port: 19310
      environment: beaver-nest-app-local
