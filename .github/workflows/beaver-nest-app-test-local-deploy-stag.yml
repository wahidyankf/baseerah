name: beaver-nest-app-test-local-deploy-stag

# Heavy-test pipeline for the combined BeaverNest image and same-origin E2E.
# No combined staging target is provisioned, so this workflow never deploys.

on:
  schedule:
    - cron: "0 20 * * *" # 3 AM WIB (UTC+7)
    - cron: "0 8 * * *" # 3 PM WIB (UTC+7)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-local-deploy-stag:
    uses: ./.github/workflows/_reusable-app-test-local-deploy-stag.yml
    with:
      web-project: beaver-nest-fe
      be-project: beaver-nest-be
      contracts-project: beaver-nest-contracts
      compose-dir: infra/dev/beaver-nest-app
