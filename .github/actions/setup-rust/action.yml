name: "Setup Rust"
description: "Install Rust toolchain pinned by rust-toolchain.toml, with build cache and cargo-llvm-cov"
inputs:
  cargo-llvm-cov-version:
    description: "cargo-llvm-cov version (used by rhino-cli test:quick coverage gate)"
    required: false
    default: "0.8.5"
runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain (rust-toolchain.toml takes precedence)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy,rustfmt,llvm-tools-preview
        cache: false

    - name: Cargo build cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "apps/rhino-cli -> target"
        shared-key: "rhino-cli"

    - name: Install cargo-llvm-cov
      shell: bash
      run: |
        if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
          cargo install --locked --version ${{ inputs.cargo-llvm-cov-version }} cargo-llvm-cov
        fi
